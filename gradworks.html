00;\n  padding: 1px 6px;\n  border-radius: 4px;\n  background: var(--accent-soft, rgba(56, 182, 245, 0.14));\n  color: var(--accent, #38b6f5);\n}\n.gl-tooltip-en {\n  font-size: 11.5px;\n  color: var(--text-dim, #9aa6bf);\n  font-family: var(--mono, monospace);\n}\n.gl-tooltip-def {\n  color: var(--text, #e6ebf5);\n  font-size: 12.6px;\n  line-height: 1.55;\n}\n\n</style>", "glossary_data_js": "<script>\nwindow.BOOK_GLOSSARY = {\n  \"version\": 1,\n  \"generated_by\": \"docs/build_spec_portal.py\",\n  \"terms\": [\n    {\n      \"ko\": \"관심사 분리 헌장\",\n      \"en\": \"Separation of Concerns Charter\",\n      \"abbr\": \"SoC\",\n      \"def\": \"GoogleDrive 마스터 워크스페이스에서 연구·개발 코드는 Development/, 학술·이력서·행정 문서는 Documents/, 평생 미디어 원본은 Photos/로 엄격히 격리하는 제1 운영 원칙.\",\n      \"chapters\": [\n        \"overview\",\n        \"archive\",\n        \"notes\"\n      ]\n    },\n    {\n      \"ko\": \"Zero-ZIP 정책\",\n      \"en\": \"Zero-ZIP Policy\",\n      \"abbr\": \"Zero-ZIP\",\n      \"def\": \"Google 포토 백업 클라이언트가 압축 아카이브 내부 미디어를 색인하지 못하는 한계를 방지하기 위해 Photos/ 내 모든 .zip/.tar/.7z 파일을 전면 금지하고 즉시 압축 해제하는 정책.\",\n      \"chapters\": [\n        \"overview\",\n        \"archive\",\n        \"notes\"\n      ]\n    },\n    {\n      \"ko\": \"Zero Non-Media 정책\",\n      \"en\": \"Zero Non-Media Policy\",\n      \"abbr\": \"Zero-Doc\",\n      \"def\": \"Photos/ 저장소에 .hwp, .pdf, .pptx, .xlsx, .apk 등 비미디어 파일 혼입을 원천 차단하고 Development/ 또는 Documents/로 이전하는 운영 규칙.\",\n      \"chapters\": [\n        \"overview\",\n        \"archive\",\n        \"notes\"\n      ]\n    },\n    {\n      \"ko\": \"일상 앨범 순도 보존\",\n      \"en\": \"Purity of Daily Feed\",\n      \"abbr\": \"DailyPurity\",\n      \"def\": \"Photos/일상/20XX년/ 폴더에는 카메라로 직접 촬영한 순수 사진·영상(YYYYMMDD_HHMMSS)만 보존하고, 웨딩·해외여행·출장·스크린샷·웹 다운로드를 독립 최상위 폴더로 격리하는 원칙.\",\n      \"chapters\": [\n        \"overview\",\n        \"archive\"\n      ]\n    },\n    {\n      \"ko\": \"단일 진실 공급원\",\n      \"en\": \"Single Source of Truth\",\n      \"abbr\": \"SSOT\",\n      \"def\": \"가이드북의 모든 파라미터, 수식 상수, 파일 경로를 수기 복제하지 않고 빌드 시점에 실제 Python/C++/MATLAB/JSON/Markdown 소스에서 직접 파싱·검증하는 원칙.\",\n      \"chapters\": [\n        \"overview\",\n        \"notes\"\n      ]\n    },\n    {\n      \"ko\": \"서브모듈 모노레포\",\n      \"en\": \"40-Submodule Monorepo\",\n      \"abbr\": \"GitSubmodule\",\n      \"def\": \"Development/ 루트의 .gitmodules를 통해 4개 연구 테마의 40개 독립 Git 저장소를 단일 커밋 트리로 동기화하는 구조.\",\n      \"chapters\": [\n        \"overview\",\n        \"notes\"\n      ]\n    },\n    {\n      \"ko\": \"심층 강화학습 서열 정렬\",\n      \"en\": \"Deep Reinforcement Learning Sequence Alignment\",\n      \"abbr\": \"DQNAlign\",\n      \"def\": \"전역 DP O(N1·N2) 대신 고정 크기 국소 부분정렬 창(window_size)만 관측하며 매 스텝 정방향(0)·삽입(1)·결실(2) 행동을 선택해 선형 시간 O(L)에 정렬 경로를 추적하는 프레임워크 (IEEE OJEMB 2021).\",\n      \"chapters\": [\n        \"bio\",\n        \"overview\"\n      ]\n    },\n    {\n      \"ko\": \"마르코프 결정 과정\",\n      \"en\": \"Markov Decision Process\",\n      \"abbr\": \"MDP\",\n      \"def\": \"서열 정렬 위치 (x, y)를 상태, 국소 윈도우 원-핫 텐서를 관측, 이동 방향 a∈{0,1,2}를 행동, 매칭/불일치/인델 점수를 보상으로 정의한 수학적 의사결정 모델.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"Dueling Double DQN\",\n      \"en\": \"Dueling Double Deep Q-Network\",\n      \"abbr\": \"D3QN\",\n      \"def\": \"상태 가치 V(s)와 이점 A(s,a) 스트림을 분리해 Q값을 결합하고, 행동 선택(mainQN)과 가치 평가(targetQN)를 분리해 과대추정을 억제하는 심층 강화학습 아키텍처.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"Exact Match Skip\",\n      \"en\": \"Exact Match Fast-Forward Heuristic\",\n      \"abbr\": \"Skip\",\n      \"def\": \"현재 정렬 좌표 이후 두 서열의 부분 문자열이 정확히 일치하는 구간에서는 신경망 추론을 건너뛰고 대각선 방향으로 즉시 전진하여 추론 속도를 수십 배 가속하는 기법.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"지퍼 정렬\",\n      \"en\": \"Zipper Alignment\",\n      \"abbr\": \"Zipper\",\n      \"def\": \"다중 서열 정렬(MSA)에서 프로필 간 국소 윈도우를 지퍼처럼 맞물려 단계적으로 병합하는 DQNAlign 확장 알고리즘.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"Seed-and-Extend\",\n      \"en\": \"Seed-and-Extend Genomic Mining\",\n      \"abbr\": \"REminerII\",\n      \"def\": \"고정 길이 WORD_SIZE(14bp) 시드 해싱 및 허용 오차(ALLOW_SIZE=1) 필터링 후 양방향 Greedy X-drop 확장으로 염색체 규모의 반복서열(RE)을 고속 탐색하는 C++ 알고리즘.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"2비트 뉴클레오타이드 패킹\",\n      \"en\": \"2-Bit Nucleotide Bit-Packing\",\n      \"abbr\": \"2-Bit\",\n      \"def\": \"A, C, G, T 염기를 각각 2비트로 부호화해 1바이트당 4개 염기를 저장하고 비트 연산으로 역상보 서열(Reverse Complement)을 고속 처리하는 기법.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"Jukes-Cantor 진화 거리\",\n      \"en\": \"Jukes-Cantor Evolutionary Distance\",\n      \"abbr\": \"JC69\",\n      \"def\": \"관측된 염기 치환 비율 p로부터 다중 치환(Multiple Hits)을 보정해 실제 진화 거리 d = -3/4 ln(1 - 4/3 p)를 추정하는 계통발생 모델.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"신경망 공진화 상호정보\",\n      \"en\": \"Neural Mutual Information Coevolution\",\n      \"abbr\": \"NMI\",\n      \"def\": \"단백질 다중서열정렬(MSA)에서 잔기 쌍 간 공진화 신호를 신경망으로 추정하여 3차원 접촉 맵을 예측하는 기법.\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"바이오마커 특징 선택\",\n      \"en\": \"Cancer Biomarker Feature Selection\",\n      \"abbr\": \"REDNN\",\n      \"def\": \"고차원 유전자 발현/반복서열 행렬에서 F-통계량, 상호정보량, 결정트리 중요도로 핵심 마커를 추려 암 위험도를 분류하는 파이프라인 (US 2019/0385696 A1).\",\n      \"chapters\": [\n        \"bio\"\n      ]\n    },\n    {\n      \"ko\": \"공진 유도 무선전력전송\",\n      \"en\": \"Resonant Inductive Wireless Power Transfer\",\n      \"abbr\": \"3D WPT\",\n      \"def\": \"송신 코일과 수신 코일 간 자기 공진 결합을 이용해 수 미터 거리에서 최대 1 kW급 전력을 무선 전달하는 시스템.\",\n      \"chapters\": [\n        \"wpt\",\n        \"overview\"\n      ]\n    },\n    {\n      \"ko\": \"Tsai 카메라 캘리브레이션\",\n      \"en\": \"Tsai Two-Stage Camera Calibration\",\n      \"abbr\": \"Tsai 11-DoF\",\n      \"def\": \"방사 왜곡에 불변인 반경 방향 평행성 제약(RAC)으로 외부 회전·평행이동 파라미터를 먼저 구한 뒤 초점거리와 왜곡 계수 κ1을 2단계로 추정하는 11자유도 보정 알고리즘.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"양안 3D 광선 삼각측량\",\n      \"en\": \"Binocular Skew-Ray Midpoint Triangulation\",\n      \"abbr\": \"3D Stereo\",\n      \"def\": \"두 대의 보정된 카메라 광학 중심에서 투사된 3차원 광선(Ray) 사이의 최단 수직선분 중점을 계산해 수신기/인체의 3D 월드 좌표 (X,Y,Z)를 복원하는 기법.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"멀티모달 에지 안전 인터록\",\n      \"en\": \"Multimodal Edge Vision Safety Interlock\",\n      \"abbr\": \"WPT-Safety\",\n      \"def\": \"RGB SSD 객체 검출(Coral EdgeTPU)과 FLIR Lepton 장파장 적외선(LWIR) 80×60 열화상 온도 임계값을 결합해 충전 금지 구역 내 인체 진입 시 송신 전력을 즉시 차단하는 기술 (US 12,496,917 B2).\",\n      \"chapters\": [\n        \"wpt\",\n        \"overview\"\n      ]\n    },\n    {\n      \"ko\": \"FLIR Lepton 열화상\",\n      \"en\": \"FLIR Lepton Long-Wave Infrared Sensor\",\n      \"abbr\": \"LWIR\",\n      \"def\": \"8~14 μm 파장 대역의 복사열을 80×60 해상도로 감지해 조도 변화나 마네킹 오검출 없이 실제 인체 체온을 판별하는 열화상 센서.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"Coral EdgeTPU\",\n      \"en\": \"Google Coral Edge Tensor Processing Unit\",\n      \"abbr\": \"EdgeTPU\",\n      \"def\": \"INT8 양자화된 MobileNet SSD V1/V2 텐서플로 라이트 모델을 수 밀리초 내에 추론하는 저전력 USB/SoM 신경망 가속기.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"주행중 무선충전 전기버스\",\n      \"en\": \"On-Line Electric Vehicle\",\n      \"abbr\": \"OLEV\",\n      \"def\": \"도로 매설 급전 세그먼트로부터 85 kHz 자기장을 통해 주행 또는 정차 중 무선으로 전력을 공급받는 KAIST 개발 전기버스 시스템.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"UTM 좌표 변환\",\n      \"en\": \"Universal Transverse Mercator Projection\",\n      \"abbr\": \"UTM\",\n      \"def\": \"WGS84 위경도 좌표를 미터(m) 단위의 2차원 평면 직교 좌표로 투영하여 차량 주행 거리, 속도, 급전소 접근 반경을 정밀 계산하는 측지 좌표계.\",\n      \"chapters\": [\n        \"wpt\"\n      ]\n    },\n    {\n      \"ko\": \"동시 무선 정보 및 전력 전송\",\n      \"en\": \"Simultaneous Wireless Information and Power Transfer\",\n      \"a 듀얼 뷰어 Split-Wipe\",\n      \"en\": \"Dual-Viewer Before/After Split-Wipe & Loupe\",\n      \"abbr\": \"Split-Wipe\",\n      \"def\": \"원본 이미지와 색보정/복원 결과물을 드래그 가능한 분할선(Split-Wipe)과 동기화 줌 루페(Synchronized Loupe)로 픽셀 단위 비교하는 인터랙티브 뷰어.\",\n      \"chapters\": [\n        \"archive\",\n        \"life\"\n      ]\n    }\n  ]\n};\n\n\n(function() {\n  window.addEventListener('DOMContentLoaded', () => {\n    // Rewrite repo source code pills (<a class=\"src\">) to GitHub repo URLs so they don't 404 on external hosting\n    document.querySelectorAll('a.src[href]').forEach((a) => {\n      const h = a.getAttribute('href') || '';\n      if (h.startsWith('../')) {\n        const rel = h.replace(/^(\\.\\.\\/)+/, '');\n        if (rel.startsWith('Documents/')) {\n          a.href = 'https://github.com/yjqkrtk-ux/kaist-academic-documents/blob/main/' + rel.slice('Documents/'.length);\n        } else if (rel.startsWith('Photos/')) {\n          a.href = 'https://github.com/yjqkrtk-ux/kaist-grad-works';\n        } else {\n          a.href = 'https://github.com/yjqkrtk-ux/kaist-grad-works/blob/main/' + rel;\n        }\n        a.target = '_blank';\n        a.rel = 'noopener noreferrer';\n      }\n    });\n    // Bridge internal chapter links to SPA parent when running inside All-in-One bundle\n    document.addEventListener('click', (e) => {\n      const a = e.target.closest && e.target.closest('a[href]');\n      if (!a || a.classList.contains('src')) return;\n      const href = a.getAttribute('href') || '';\n      if (!href || href.startsWith('http://') || href.startsWith('https://') || href.startsWith('#')) return;\n      let targetSlug = null;\n      let targetHash = '';\n      const [pathPart, hashPart] = href.split('#');\n      if (hashPart) targetHash = hashPart;\n      if (pathPart.endsWith('index.html') || pathPart === './' || pathPart === '../index.html') {\n        targetSlug = 'home';\n      } else {\n        const m = pathPart.match(/([a-z0-9_]+)\\.html$/i);\n        if (m) targetSlug = m[1];\n      }\n      if (targetSlug && window.parent && typeof window.parent.__sbOpenPage === 'function') {\n        e.preventDefault();\n        window.parent.__sbOpenPage(targetSlug, targetHash);\n      }\n    }, true);\n  });\n})();\n\n<\/script>", "common_js": "<script>\n/* ==========================================================================\n   Workspace & KAIST Grad Works Guidebook — 공통 런타임 (SensorBook 프레임워크)\n   ========================================================================== */\n(function () {\n  const SB = (window.SB = window.SB || {});\n\n  SB.CHAPTERS = [\n  {\n    \"slug\": \"overview\",\n    \"num\": \"01\",\n    \"title\": \"마스터 워크스페이스 3대 기둥 & 5대 엔지니어링 테마 총괄\",\n    \"desc\": \"GoogleDrive 3대 기둥(Development · Documents · Photos)의 6대 운영 헌장, 40개 Git 서브모듈 + Theme 5 오토메이션 토폴로지, 학위논문·특허 계보를 한눈에 해부합니다.\",\n    \"tags\": [\n      \"3-Pillar\",\n      \"40 Submodules\",\n      \"sim\"\n    ]\n  },\n  {\n    \"slug\": \"bio\",\n    \"num\": \"02\",\n    \"title\": \"심층 강화학습 서열 정렬 (DQNAlign) & 고속 유전체 마이닝\",\n    \"desc\": \"전역 DP O(N1·N2) 장벽을 국소 슬라이딩 윈도우 MDP와 Dueling Double DQN + Exact Match Skip으로 돌파한 박사학위 핵심 파이프라인(IEEE OJEMB)과 REminerII·REDNN을 다룹니다.\",\n    \"tags\": [\n      \"DQNAlign\",\n      \"REminerII\",\n      \"sim\"\n    ]\n  },\n  {\n    \"slug\": \"wpt\",\n    \"num\": \"03\",\n    \"title\": \"3D 공진 무선전력전송 · 에지 비전 안전 제어 & OLEV 텔레매틱스\",\n    \"desc\": \"Tsai 11-DoF 핀홀 캘리브레이션과 양안 3D 광선 삼각측량, FLIR Lepton 열화상·Coral EdgeTPU 기반 인체 감지 차단(US 12,496,917 B2), 85kHz OLEV 텔레매틱스를 분석합니다.\",\n    \"tags\": [\n      \"US 12,496,917 B2\",\n      \"3d\",\n      \"sim\"\n    ]\n  },\n  {\n    \"slug\": \"automation\",\n    \"num\": \"04\",\n    \"title\": \"지능형 비전 자동화 · 마르코프 확률 모델링 & 특수 임베디드 시스템\",\n    \"desc\": \"Win32 DirectInput 스캔코드와 13-상태 우선순위 FSM, 찬스 타임을 반영한 흡수 마르코프 체인(StarForce), 로파고(Lophago), Casio 128×64 엔진 및 WINNER II 3D MIMO 채널을 다룹니다.\",\n    \"tags\": [\n      \"PyMaple FSM\",\n      \"StarForce Markov\",\n      \"sim\"\n    ]\ ", \"hash\": \"glossary-sec\", \"keywords\": \"Dueling Double DQN Dueling Double Deep Q-Network D3QN 상태 가치 V(s)와 이점 A(s,a) 스트림을 분리해 Q값을 결합하고, 행동 선택(mainQN)과 가치 평가(targetQN)를 분리해 과대추정을 억제하는 심층 강화학습 아키텍처.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"Exact Match Skip (Skip)\", \"hash\": \"glossary-sec\", \"keywords\": \"Exact Match Skip Exact Match Fast-Forward Heuristic Skip 현재 정렬 좌표 이후 두 서열의 부분 문자열이 정확히 일치하는 구간에서는 신경망 추론을 건너뛰고 대각선 방향으로 즉시 전진하여 추론 속도를 수십 배 가속하는 기법.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"지퍼 정렬 (Zipper)\", \"hash\": \"glossary-sec\", \"keywords\": \"지퍼 정렬 Zipper Alignment Zipper 다중 서열 정렬(MSA)에서 프로필 간 국소 윈도우를 지퍼처럼 맞물려 단계적으로 병합하는 DQNAlign 확장 알고리즘.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"Seed-and-Extend (REminerII)\", \"hash\": \"glossary-sec\", \"keywords\": \"Seed-and-Extend Seed-and-Extend Genomic Mining REminerII 고정 길이 WORD_SIZE(14bp) 시드 해싱 및 허용 오차(ALLOW_SIZE=1) 필터링 후 양방향 Greedy X-drop 확장으로 염색체 규모의 반복서열(RE)을 고속 탐색하는 C++ 알고리즘.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"2비트 뉴클레오타이드 패킹 (2-Bit)\", \"hash\": \"glossary-sec\", \"keywords\": \"2비트 뉴클레오타이드 패킹 2-Bit Nucleotide Bit-Packing 2-Bit A, C, G, T 염기를 각각 2비트로 부호화해 1바이트당 4개 염기를 저장하고 비트 연산으로 역상보 서열(Reverse Complement)을 고속 처리하는 기법.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"Jukes-Cantor 진화 거리 (JC69)\", \"hash\": \"glossary-sec\", \"keywords\": \"Jukes-Cantor 진화 거리 Jukes-Cantor Evolutionary Distance JC69 관측된 염기 치환 비율 p로부터 다중 치환(Multiple Hits)을 보정해 실제 진화 거리 d = -3/4 ln(1 - 4/3 p)를 추정하는 계통발생 모델.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"신 e Detector & SFace 128-D Embedding SFace 경량 얼굴 검출기 YuNet(conf≥0.6)과 128차원 L2 정규화 특징 벡터 SFace(코사인 유사도≥0.360)를 결합해 인물 클러스터링·검색을 수행하는 비전 파이프라인.\"}, {\"type\": \"용어\", \"slug\": \"notes\", \"num\": \"07\", \"chTitle\": \"용어집 & 코드·문서·특허·아카이브 정합성 검증 노트\", \"title\": \"듀얼 뷰어 Split-Wipe (Split-Wipe)\", \"hash\": \"glossary-sec\", \"keywords\": \"듀얼 뷰어 Split-Wipe Dual-Viewer Before/After Split-Wipe & Loupe Split-Wipe 원본 이미지와 색보정/복원 결과물을 드래그 가능한 분할선(Split-Wipe)과 동기화 줌 루페(Synchronized Loupe)로 픽셀 단위 비교하는 인터랙티브 뷰어.\"}];\n\n  const LOGO = `<svg viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect x=\"2\" y=\"2\" width=\"11\" height=\"11\" rx=\"3\" fill=\"#e0443e\"/>\n    <rect x=\"15\" y=\"2\" width=\"11\" height=\"11\" rx=\"3\" fill=\"#2da44e\"/>\n    <rect x=\"2\" y=\"15\" width=\"11\" height=\"11\" rx=\"3\" fill=\"#2da44e\" opacity=\".82\"/>\n    <rect x=\"15\" y=\"15\" width=\"11\" height=\"11\" rx=\"3\" fill=\"#2f6fe0\"/>\n  </svg>`;\n\n  function rootPrefix() {\n    const b = document.body;\n    if (b && b.dataset.root) return b.dataset.root;\n    return location.pathname.includes(\"/chapters/\") ? \"../\" : \"\";\n  }\n  function currentSlug() {\n    const b = document.body;\n    if (b && b.dataset.chapter) return b.dataset.chapter;\n    const m = location.pathname.match(/\\/chapters\\/([^\\/]+)\\.html/);\n    return m ? m[1] : \"index\";\n  }\n\n  // ---------- Theme ----------\n  const THEME_KEY = \"kaist-grad-works-book-theme\";\n  function getSavedTheme() { try { return localStorage.getItem(THEME_KEY); } catch { return null; } }\n  function applyTheme(t) {\n    if (t === \"light\" || t === \"dark\") {\n      document.documentElement.setAttribute(\"data-theme\", t);\n    } else {\n      document.documentElement.removeAttribute(\"data-theme\");\n    }\n    window.dispatchEvent(new CustomEvent(\"sb:theme\"));\n  }\n  const saved = getSavedTheme();\n  if (saved) applyTheme(saved);\n\n  SB.isDark = function () {\n    const attr = document.documentElement.getAttribute(\"data-theme\");\n    if (attr === \"dark\") return true;\n    if (attr === \"light\") return false;\n    return window.matchMedia && window.matchMedia(\"(prefers-color-scheme: dark)\").matches;\n  };\n  SB.cssVar = function (name) {\n    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();\n  };\n  SB.palette = function () {\n    const dark = SB.isDark();\n    return {\n      dark,\n      bg: SB.cssVar(\"--canvas-bg\") || (dark ? \"#0f1522\" : \"#ffffff\"),\n      text: SB.cssVar(\"--text\") || (dark ? \"#e6ebf5\" : \"#141a26\"),\n      dim: SB.cssVar(\"--text-dim\") || (dark ? \"#9aa6bf\" : \"#566178\"),\n      faint: SB.cssVar(\"--text-faint\") || (dark ? \"#69748c\" : \"#8a93a8\"),\n      border: SB.cssVar(\"--border\") || (dark ? \"#273248\" : \"#d6dce8\"),\n      surface: SB.cssVar(\"--surface\") || (dark ? \"#171f30\" : \"#eef1f7\"),\n      accent: SB.cssVar(\"--accent\") || (dark ? \"#38b6f5\" : \"#0a84c6\"),\n      accent2: SB.cssVar(\"--accent-2\") || (dark ? \"#a585ff\" : \"#7a4ce0\"),\n      ok: SB.cssVar(\"--ok\") || \"#2da44e\",\n      warn: SB.cssVar(\"--warn\") || \"#d98a00\",\n      bad: SB.cssVar(\"--bad\") || \"#e0443e\",\n      red: SB.cssVar(\"--red\") || \"#e0443e\",\n      green: SB.cssVar(\"--green\") || \"#2da44e\",\n      blue: SB.cssVar(\"--blue\") || \"#2f6fe0\",\n      grid: SB.cssVar(\"--grid\") || \"rgba(128,128,128,0.12)\",\n      axis: SB.cssVar(\"--axis\") || \"rgba(128,128,128,0.5)\",\n    };\n  };\n\n  // ---------- Mount Topbar + Drawer ----------\n  function mountTopbar() {\n    const root = rootPrefix();\n    const slug = currentSlug();\n    const cur = SB.CHAPTERS.find(c => c.slug === slug);\n\n    const bar = document.createElement(\"header\");\n    bar.className = \"sb-topbar\";\n    bar.innerHTML = `\n      <button class=\"sb-iconbtn\" id=\"sb-open-drawer\" aria-label=\"목차 열기\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 6h16M4 12h16M4 18h12\"/></svg>\n        <span>챕터 ${cur ? cur.num : \"목차\"}</span>\n      </button>\n      <a class=\"sb-brand\" href=\"${root}index.html\">\n        ${LOGO}\n        <span>KAIST GRAD WORKS &amp; WORKSPACE <small>인터랙티브 아키텍처 가이드북</small></span>\n      </a>\n      <div class=\"sp\"></div>\n      <div class=\"book-search\" id=\"book-search\">\n        <input type=\"search\" class=\"book-search-input\" id=\"book-search-input\" placeholder=\"검색 (용어·시뮬레이터·섹션)…\" autocomplete=\"off\" aria-label=\"책 전체 검색\">\n        <div class=\"book-search-results\" id=\"book-search-results\" hidden></div>\n      </div>\n      <a class=\"sb-iconbtn series-link\" href=\"${root}chapters/notes.html\" title=\"용어집 및 코드·문서·아카이브 정합성 검증 노트\">\n        <span>용어집 · 검증</span>\n      </a>\n      <button class=\"sb-iconbtn\" id=\"sb-theme\" aria-label=\"테마 전환\" title=\"라이트/다크 전환\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z\"/></svg>\n      </button>\n      <div class=\"sb-progress\" id=\"sb-progress\"></div>\n    `;\n    document.body.prepend(bar);\n\n    const backdrop = document.createElement(\"div\");\n    backdrop.className = \"sb-drawer-backdrop\";\n    const drawer = document.createElement(\"aside\");\n    drawer.className = \"sb-drawer\";\n    drawer.innerHTML = `\n      <div class=\"sb-drawer-head\">\n        <span>전체 목차 (7 Chapters · 3 Pillars)</span>\n        <button class=\"sb-iconbtn\" id=\"sb-close-drawer\">닫기</button>\n      </div>\n      <nav class=\"sb-drawer-list\">\n        <a href=\"${root}index.html\" class=\"${slug === \"index\" ? \"active\" : \"\"}\">\n          <span class=\"num\">HOME</span>\n          <span>가이드북 홈 · 3대 기둥 &amp; 5대 테마 로드맵</span>\n        </a>\n        ${SB.CHAPTERS.map(c => `\n          <a href=\"${root}chapters/${c.slug}.html\" class=\"${c.slug === slug ? \"active\" : \"\"}\">\n            <span class=\"num\">CH.${c.num}</span>\n            <span>${c.title}<div class=\"sub\">${c.desc}</div></span>\n          </a>\n        `).join(\"\")}\n      </nav>\n    `;\n    document.body.appendChild(backdrop);\n    document.body.appendChild(drawer);\n\n    const close = () => document.body.classList.remove(\"drawer-open\");\n    document.getElementById(\"sb-open-drawer\").addEventListener(\"click\", () => document.body.classList.add(\"drawer-open\"));\n    document.getElementById(\"sb-close-drawer\").addEventListener(\"click\", close);\n    backdrop.addEventListener(\"click\", close);\n    window.addEventListener(\"keydown\", e => { if (e.key === \"Escape\") close(); });\n\n    document.getElementById(\"sb-theme\").addEventListener(\"click\", () => {\n      const next = SB.isDark() ? \"light\" : \"dark\";\n      try { localStorage.setItem(THEME_KEY, next); } catch {}\n      applyTheme(next);\n    });\n\n    const prog = document.getElementById(\"sb-progress\");\n    const onScroll = () => {\n      const h = document.documentElement;\n      const max = Math.max(1, h.scrollHeight - h.clientHeight);\n      prog.style.width = Math.min(100, (h.scrollTop / max) * 100).toFixed(1) + \"%\";\n    };\n    window.addEventListener(\"scroll\", onScroll, { passive: true });\n    onScroll();\n  }\n\n  // ---------- Mount Right-hand TOC + Section Numbering ----------\n  function mountToc() {\n    document.querySelectorAll(\"main.chapter\").forEach(main => {\n      if (main.dataset.tocMounted) return;\n      main.dataset.tocMounted = \"1\";\n      const pageWrap = main.closest(\"[data-slug]\");\n      const slugPrefix = pageWrap ? pageWrap.dataset.slug + \"-\" : \"\";\n      let layout = main.closest(\".sb-layout\");\n      if (!layout) {\n        layout = document.createElement(\"div\");\n        layout.className = \"sb-layout\";\n        main.parentNode.insertBefore(layout, main);\n        layout.appendChild(main);\n      }\n      const sections = Array.from(main.querySelectorAll(\":scope > section\"));\n      if (!sections.length) return;\n\n      const toc = document.createElement(\"aside\");\n      toc.className = \"sb-toc\";\n      toc.innerHTML = `<h4>On this page</h4>`;\n      const links = [];\n\n      sections.forEach((sec, idx) => {\n        const h2 = sec.querySelector(\"h2\");\n        if (!h2) return;\n        if (!sec.id) sec.id = \"sec-\" + slugPrefix + (idx + 1);\n        const rawTitle = h2.textContent.replace(/^\\s*\\d+(\\.\\d+)?\\s*/, \"\").trim();\n        if (!h2.querySelector(\".h-num\") && !sec.classList.contains(\"keypoints\")) {\n          const num = String(idx + 1).padStart(2, \"0\");\n          h2.innerHTML = `<span class=\"h-num\">${num}</span><span>${h2.innerHTML}</span>`;\n        }\n        const a = document.createElement(\"a\");\n        a.href = \"#\" + sec.id;\n        a.textContent = rawTitle;\n        toc.appendChild(a);\n        links.push({ sec, a });\n      });\n      layout.appendChild(toc);\n\n      const spy = () => {\n        if (pageWrap && pageWrap.hidden) return;\n        const y = window.scrollY + 110;\n        let active = links[0];\n        for (const item of links) {\n          if (item.sec.offsetTop <= y) active = item;\n        }\n        links.forEach(item => item.a.classList.toggle(\"on\", item === active));\n      };\n      window.addEventListener(\"scroll\", spy, { passive: true });\n      spy();\n    });\n  }\n\n  // ---------- Mount Prev / Next Pager ----------\n  function mountPager() {\n    document.querySelectorAll(\"main.chapter\").forEach(main => {\n      if (main.dataset.pagerMounted) return;\n      main.dataset.pagerMounted = \"1\";\n      const pageWrap = main.closest(\"[data-slug]\");\n      const slug = (pageWrap && pageWrap.dataset.slug) || currentSlug();\n      const idx = SB.CHAPTERS.findIndex(c => c.slug === slug);\n      if (idx < 0) return;\n      const prev = SB.CHAPTERS[idx - 1];\n      const next = SB.CHAPTERS[idx + 1];\n  else {\n    boot();\n  }\n})();\n\n<\/script>", "glossary_js": "<script>\n/* ==========================================================================\n   Shared Glossary Hover Tooltip Highlighter (SensorBook style)\n   ========================================================================== */\n(function () {\n  if (window.BookGlossary) return;\n  const data = window.BOOK_GLOSSARY;\n  if (!data || !Array.isArray(data.terms) || !data.terms.length) return;\n\n  const SKIP_TAGS = new Set([\n    \"A\", \"BUTTON\", \"CODE\", \"PRE\", \"SCRIPT\", \"STYLE\", \"SVG\", \"CANVAS\",\n    \"INPUT\", \"SELECT\", \"TEXTAREA\", \"OUTPUT\", \"KBD\", \"MATH\", \"H1\", \"H2\", \"H3\", \"H4\",\n    \"FIGCAPTION\", \"SUMMARY\", \"TH\", \"TEXT\", \"TSPAN\", \"G\", \"DEFS\", \"FOREIGNOBJECT\"\n  ]);\n  const SKIP_CLASSES = [\n    \"katex\", \"formula\", \"math-block\", \"sim\", \"sim-card\", \"sb-topbar\", \"sb-drawer\",\n    \"sb-toc\", \"sb-pager\", \"gl-term\", \"src\", \"diagram\", \"svg-wrap\", \"inspector-box\",\n    \"ch-card\", \"numbers\", \"paths\", \"flow\", \"filter-row\", \"gl-list\", \"glossary-grid\"\n  ];\n\n  const entries = [];\n  const byKey = new Map();\n\n  data.terms.forEach((item, idx) => {\n    const id = \"t\" + idx;\n    byKey.set(id, item);\n    const candidates = new Set();\n    if (item.ko && item.ko.length >= 2) candidates.add(item.ko.trim());\n    if (item.abbr && item.abbr.length >= 2) candidates.add(item.abbr.trim());\n    if (item.en && item.en.length >= 3 && item.en.length <= 28) candidates.add(item.en.trim());\n    candidates.forEach(surface => {\n      if (surface.length < 2) return;\n      entries.push({ surface, id, len: surface.length, isAscii: /^[\\x00-\\x7F]+$/.test(surface) });\n    });\n  });\n\n  entries.sort((a, b) => b.len - a.len);\n  const surfaceToEntry = new Map();\n  entries.forEach(e => {\n    const k = e.isAscii ? e.surface.toLowerCase() : e.surface;\n    if (!surfaceToEntry.has(k)) surfaceToEntry.set(k, e);\n  });\n\n  function escRe(s) { return s.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"); }\n  const patternParts = entries.map(e => escRe(e.surface));\n  if (!patternParts.length) return;\n  const masterRe = new RegExp(\"(\" + patternParts.join(\"|\") + \")\", \"gi\");\n\n  function isBoundaryOk(text, start, end, isAscii) {\n    const prev = start > 0 ? text.charCodeAt(start - 1) : 32;\n    const next = end < text.length ? text.charCodeAt(end) : 32;\n    const isWordChar = c => (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95;\n    const isHangul = c => (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E);\n    if (isAscii) {\n      if (isWordChar(prev) || isWordChar(next)) return false;\n      return true;\n    } else {\n      if (isHangul(prev)) return false;\n      return true;\n    }\n  }\n\n  function shouldSkipNode(node) {\n    let cur = node.parentElement;\n    while (cur) {\n      if (cur.namespaceURI === \"http://www.w3.org/2000/svg\") return true;\n      const tn = (cur.tagName || \"\").toUpperCase();\n      if (SKIP_TAGS.has(tn)) return true;\n      if (cur.classList) {\n        for (let i = 0; i < SKIP_CLASSES.length; i++) {\n          if (cur.classList.contains(SKIP_CLASSES[i])) return true;\n        }\n      }\n      cur = cur.parentElement;\n    }\n    return false;\n  }\n\n  function highlightContainer(root, seenIds) {\n    if (!root) return;\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);\n    const textNodes = [];\n    let n;\n    while ((n = walker.nextNode())) {\n      if (!n.nodeValue || n.nodeValue.trim().length < 2) continue;\n      if (shouldSkipNode(n)) continue;\n      textNodes.push(n);\n    }\n\n    textNodes.forEach(tNode => {\n      const text = tNode.nodeValue;\n      masterRe.lastIndex = 0;\n      let m;\n      let lastIdx = 0;\n      let frag = null;\n\n      while ((m = masterRe.exec(text)) !== null) {\n        const matchStr = m[0];\n        const start = m.index;\n        const end = start + matchStr.length;\n        const lookupKey = /^[\\x00-\\x7F]+$/.test(matchStr) ? matchStr.toLowerCase() : matchStr;\n        const entry = surfaceToEntry.get(lookupKey) || surfaceToEntry.get(matchStr);\n        if (!entry) continue;\n        if (seenIds.has(entry.id)) continue;\n        if (!isBoundaryOk(text, start, end, entry.isAscii)) continue;\n\n        if (!frag) frag = document.createDocumentFragment();\n        if (start > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, start)));\n\n        const span = document.createElement(\"span\");\n        span.className = \"gl-term\";\n        span.dataset.glId = entry.id;\n        span.tabIndex = 0;\n        span.textContent = matchStr;\n        frag.appendChild(span);\n\n        seenIds.add(entry.id);\n        lastIdx = end;\n      }\n\n      if (frag) {\n        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));\n        if (tNode.parentNode) tNode.parentNode.replaceChild(frag, tNode);\n      }\n    });\n  }\n\n  let tipEl = null;\n  function ensureTip() {\n    if (tipEl) return tipEl;\n    tipEl = document.createElement(\"div\");\n    tipEl.className = \"gl-tooltip\";\n    tipEl.setAttribute(\"role\", \"tooltip\");\n    document.body.appendChild(tipEl);\n    return tipEl;\n  }\n\n  function showTip(target) {\n    const id = target.dataset.glId;\n    const item = byKey.get(id);\n    if (!item) return;\n    const tip = ensureTip();\n    const abbrHtml = item.abbr ? `<span class=\"gl-tooltip-abbr\">${item.abbr}</span>` : \"\";\n    const enHtml = item.en ? `<span class=\"gl-tooltip-en\">${item.en}</span>` : \"\";\n    tip.innerHTML =\n      `<div class=\"gl-tooltip-head\"><span class=\"gl-tooltip-ko\">${item.ko || \"\"}</span>${abbrHtml}${enHtml}</div>` +\n      `<div class=\"gl-tooltip-def\">${item.def || \"\"}</div>`;\n    tip.classList.add(\"visible\");\n\n    const rect = target.getBoundingClientRect();\n    const tipRect = tip.getBoundingClientRect();\n    let top = rect.bottom + 8;\n    if (top + tipRect.height > window.innerHeight - 12) {\n      top = Math.max(12, rect.top - tipRect.height - 8);\n    }\n    let left = rect.left + rect.width / 2 - tipRect.width / 2;\n    left = Math.max(12, Math.min(window.innerWidth - tipRect.width - 12, left));\n    tip.style.top = top + \"px\";\n    tip.style.left = left + \"px\";\n  }\n\n  function hideTip() {\n    if (tipEl) tipEl.classList.remove(\"visible\");\n  }\n\n  function boot() {\n    if (document.body && document.body.dataset.chapter === \"notes\") return;\n    const mains = document.querySelectorAll(\"main.chapter\");\n    if (mains.length > 1) {\n      mains.forEach(m => {\n        const wrap = m.closest(\"[data-slug]\");\n        if (wrap && wrap.dataset.slug === \"notes\") return;\n        highlightContainer(m, new Set());\n      });\n    } else {\n      const seen = new Set();\n      const root = document.querySelector(\"main.chapter\") || document.querySelector(\"main\") || document.body;\n      highlightContainer(root, seen);\n    }\n\n    document.addEventListener(\"mouseover\", e => {\n      const t = e.target.closest && e.target.closest(\".gl-term\");\n      if (t) showTip(t);\n    });\n    document.addEventListener(\"mouseout\", e => {\n      const t = e.target.closest && e.target.closest(\".gl-term\");\n      if (t) hideTip();\n    });\n    document.addEventListener(\"focusin\", e => {\n      const t = e.target.closest && e.target.closest(\".gl-term\");\n      if (t) showTip(t);\n    });\n    document.addEventListener(\"focusout\", e => {\n      const t = e.target.closest && e.target.closest(\".gl-term\");\n      if (t) hideTip();\n    });\n    window.addEventListener(\"scroll\", hideTip, { passive: true });\n  }\n\n  if (document.readyState === \"loading\") {\n    document.addEventListener(\"DOMContentLoaded\", boot);\n  } else {\n    setTimeout(boot, 60);\n  }\n\n  window.BookGlossary = { highlightContainer, byKey };\n})();\n\n<\/script>"};
window.__SB_PAGES__ = {"home": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>KAIST Grad Works &amp; Master Workspace 인터랙티브 가이드북 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"Development(40개 서브모듈·5대 테마), Documents(KAIST 학술·웹 이력서), Photos(20TB 미디어 아카이브·AI 추억 스튜디오) 통합 인터랙티브 아키텍처 가이드북\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-root=\"\">\n\n<style>\n.paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; align-items: stretch; }\n.path { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; }\n.path h4 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }\n.path p { margin: 0 0 12px; font-size: 13.5px; color: var(--text-dim); flex: 1; }\n.path .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--mono); font-size: 12px; }\n.path .steps a { text-decoration: none; padding: 5px 8px; border-radius: 6px; background: var(--surface); color: var(--text); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.path .steps a:hover { background: var(--accent-soft); color: var(--accent); }\n.chain { margin: 20px 0 8px; }\n.numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }\n.numbers div { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 1 n</section>\n\n<section class=\"home-section\">\n  <h2>한눈에 보는 마스터 워크스페이스 3대 기둥 (Development · Documents · Photos)</h2>\n  <p class=\"sub\">엄격한 관심사 분리(Rule 1), Zero-ZIP(Rule 2), Zero Non-Media(Rule 3), 일상 순도 보존(Rule 4), 개인정보 격리(Rule 5), EXIF·클라우드 무결성(Rule 6) 위에서 세 저장소가 유기적으로 연동됩니다.</p>\n  <figure class=\"diagram chain\">\n    <svg viewBox=\"0 0 980 210\" role=\"img\" aria-label=\"GoogleDrive 3대 마스터 저장소 및 7개 챕터 연동 아키텍처\">\n      <defs>\n        <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n          <path d=\"M0 0L10 5L0 10z\" fill=\"var(--accent)\"/>\n        </marker>\n      </defs>\n      <g transform=\"translate(10,14)\">\n        <rect x=\"0\" y=\"16\" width=\"295\" height=\"148\" rx=\"12\" class=\"f-acc-soft\"/>\n        <text x=\"147\" y=\"42\" text-anchor=\"middle\" class=\"t-acc\">① Development/ (연구·개발 모노레포)</text>\n        <text x=\"147\" y=\"64\" text-anchor=\"middle\" class=\"t-mono\">kaist-grad-works · 40 Git Submodules</text>\n        <text x=\"147\" y=\"88\" text-anchor=\"middle\" class=\"t-dim\">Ch.02 DQNAlign · REminerII · REDNN</text>\n        <text x=\"147\" y=\"108\" text-anchor=\"middle\" class=\"t-dim\">Ch.03 3D WPT (US 12,496,917 B2) · OLEV</text>\n        <text x=\"147\" y=\"128\" text-anchor=\"middle\" class=\"t-dim\">Ch.04 PyMaple FSM · StarForce · Casio SDK</text>\n        <text x=\"147\" y=\"148\" text-anchor=\"middle\" class=\"t-dim\">Ch.05 데이터 엔진 · 웹 플래너 · PPTX 빌더</text>\n\n        <line x1=\"297\" y1=\"90\" x2=\"333\" y2=\"90\" class=\"s-acc\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\n        <rect x=\"335\" y=\"16\" width=\"295\" height=\"148\" rx=\"12\" class=\"f-elev\"/>\n        <text x=\"482\" y=\"42\" text-anchor=\"middle\" class=\"t\" style=\"font-weight:700\">② Documents/ (학술·커리어·보안 문서)</text>\n        <text x=\"482\" y=\"64\" text-anchor=\"middle\" class=\"t-mono\">kaist-academic-documents · Ch.06</text>\n        <text x=\"482\" y=\"88\" text-anchor=\"middle\" class=\"t-dim\">Academic_Coursework (15+ 과목 · 449건)</text>\n        <text x=\"482\" y=\"108\" text-anchor=\"middle\" class=\"t-dim\">Lab_Meetings (430건) · PhD_Admin (129건)</text>\n        <text x=\"482\" y=\"128\" text-anchor=\"middle\" class=\"t-dim\">Resume/ (한/영 웹 CV · Deploy Parity)</text>\n        <text x=\"482\" y=\"148\" text-anchor=\"middle\" class=\"t-dim\">Personal/ (.gitignore 비공개 격리 영역)</text>\n\n        <line x1=\"632\" y1=\"90\" x2=\"668\" y2=\"90\" class=\"s-acc\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\n        <rect x=\"670\" y=\"16\" width=\"290\" height=\"148\" rx=\"12\" class=\"f-acc-soft\"/>\n        <text x=\"815\" y=\"42\" text-anchor=\"middle\" class=\"t-acc\">③ Photos/ (20TB 미디어 아카이브)</text>\n        <text x=\"815\" y=\"64\" text-anchor=\"middle\" class=\"t-mono\">Google Photos Original Quality · Ch.06</text>\n        <text x=\"815\" y=\"88\" text-anchor=\"middle\" class=\"t-dim\">7대 마스터 카테고리 분리 아키텍처</text>\n        <text x=\"815\" y=\"108\" text-anchor=\"middle\" class=\"t-dim\">Zero-ZIP · Zero Non-Media 무결성 헌장</text>\n        <text x=\"815\" y=\"128\" text-anchor=\"middle\" class=\"t-dim\">Daily · Screenshots · Downloads 격리</text>\n        <text x=\"815\" y=\"148\" text-anchor=\"middle\" class=\"t-dim\">Read-Only 연동 → AI Photo Memory Studio</text>\n      </g>\n    </svg>\n    <figcaption><b>그림 0-1.</b> 마스터 워크스페이스 3대 기둥(<code>Development/</code> · <code>Documents/</code> · <code>Photos/</code>)의 역할 경계와 상호 참조 파이프라인. 헌장 정의: <a class=\"src\" href=\"../../GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"GEMINI.md\">GoogleDrive/GEMINI.md</a> · <a class=\"src\" href=\"../GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"GEMINI.md\">Development/GEMINI.md</a> · <a class=\"src\" href=\"../../Photos/GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"Photos/GEMINI.md\">Photos/GEMINI.md</a>.</figcaption>\n  </figure>\n\n  <div class=\"numbers\">\n    <div><b>3 Pillars</b><span><code>Development/</code> · <code>Documents/</code> · <code>Photos/</code> 마스터 격리 체계</span></div>\n    <div><b>40 + 4</b><span>Git 서브모듈(Themes 1–4) + 오토메이션 스위트(Theme 5)</span></div>\n    <div><b>US 12,496,917</b><span>미국 등록특허 B2 포함 한·미 특허 5건 &amp; <i>IEEE OJEMB</i> 논문</span></div>\n    <div><b>1,200+ Docs</b><span>KAIST 전공 강의노트 · UMLS 랩세미나 · 박사학위 심사 · 웹 이력서</span></div>\n    <div><b>20 TB Media</b><span>Google 포토 무손실 7대 카테고리 · Zero-ZIP 아카이브</span></div>\n    <div><b>14 Simulators</b><span>브라우저 내 Canvas/WebGL 실시간 수학·물리·아카이브 실험실</span></div>\n  </div>\n</section>\n\n<section class=\"home-section\" id=\"curriculum\">\n  <h2>전체 커리큘럼 · 7개 챕터</h2>\n  <p class=\"sub\">처음부터 순서대로 읽거나, 아래의 학습 경로에 따라 관심 있는 저장소·테마부터 바로 시작할 수 있습니다.</p>\n  <div class=\"ch-grid\" id=\"chgrid\"></div>\n</section>\n\n<section class=\"home-section\">\n  <h2>추천 학습 경로 (Reading Paths)</h2>\n  <div class=\"paths\">\n    <div class=\"path\">\n      <h4>경로 A · AI · 바이오인포매틱스 · 확률 모델링</h4>\n      <p>심층 강화학습 서열 정렬(DQNAlign), 고속 유전체 마이닝(REminerII), 흡수 마르코프 체인(StarForce)에 집중합니다.</p>\n      <div class=\"steps\">\n        <a href=\"chapters/overview.html\">Ch.01 마스터 총괄</a>\n        <a href=\"chapters/bio.html\">Ch.02 DQNAlign</a>\n        <a href=\"chapters/automation.html\">Ch.04 마르코프 · 비전</a>\n        <a href=\"chapters/notes.html\">Ch.07 정합성 · 용어집</a>\n      </div>\n    </div>\n    <div class=\"path\">\n      <h4>경로 B · 3D 비전 · 무선전력전송 · 임베디드 시스템</h4>\n      <p>Tsai 11-DoF 양안 3D 위치인식, FLIR 열화상 안전 제어(US 12,496,917 B2), OLEV 텔레매틱스 및 Casio SDK를 다룹니다.</p>\n      <div class=\"steps\">\n        <a href=\"chapters/overview.html\">Ch.01 마스터 총괄</a>\n        <a href=\"chapters/wpt.html\">Ch.03 3D WPT · OLEV</a>\n        <a href=\"chapters/automation.html\">Ch.04 Casio · MIMO</a>\n        <a href=\"chapters/notes.html\">Ch.07 정합성 · 용어집</a>\n      </div>\n    </div>\n    <div class=\"path\">\n      <h4>경로 C · 학술·이력서(Documents) · 20TB 미디어(Photos) · 라이프</h4>\n      <p>KAIST 학술·커리어 아카이브, 20TB 평생 사진·홈비디오 거버넌스, AI 추억 스튜디오 및 가계부·여행 자동화를 탐구합니다.</p>\n      <div class=\"steps\">\n        <a href=\"chapters/overview.html\">Ch.01 3대 기둥 헌장</a>\n        <a href=\"chapters/life.html\">Ch.05 라이프 자동화</a>\n        <a href=\"chapters/archive.html\">Ch.06 학술 · 미디어</a>\n        <a href=\"chapters/notes.html\">Ch.07 정합성 · 용어집</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"home-section\">\n  <h2>이 책의 작동 원리 · Single-Source-of-Truth</h2>\n  <div class=\"flow\">\n    <div><b>1. 코드·아카이브 실측 파싱</b><code>.gitmodules</code>, Python/C++/MATLAB 파라미터, <code>Photos/</code> 7대 카테고리, <code>Documents/</code> 아카이브를 빌드 시점에 직접 파싱합니다.</div>\n    <div><b>2. 수식 &amp; 유도 과정</b>핵심 수학 정리(MDP 벨만 방정식, Tsai 캘리브레이션, 흡수 마르코프 기본 행렬)를 펼침 박스(<code>.detail</code>)와 함께 제공합니다.</div>\n    <div><b>3. 14개 인터랙티브 시뮬레이터</b>슬라이더와 버튼을 움직여 DQN 윈도우, 3D 광선 삼각측량, 스타포스 마르코프 체인, 미디어 아카이브 감사기를 즉시 실험합니다.</div>\n    <div><b>4. 본문 클릭 → 실제 파일 이동</b>모든 파일·함수 배지(<code>a.src</code>)는 빌드 시 실존 여부와 라인 번호가 검증된 직결 링크입니다.</div>\n  </div>\n</section>\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  const grid = document.getElementById(\"chgrid\");\n  const tagMap = { \"3d\": '<span class=\"tag t3d\">3D</span>', \"sim\": '<span class=\"tag sim\">인터랙티브</span>' };\n  SB.CHAPTERS.forEach(c => {\n    const a = document.createElement(\"a\");\n    a.className = \"ch-card\";\n    a.href = \"chapters/\" + c.slug + \".html\";\n    const tags = (c.tags || []).map(t => tagMap[t] || `<span class=\"tag\">${t}</span>`).join(\"\");\n    a.innerHTML = `\n      <div class=\"num\">CHAPTER ${c.num}</div>\n      <h3>${c.title}</h3>\n      <p>${c.desc}</p>\n      <div class=\"tags\">${tags}</div>\n    `;\n    grid.appendChild(a);\n  });\n\n  // Hero 3D: 3 Master Pillars (Development / Documents / Photos) + 5 Engineering Satellites\n  const el = document.getElementById(\"hero3d\");\n  if (el && window.SB && SB.three) {\n    SB.three(el, { height: 360, radius: 10.2, phi: 1.1, theta: 0.52 }, T => {\n      const { THREE, scene } = T;\n      const root = new THREE.Group();\n      scene.add(root);\n\n      const pillars = [\n        { x: -3.2, color: 0x0a84c6, emissive: 0x063858, label: \"Development/ (40 Submodules)\", h: 2.3 },\n        { x:  0.0, color: 0x7a4ce0, emissive: 0x2d1863, label: \"Documents/ (KAIST · Resume)\", h: 1.9 },\n        { x:  3.2, color: 0x1f9d55, emissive: 0x0b4223, label: \"Photos/ (20TB Media · Studio)\", h: 2.1 }\n      ];\n\n      const meshes = [];\n      pillars.forEach((p, idx) => {\n        const baseGeo = new THREE.CylinderGeometry(1.05, 1.18, 0.28, 32);\n        const base = new THREE.Mesh(baseGeo, T.material({ color: p.color, roughness: 0.35, metalness: 0.25 }));\n        base.position.set(p.x, -1.35, 0);\n        root.add(base);\n\n        const boxGeo = new THREE.BoxGeometry(1.55, p.h, 1.55);\n        const box = new THREE.Mesh(boxGeo, T.material({ color: p.color, emissive: p.emissive, roughness: 0.28, metalness: 0.3 }));\n        box.position.set(p.x, -1.2 + p.h / 2, 0);\n        root.add(box);\n        meshes.push(box);\n\n        const edges = new THREE.LineSegments(\n          new THREE.EdgesGeometry(boxGeo),\n          new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.38 })\n        );\n        box.add(edges);\n      });\n\n      // Connecting bridges between the 3 pillars\n      const bridgeMat = new THREE.LineBasicMaterial({ color: 0x38b6f5, transparent: true, opacity: 0.55 });\n      [[-3.2, 0.0], [0.0, 3.2]].forEach(([x1, x2]) => {\n        const pts = [new THREE.Vector3(x1, -0.2, 0), new THREE.Vector3((x1 + x2) / 2, 0.55, 0), new THREE.Vector3(x2, -0.2, 0)];\n        const curve = new THREE.QuadraticBezierCurve3(pts[0], pts[1], pts[2]);\n        const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(32));\n        root.add(new THREE.Line(geo, bridgeMat));\n      });\n\n      // Orbiting data packets across the workspace\n      const packets = [];\n      const pGeo = new THREE.SphereGeometry(0.11, 14, 14);\n      const colors = [0x38b6f5, 0xa585ff, 0x3fcf7f, 0xf4b740, 0xff6b6b];\n      for (let i = 0; i < 18; i++) {\n        const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: colors[i % colors.length] }));\n        root.add(m);\n        packets.push({ mesh: m, phase: i / 18, radius: 4.1 + (i % 3) * 0.45, tilt: (i % 2 === 0 ? 1 : -1) * 0.28 });\n      }\n\n      T.label(\"Development/ (5 Themes)\", [-3.2, 1.55, 0], \"#38b6f5\");\n      T.label(\"Documents/ (1,200+ Docs)\", [0.0, 1.25, 0], \"#a585ff\");\n      T.label(\"Photos/ (20TB Original)\", [3.2, 1.45, 0], \"#3fcf7f\");\n      T.label(\"6대 마스터 운영 헌장 · Single Source of Truth\", [0, -2.05, 0], \"#f4b740\");\n\n      T.onFrame((dt, t) => {\n        root.rotation.y = Math.sin(t * 0.35) * 0.32;\n        meshes.forEach((m, i) => {\n          m.position.y = -1.2 + pillars[i].h / 2 + Math.sin(t * 1.6 + i * 1.4) * 0.08;\n        });\n        packets.forEach(p => {\n          const ang = (t * 0.55 + p.phase) * Math.PI * 2;\n          p.mesh.position.set(\n            Math.cos(ang) * p.radius,\n            Math.sin(ang * 2) * 0.65 + p.tilt,\n            Math.sin(ang) * (p.radius * 0.48)\n          );\n        });\n      });\n    });\n  }\n});\n<\/script>\n\n<footer class=\"sb-foot\">\n  GoogleDrive Master Workspace (<code>Development/</code> · <code>Documents/</code> · <code>Photos/</code>) · 인터랙티브 아키텍처 가이드북 · Build 2026-10-31 (<code>27aae85</code>) · <code>docs/build_spec_portal.py</code> 자동 생성\n</footer>\n</body>\n</html>\n", "overview": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch.01 마스터 워크스페이스 &amp; 5대 엔지니어링 테마 아키텍처 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"Ch.01 마스터 워크스페이스 &amp; 5대 엔지니어링 테마 아키텍처 — KAIST Grad Works &amp; GoogleDrive Master Workspace Interactive Guidebook\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-chapter=\"overview\" data-root=\"../\">\n<main class=\"chapter\">\n  <header class=\"chapter-hero\">\n    <div class=\"eyebrow\">CHAPTER 01 · OVERVIEW &amp; GOVERNANCE</div>\n    <h1>마스터 워크스페이스 &amp; 5대 엔지니어링 테마 아키텍처</h1>\n    <p class=\"lead\">\n      송용준 박사의 통합 마스터 저장소(<a class=\"src\" href=\"../../../README.md\" target=\"_blank\" rel=\"noopener\" title=\"README.md\">GoogleDrive/README.md</a>)는 연구·엔지니어링 코드 모노레포(<code>Development/</code>),\n      학술·커리어 문서 아카이브(<code>Documents/</code>), 그리고 평생 미디어 아카이브(<code>Photos/</code>)의\n      <strong>3대 기둥(3-Pillar Architecture)</strong>으로 구성됩니다. 본 장에서는 저장소 간 엄격한 경계 헌장과\n      40개 Git 서브모듈 + 4대 라이프 오토메이션 스위트의 전체 설계 사상을 살펴봅니다.\n    </p>\n    <ul class=\"objectives\">\n      <li><code>GoogleDrive</code> 마스터 저장소의 <strong>3대 기둥(Development · Documents · Photos)</strong>과 <strong>6대 무결성 운영 헌장</strong>을 이해한다.</li>\n      <li>40개 Git 서브모듈과 4대 라이프 스위트를 아우르는 <strong>5대 엔지니어링 테마(Theme 1~5)</strong>의 수학적·시스템적 계보를 파악한다.</li>\n      <li><code>.gitmodules</code> 정본에서 파싱된 <strong>44개 전체 프로젝트 탐색기(Sim 01)</strong>로 언어·런타임 분포를 실시간 분석한다.</li>\n      <li>KAIST 박사학위 논문 및 <strong>한·미 등록특허 5건</strong>과 실제 구현 서브모듈 간의 대응 관계를 확인한다.</li>\n    </ul>\n  </header>\n\n  <section id=\"sec-pillars\">\n    <h2>GoogleDrive 3대 기둥 및 6대 운영 헌장 (Operating Charter)</h2>\n    <p>\n      마스터 워크스페이스 최상위 헌장인 <a class=\"src\" href=\"../../../GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"GEMINI.md\">GoogleDrive/GEMINI.md</a>와 연구 모노레포 헌장인 <a class=\"src\" href=\"../../GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"GEMINI.md\">Development/GEMINI.md</a>는\n      수십 년간 축적된 연구 코드·특허·논문·개인 금융 데이터·사진 아카이브가 서로 오염되거나 외부로 유출되지 않도록\n      <strong>관심사 분리(Separation of Concerns)</strong>를 강제합니다.\n      아래 아키텍처 다이어그램의 각 노드를 클릭하면 세부 사양과 핵심 검증 규칙을 확인할 수 있습니다.\n    </p>\n\n    <figure class=\"diagram\">\n      <svg id=\"ov-svg\" viewBox=\"0 0 1080 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"3-Pillar Master Workspace and 5-Theme Topology\">\n        <rect x=\"4\" y=\"4\" width=\"1072\" height=\"332\" rx=\"12\" class=\"f-surface\" />\n        <text x=\"24\" y=\"28\" class=\"t-acc\">CLICKABLE TOPOLOGY · MASTER WORKSPACE (3 PILLARS) &amp; DEVELOPMENT MONOREPO (5 THEMES)</text>\n\n        <!-- Top Row: 3 Master Pillars -->\n        <g class=\"svg-node is-selected\" data-node=\"pillar-dev\">\n          <rect x=\"24\" y=\"44\" width=\"330\" height=\"84\" rx=\"9\" class=\"f-acc-soft\" />\n          <text x=\"40\" y=\"68\" class=\"t-acc\">PILLAR 1 · Development/ (kaist-grad-works)</text>\n          <text x=\"40\" y=\"90\" class=\"t\" font-weight=\"600\">40 Submodules (Themes 1–4) + Theme 5</text>\n          <text x=\"40\" y=\"110\" class=\"t-dim\">C/C++ · Python/TF · MATLAB · Java · C#</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"pillar-doc\">\n          <rect x=\"375\" y=\"44\" width=\"330\" height=\"84\" rx=\"9\" class=\"f-acc2-soft\" />\n          <text x=\"391\" y=\"68\" class=\"t-acc2\">PILLAR 2 · Documents/ (Academic &amp; Career)</text>\n          <text x=\"391\" y=\"90\" class=\"t\" font-weight=\"600\">KAIST Thesis · Lab Seminars · Web Resume</text>\n          <text x=\"391\" y=\"110\" class=\"t-dim\">Resume Deploy Parity + Personal/ (.gitignore)</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"pillar-photo\">\n          <rect x=\"726\" y=\"44\" width=\"330\" height=\"84\" rx=\"9\" class=\"f-ok-soft\" />\n          <text x=\"742\" y=\"68\" class=\"t-ok\">PILLAR 3 · Photos/ (Lifetime Media Archive)</text>\n          <text x=\"742\" y=\"90\" class=\"t\" font-weight=\"600\">Zero-ZIP Policy &amp; Zero Non-Media Policy</text>\n          <text x=\"742\" y=\"110\" class=\"t-dim\">Read-Only Mount for Theme 5 Photo Studio</text>\n        </g>\n\n        <!-- Connector Line from Pillar 1 to 5 Themes -->\n        <line x1=\"189\" y1=\"128\" x2=\"189\" y2=\"158\" class=\"s-acc\" stroke-width=\"2\" />\n        <line x1=\"115\" y1=\"158\" x2=\"965\" y2=\"158\" class=\"s-acc\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\" />\n\n        <!-- Bottom Row: 5 Engineering Themes -->\n        <g class=\"svg-node\" data-node=\"theme-1\">\n          <rect x=\"24\" y=\"174\" width=\"196\" height=\"142\" rx=\"8\" class=\"f-ok-soft\" />\n          <text x=\"36\" y=\"198\" class=\"t-ok\">THEME 1 · WPT &amp; EV</text>\n          <text x=\"36\" y=\"220\" class=\"t\" font-weight=\"700\">3D WPT &amp; OLEV</text>\n          <text x=\"36\" y=\"240\" class=\"t-dim\">Tsai 3D Stereo Vision</text>\n          <text x=\"36\" y=\"258\" class=\"t-dim\">FLIR + Coral EdgeTPU</text>\n          <text x=\"36\" y=\"276\" class=\"t-dim\">85kHz GPS Telematics</text>\n          <text x=\"36\" y=\"300\" class=\"t-mono\">8 Submodules · Ch.03</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"theme-2\">\n          <rect x=\"236\" y=\"174\" width=\"196\" height=\"142\" rx=\"8\" class=\"f-acc2-soft\" />\n          <text x=\"248\" y=\"198\" class=\"t-acc2\">THEME 2 · BIO &amp; DRL</text>\n          <text x=\"248\" y=\"220\" class=\"t\" font-weight=\"700\">DQNAlign &amp; Genomics</text>\n          <text x=\"248\" y=\"240\" class=\"t-dim\">Dueling DDQN + Skip</text>\n          <text x=\"248\" y=\"258\" class=\"t-dim\">REminerII · PixelRE</text>\n          <text x=\"248\" y=\"276\" class=\"t-dim\">REDNN · 1092x · QLOBAL</text>\n          <text x=\"248\" y=\"300\" class=\"t-mono\">21 Submodules · Ch.02</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"theme-3\">\n          <rect x=\"448\" y=\"174\" width=\"196\" height=\"142\" rx=\"8\" class=\"f-warn-soft\" />\n          <text x=\"460\" y=\"198\" class=\"t-warn\">THEME 3 · AUTOMATION</text>\n          <text x=\"460\" y=\"220\" class=\"t\" font-weight=\"700\">Vision FSM &amp; Markov</text>\n          <text x=\"460\" y=\"240\" class=\"t-dim\">CMaple DirectInput</text>\n          <text x=\"460\" y=\"258\" class=\"t-dim\">PyMaple 13-State FSM</text>\n          <text x=\"460\" y=\"276\" class=\"t-dim\">StarForce · Lophago</text>\n          <text x=\"460\" y=\"300\" class=\"t-mono\">7 Submodules · Ch.04</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"theme-4\">\n          <rect x=\"660\" y=\"174\" width=\"196\" height=\"142\" rx=\"8\" class=\"f-acc-soft\" />\n          <text x=\"672\" y=\"198\" class=\"t-acc\">THEME 4 · SPECIALTY</text>\n          <text x=\"672\" y=\"220\" class=\"t\" font-weight=\"700\">3D MIMO &amp; Casio SDK</text>\n          <text x=\"672\" y=\"240\" class=\"t-dim\">WINNER II 11-Step MIMO</text>\n          <text x=\"672\" y=\"258\" class=\"t-dim\">60GHz mmWave Backhaul</text>\n          <text x=\"672\" y=\"276\" class=\"t-dim\">Casio FX-9860G RPG/RTS</text>\n          <text x=\"672\" y=\"300\" class=\"t-mono\">4 Submodules · Ch.04</text>\n        </g>\n\n        <g class=\"svg-node\" data-node=\"theme-5\">\n          <rect x=\"872\" y=\"174\" width=\"184\" height=\"142\" rx=\"8\" class=\"f-bad-soft\" />\n          <text x=\"884\" y=\"198\" class=\"t-bad\">THEME 5 · LIFE AI</text>\n          <text x=\"884\" y=\"220\" class=\"t\" font-weight=\"700\">Finance &amp; Photo AI</text>\n          <text x=\"884\" y=\"240\" class=\"t-dim\">Refund -tx['amount']</text>\n          <text x=\"884\" y=\"258\" class=\"t-dim\">YuNet + SFace 128-D</text>\n          <text x=\"884\" y=\"276\" class=\"t-dim\">Osaka/Paris + PPTX</text>\n          <text x=\"884\" y=\"300\" class=\"t-mono\">4 Local Suites · Ch.05</text>\n        </g>\n      </svg>\n      <div class=\"inspector-box\" id=\"ov-insp\">\n        <div class=\"insp-title\" id=\"ov-insp-title\">📌 PILLAR 1 · Development/ (kaist-grad-works 모노레포)</div>\n        <div id=\"ov-insp-body\">40개 Git 서브모듈(<a class=\"src\" href=\"../../.gitmodules\" target=\"_blank\" rel=\"noopener\" title=\".gitmodules\">.gitmodules</a>)과 Theme 5 라이프 오토메이션 스위트를 통합 관리하는 엔지니어링 모노레포입니다. 상단 블록을 클릭하면 각 기둥과 테마의 세부 아키텍처 명세가 표시됩니다.</div>\n      </div>\n      <figcaption><b>그림 1-1.</b> GoogleDrive 마스터 워크스페이스 3대 기둥(Development · Documents · Photos) 및 Development 모노레포 5대 엔지니어링 테마 토폴로지.</figcaption>\n    </figure>\n\n    <div class=\"callout tip\">\n      <b class=\"title\">워크스페이스 6대 무결성 수칙 요약 (<a class=\"src\" href=\"../../../GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"GEMINI.md\">GoogleDrive/GEMINI.md</a>)</b>\n      <ul>\n        <li><strong>Rule 1 · 저장소 간 경계 준수 (Separation of Concerns)</strong>: 미디어는 <code>Photos/</code>, 연구·개발 코드는 <code>Development/</code>, 학술·행정 문서는 <code>Documents/</code>에 엄격히 분리 배치합니다.</li>\n        <li><strong>Rule 2 · Zero-ZIP Policy</strong>: Google 포토 백업 누락 방지를 위해 <code>Photos/</code> 내 압축 파일(<code>.zip</code>, <code>.rar</code>, <code>.7z</code> 등)을 전면 금지합니다.</li>\n        <li><strong>Rule 3 · Zero Non-Media Policy</strong>: 비미디어 문서(<code>.pdf</code>, <code>.hwp</code>, <code>.pptx</code>, <code>.xlsx</code>)는 <code>Photos/</code>에 절대 배치하지 않습니다.</li>\n        <li><strong>Rule 4 · 일상 앨범 순도 보존</strong>: <code>Photos/일상/</code>에는 직접 촬영한 순수 사진·영상만 보관하며, 캡처(<code>Screenshots/</code>)와 웹 저장 이미지(<code>Downloads/</code>)를 격리합니다.</li>\n        <li><strong>Rule 5 · 개인정보 격리 게이트 (Privacy Gate)</strong>: <code>Documents/Personal/</code> 및 <code>1_Household_Finance/Data/*.xlsx</code>는 어떠한 경우에도 Git 추적이나 외부 문서에 노출하지 않습니다.</li>\n        <li><strong>Rule 6 · 클라우드 바로가기 및 EXIF 보존</strong>: <code>.gsheet</code>/<code>.gdoc</code> 링크와 사진 원본 EXIF <code>DateTimeOriginal</code> 메타데이터를 보존합니다.</li>\n      </ul>\n    </div>\n  </section>\n\n  <section id=\"sec-themes\">\n    <h2>5대 엔지니어링 테마 비교 매트릭스</h2>\n    <p>\n      <code>Development/</code> 저장소는 KAIST 전기및전자공학부 석·박사 통합과정 연구 자산(Theme 1~4, 40개 서브모듈)과\n      졸업 후 실생활 엔지니어링 자동화 시스템(Theme 5, 4개 스위트)을 체계적으로 분류합니다.\n    </p>\n\n no);font-size:11px;\">' + m.stack + '</span>' +\n            '</div>' +\n            '<div style=\"color:var(--text-dim);font-size:11.5px;\">' + m.category + '</div>' +\n          '</div>';\n        }).join(\"\") || '<div style=\"color:var(--text-dim);padding:6px 0;\">조건에 맞는 모듈이 없습니다.</div>';\n      }\n\n      if (chart) chart.redraw();\n    }\n\n    var btns = document.querySelectorAll(\"#ov-theme-btns button\");\n    btns.forEach(function (b) {\n      b.addEventListener(\"click\", function () {\n        btns.forEach(function (x) { x.classList.remove(\"on\"); });\n        b.classList.add(\"on\");\n        curTheme = b.getAttribute(\"data-t\") || \"ALL\";\n        updateExplorer();\n      });\n    });\n\n    var inp = document.getElementById(\"ov-filter-input\");\n    if (inp) {\n      inp.addEventListener(\"input\", function () {\n        curQuery = inp.value || \"\";\n        updateExplorer();\n      });\n    }\n\n    updateExplorer();\n  });\n  <\/script>\n\n</main>\n</body>\n</html>\n", "bio": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch.02 심층 강화학습 서열 정렬 (DQNAlign) &amp; 고속 유전체 마이닝 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"Ch.02 심층 강화학습 서열 정렬 (DQNAlign) &amp; 고속 유전체 마이닝 — KAIST Grad Works &amp; GoogleDrive Master Workspace Interactive Guidebook\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-chapter=\"bio\" data-root=\"../\">\n<main class=\"chapter\">\n  <header class=\"chapter-hero\">\n    <div class=\"eyebrow\">CHAPTER 02 · THEME 2 — BIOINFORMATICS &amp; DEEP RL</div>\n    <h1>심층 강화학습 서열 정렬 (DQNAlign) &amp; 고속 유전체 마이닝</h1>\n    <p class=\"lead\">\n      차세대 시퀀싱(NGS) 및 3세대 롱리드(PacBio, Oxford Nanopore) 기술의 발전으로 단일 리드 길이가 수만~수십만 염기쌍(bp)에 달하면서,\n      고전적인 전역 동적계획법(Needleman-Wunsch)의 $O(N_1 N_2)$ 시공간 복잡도는 심각한 병목이 되었습니다.\n      본 장에서는 송용준 박사의 학위논문 핵심 성과인 <strong>DQNAlign</strong>(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L10\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:10\">agent.py:10</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L17\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:17\">Learning.py:17</a>)의 국소 슬라이딩 윈도우 MDP 정식화,\n      <strong>Dueling Double DQN + Exact Match Skip</strong> 하이브리드 가속기, 그리고 염색체 규모 반복서열 발굴 엔진인\n      <strong>REminerII · PixelRE · REDNN</strong>(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py#L74\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py:74\">Insilico.py:74</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/PixelRE/PixelRE.m#L3\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/PixelRE/PixelRE.m:3\">PixelRE.m:3</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py#L74\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py:74\">REDNN.py:74</a>)을 수식과 시뮬레이터로 완전 해부합니다.\n    </p>\n    <ul class=\"objectives\">\n      <li>전역 동적계획법(Needleman-Wunsch)의 $O(N_1 N_2)$ 한계를 극복하는 <strong>국소 슬라이딩 윈도우 MDP</strong>와 <strong>Exact Match Skip</strong>을 이해한다.</li>\n      <li><strong>Dueling Double DQN</strong>($128+128$ 스트림 분할), <strong>Depthwise Separable Conv</strong>, <strong>Zipfian($s=1.6$) 인델 분포</strong> 수식을 확인한다.</li>\n      <li>인터랙티브 시뮬레이터(Sim 02 · Sim 03)로 <strong>DQNAlign 정렬 궤적</strong>과 <strong>REminerII / PixelRE 2D 닷플롯 시드 확장</strong>을 직접 실험한다.</li>\n    </ul>\n  </header>\n\n  <section id=\"sec-mdp\">\n    <h2>전역 동적계획법의 한계와 국소 슬라이딩 윈도우 MDP 정식화</h2>\n    <p>\n      두 염기서열 $S^{(1)} = (s^{(1)}_1, \\dots, s^{(1)}_{N_1})$과 $S^{(2)} = (s^{(2)}_1, \\dots, s^{(2)}_{N_2})$ ($s \\in \\{\\text{A, C, G, T}\\}$)를 정렬할 때,\n      Needleman-Wunsch 전역 동적계획법(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/AlignmentGenerator\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/AlignmentGenerator\">AlignmentGenerator</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/QLOBAL\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/QLOBAL\">QLOBAL</a>)은 모든 $(i, j) \\in [0, N_1] \\times [0, N_2]$ 격자에 대해 아래 점화식을 계산합니다:\n    </p>\n    $$F(i, j) = \\max \\begin{cases} F(i-1, j-1) + \\sigma\\!\\left(s^{(1)}_i, s^{(2)}_j\\right) & \\text{(Match / Mismatch)} \\\\[4pt] F(i-1, j) - d_{\\text{gap}} & \\text{(Deletion in } S^{(2)}\\text{)} \\\\[4pt] F(i, j-1) - d_{\\text{gap}} & \\text{(Insertion in } S^{(2)}\\text{)} \\end{cases}$$\n    <p>\n      만약 $N_1 = N_2 = 10^5\\text{ bp}$라면 격자 셀 수는 $10^{10}$개(4바이트 정수 기준 약 $40\\text{ GB}$ RAM)에 달해 단일 노드 처리가 불가능합니다.\n      <strong>DQNAlign</strong>(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py#L9\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py:9\">alignment.py:9</a>)은 전체 격자를 메모리에 올리는 대신, 현재 정렬 헤드 좌표 $(x_t, y_t)$에서 미래 방향의\n      <strong>$W \\times W$ 국소 부분 서열 윈도우(Local Sliding Window)</strong>만을 상태 $s_t$로 관측하여 순차적으로 최적 행동 $a_t$를 결정하는\n      마르코프 결정 과정(MDP)으로 문제를 재정의했습니다.\n    </p>\n\n    <figure class=\"diagram\">\n      <svg id=\"bio-svg\" viewBox=\"0 0 1080 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Theme 2 Bioinformatics and Deep RL Pipeline\">\n        <defs>\n          <marker id=\"bio-arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"var(--accent-2)\" />\n          </marker>\n        </defs>\n        <rect x=\"4\" y=\"4\" width=\"1072\" height=\"312\" rx=\"12\" class=\"f-surface\" />\n        <text x=\"24\" y=\"28\" class=\"t-acc2\">CLICKABLE PIPELINE · THEME 2 BIOINFORMATICS, DQNALIGN DRL &amp; GENOMIC MINING (21 SUBMODULES)</text>\n\n        <!-- Stage 1: Exact Skip & Local Window -->\n        <g class=\"svg-node is-selected\" data-node=\"bio-window\">\n          <rect x=\"24\" y=\"48\" width=\"240\" height=\"184\" rx=\"9\" class=\"f-ok-soft\" />\n          <text x=\"38\" y=\"74\" class=\"t-ok\">STAGE 1 · MDP &amp; EXACT SKIP</text>\n          <text x=\"38\" y=\"98\" class=\"t\" font-weight=\"700\">Pairwise Environment</text>\n          <text x=\"38\" y=\"120\" class=\"t-dim\">State: W x W One-Hot Window</text>\n          <text x=\"38\" y=\"140\" class=\"t-dim\">Exact Match Skip (agent.skip)</text>\n          <text x=\"38\" y=\"160\" class=\"t-dim\">Zipfian Indel (s = 1.6)</text>\n          <text x=\"38\" y=\"180\" class=\"t-dim\">Forward &amp; RC Strand Modes</text>\n          <text x=\"38\" y=\"212\" class=\"t-mono\">alignment.py · agent.py</text>\n        </g>\n\n        <!-- Stage 2: Dueling DDQN & SSDnetwork -->\n        <g class=\"svg-node\" data-node=\"bio-ddqn\">\n          <rect x=\"290\" y=\"48\" width=\"248\" height=\"184\" rx=\"9\" class=\"f-acc2-soft\" />\n          <text x=\"304\" y=\"74\" class=\"t-acc2\">STAGE 2 · DUELING DOUBLE DQN</text>\n          <text x=\"304\" y=\"98\" class=\"t\" font-weight=\"700\">Qnetwork &amp; SSDnetwork</text>\n          <text x=\"304\" y=\"120\" class=\"t-dim\">Separable Conv2D Backbone</text>\n          <text x=\"304\" y=\"140\" class=\"t-dim\">Split h=256 -&gt; V(s) + A(s,a)</text>\n          <text x=\"304\" y=\"160\" class=\"t-dim\">Replay Buffer (N = 50,000)</text>\n          <text x=\"304\" y=\"180\" class=\"t-dim\">Polyak Target (tau = 0.001)</text>\n          <text x=\"304\" y=\"212\" class=\"t-mono\">Learning.py · param/SSD.py</text>\n        </g>\n\n        <!-- Stage 3: REminerII & PixelRE -->\n        <g class=\"svg-node\" data-node=\"bio-reminer\">\n          <rect x=\"564\" y=\"48\" width=\"240\" height=\"184\" rx=\"9\" class=\"f-acc-soft\" />\n          <text x=\"578\" y=\"74\" class=\"t-acc\">STAGE 3 · REPEAT MINING</text>\n          <text x=\"578\" y=\"98\" class=\"t\" font-weight=\"700\">REminerII &amp; PixelRE</text>\n          <text x=\"578\" y=\"120\" class=\"t-dim\">Seed W=14 · Space=2 · Allow=1</text>\n          <text x=\"578\" y=\"140\" class=\"t-dim\">Greedy X-Drop = 30, L &gt;= 28</text>\n          <text x=\"578\" y=\"160\" class=\"t-dim\">PixelRE w=[7,8,10,12,14]</text>\n          <text x=\"578\" y=\"180\" class=\"t-dim\">11 Win32 MFC RE_* Viewers</text>\n          <text x=\"578\" y=\"212\" class=\"t-mono\">Insilico.py · PixelRE.m</text>\n        </g>\n\n        <!-- Stage 4: REDNN, RERNN & Population Genetics -->\n        <g class=\"svg-node\" data-node=\"bio-rednn\">\n          <rect x=\"830\" y=\"48\" width=\"226\" height=\"184\" rx=\"9\" class=\"f-bad-soft\" />\n          <text x=\"844\" y=\"74\" class=\"t-bad\">STAGE 4 · CLINICAL &amp; POP</text>\n          <text x=\"844\" y=\"98\" class=\"t\" font-weight=\"700\">REDNN · RERNN · EvolDist</text>\n          <text x=\"844\" y=\"120\" class=\"t-dim\">12,288-D · 6-Layer FC DNN</text>\n          <text x=\"844\" y=\"140\" class=\"t-dim\">RERNN Sequential LSTM</text>\n          <text x=\"844\" y=\"160\" class=\"t-dim\">1092x (1000 Genomes C++)</text>\n          <text x=\"844\" y=\"180\" class=\"t-dim\">clustering205 · EvolDist</text>\n          <text x=\"844\" y=\"212\" class=\"t-mono\">REDNN.py · EvolDist</text>\n        </g>\n\n        <line x1=\"264\" y1=\"140\" x2=\"287\" y2=\"140\" class=\"s-acc2\" stroke-width=\"2\" marker-end=\"url(#bio-arr)\" />\n        <line x1=\"538\" y1=\"140\" x2=\"561\" y2=\"140\" class=\"s-acc2\" stroke-width=\"2\" marker-end=\"url(#bio-arr)\" />\n        <line x1=\"804\" y1=\"140\" x2=\"827\" y2=\"140\" class=\"s-acc2\" stroke-width=\"2\" marker-end=\"url(#bio-arr)\" />\n\n        <!-- Bottom Complexity Comparison Banner -->\n        <rect x=\"24\" y=\"248\" width=\"1032\" height=\"48\" rx=\"8\" class=\"f-elev\" />\n        <text x=\"40\" y=\"277\" class=\"t-ok\">COMPLEXITY BREAKTHROUGH:</text>\n        <text x=\"242\" y=\"277\" class=\"t\" font-weight=\"600\">Needleman-Wunsch DP: O(N1 * N2) Time &amp; Memory  ---&gt;  DQNAlign + Exact Skip: O(N) Linear Time &amp; O(W^2) Window Memory</text>\n      </svg>\n      <div class=\"inspector-box\" id=\"bio-insp\">\n        <div class=\"insp-title\" id=\"bio-insp-title\">📌 STAGE 1 · Pairwise MDP Environment &amp; Exact Match Skip</div>\n        <div id=\"bio-insp-body\">현재 염기 쌍이 일치(<code>seq1[x] == seq2[y]</code>)하면 딥러닝 추론을 건너뛰고 즉시 대각선으로 전진하여 연산량을 극적으로 줄입니다. 파이프라인의 각 스테이지를 클릭해 상세 텐서 규격을 확인하세요.</div>\n      </div>\n      <figcaption><b>그림 2-1.</b> Theme 2 바이오인포매틱스 &amp; 심층 강화학습 4단계 파이프라인 (DQNAlign · Dueling DDQN · REminerII/PixelRE · REDNN).</figcaption>\n    </figure>\n\n    <h3 id=\"sec-mdp-detail\">MDP 상태 · 행동 · 보상 및 Exact Match Skip 수식</h3>\n    <ul>\n      <li>\n        <strong>상태 공간 ($\\mathcal{S}$)</strong>: <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py#L110\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py:110\">alignment.py:110</a> 및 <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py#L158\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py:158\">alignment.py:158</a>는 현재 정렬 위치 $(x_t, y_t)$로부터\n        부분 서열 윈도우를 원-핫(One-Hot) 또는 2차원 매칭 맵으로 인코딩하여 신경망 입력으로 제공합니다.\n      </li>\n      <li>\n        <strong>행동 공간 ($\\mathcal{A}$, <code>n_action = 3</code>)</strong>:\n        $$a_t \\in \\{0:\\text{Forward } (x_t+1, y_t+1),\\;\\; 1:\\text{Insertion } (x_t, y_t+1),\\;\\; 2:\\text{Deletion } (x_t+1, y_t)\\}$$\n      </li>\n      <li>\n        <strong>보상 함수 ($\\mathcal{R}$)</strong>:\n        $$r_t = \\begin{cases} +r_{\\text{match}} & \\text{if } a_t = 0 \\text{ and } s^{(1)}_{x_t} = s^{(2)}_{y_t} \\\\ -p_{\\text{mismatch}} & \\text{if } a_t = 0 \\text{ and } s^{(1)}_{x_t} \\neq s^{(2)}_{y_t} \\\\ -p_{\\text{indel}} & \\text{if } a_t \\in \\{1, 2\\} \\end{cases}$$\n      </li>\n      <li>\n        <strong>Exact Match Skip 가속기 (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L82\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:82\">agent.py:82</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L96\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:96\">agent.py:96</a>, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L110\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:110\">agent.py:110</a>)</strong>:\n        유전체 서열의 상동 구간에서는 연속된 염기 일치(Exact Match Run)가 빈번하게 나타납니다.\n        <code>Agent.skip()</code>은 $s^{(1)}_{x_t} = s^{(2)}_{y_t}$인 동안 신경망 호출 없이 대각선 전진을 루프로 수행하며,\n        불일치(Mismatch 또는 Indel 경계)가 발생한 지점에서만 Dueling Double DQN 에이전트를 호출합니다.\n      </li>\n    </ul>\n  </section>\n\n  <section id=\"sec-ddqn\">\n    <h2>Dueling Double DQN &amp; Depthwise Separable Conv 아키텍처</h2>\n    <p>\n      <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L17\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:17\">Learning.py:17</a>에는 표준 합성곱 기반 <code>Qnetwork</code>와 경량 깊이별 분리 합성곱(Depthwise Separable Convolution, <a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L88\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:88\">Learning.py:88</a>)을 적용한\n      <code>SSDnetwork</code> 및 차분 특징 기반 <code>DiffSSDnetwork</code>(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L171\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:171\">Learning.py:171</a>)가 구현되어 있습니다.\n    </p>\n    <ol>\n      <li>\n        <strong>Dueling Stream Split (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L52\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:52\">Learning.py:52</a>)</strong>:\n        마지막 합성곱 계층의 출력 벡터 $h \\in \\mathbb{R}^{256}$ (<code>h_size = 256</code>)을 절반씩 분할하여\n        행동 이점 스트림 $\\text{streamAC} \\in \\mathbb{R}^{128}$와 상태 가치 스트림 $\\text{streamVC} \\in \\mathbb{R}^{128}$를 생성하고,\n        아래 수식으로 $Q(s, a; \\theta)$를 결합합니다:\n        $$Q(s, a; \\theta) = V(s; \\theta_V) + \\left( A(s, a; \\theta_A) - \\frac{1}{|\\mathcal{A}|} \\sum_{a'=0}^{|\\mathcal{A}|-1} A(s, a'; \\theta_A) \\right)$$\n      </li>\n      <li>\n        <strong>Double Q-Learning 타깃 (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L77\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:77\">agent.py:77</a>)</strong>:\n        단일 네트워크의 max 연산으로 인한 Q-값 과대추정(Overestimation Bias)을 막기 위해 행동 선택은 메인 네트워크 $\\theta$로,\n        가치 평가는 타깃 네트워크 $\\theta^-$로 분리합니다:\n        $$y_t = r_t + \\gamma \\, Q\\!\\left(s_{t+1}, \\arg\\max_{a'} Q(s_{t+1}, a'; \\theta_t);\\; \\theta^-_t\\right), \\quad \\gamma = 0.99$$\n      </li>\n      <li>\n        <strong>Polyak 소프트 타깃 업데이트 &amp; Zipfian 인델 분포 (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py#L42\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py:42\">alignment.py:42</a>)</strong>:\n        타깃 네트워크는 매 학습 스텝마다 $\\theta^- \\leftarrow \\tau \\theta + (1-\\tau)\\theta^-$ ($\\tau = 0.001$)로 부드럽게 갱신되며,\n        합성 학습 서열의 인델 길이는 실제 생물학적 진화 모델을 반영한 지프 분포(Zipfian Power-Law, $s = 1.6$)에서 샘플링됩니다:\n        $$P(L_{\\text{indel}} = k) = \\frac{k^{-1.6}}{\\sum_{n=1}^{L_{\\max}} n^{-1.6}}, \\quad k \\in \\{1, 2, \\dots, L_{\\max}\\}$$\n      </li>\n    </ol>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead>\n          <tr>\n            <th>파라미터 심볼</th>\n            <th>소스코드 변수명</th>\n            <th>파싱된 실제 값</th>\n            <th>정의 위치</th>\n            <th>공학적 의미 및 역할</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td>$B$</td>\n            <td><code>batch_size</code></td>\n            <td class=\"mono\">32</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py#L2\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py:2\">SSD.py:2</a></td>\n            <td>경험 리플레이 미니배치 샘플 크기</td>\n          </tr>\n          <tr>\n            <td>$\\gamma$</td>\n            <td><code>y</code></td>\n            <td class=\"mono\">0.99</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py#L2\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py:2\">SSD.py:2</a></td>\n            <td>미래 정렬 보상에 대한 할인 계수 (Discount Factor)</td>\n          </tr>\n          <tr>\n            <td>$\\epsilon_{\\text{start}} \\to \\epsilon_{\\text{end}}$</td>\n            <td><code>startE</code>, <code>endE</code></td>\n            <td class=\"mono\">1 → 0.05</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py#L2\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py:2\">SSD.py:2</a></td>\n            <td>$\\epsilon$-Greedy 탐색 확률 감쇠 범위 (<code>annealing_steps = 10000.0</code>)</td>\n          </tr>\n          <tr>\n            <td>$D_{\\text{hidden}}$</td>\n            <td><code>h_size</code></td>\n            <td class=\"mono\">256</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py#L2\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py:2\">SSD.py:2</a></td>\n            <td>Dueling 분할 직전 은닉 특징 차원 ($128 + 128$ 분할)</td>\n          </tr>\n          <tr>\n            <td>$\\tau$</td>\n            <td><code>tau</code></td>\n            <td class=\"mono\">0.001</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py#L2\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/param/SSD.py:2\">SSD.py:2</a></td>\n            <td>타깃 네트워크 소프트 업데이트 계수 (Polyak Averaging)</td>\n          </tr>\n          <tr>\n            <td>$|\\mathcal{D}|$</td>\n            <td><code>BUFFER_SIZE</code></td>\n            <td class=\"mono\">50,000</td>\n            <td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L17\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:17\">Learning.py:17</a></td>\n            <td>Experience Replay Buffer 최대 전이 저장 용량</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"sec-sim-dqnalign\">\n    <h2>인터랙티브 시뮬레이터 · DQNAlign 슬라이딩 윈도우 &amp; Exact-Skip</h2>\n    <p>\n      아래 시뮬레이터는 두 염기서열 간 변이율(SNP/Indel)과 슬라이딩 윈도우 크기 $W$, 그리고 <code>Agent.skip()</code> 활성화 여부에 따라\n      <strong>전역 Needleman-Wunsch DP</strong>와 <strong>DQNAlign 에이전트</strong>의 정렬 궤적 및 연산 복잡도를 실시간 비교합니다.\n    </p>\n\n    <section class=\"sim\" id=\"sim-dqnalign\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 02 · INTERACTIVE MDP TRAJECTORY</span>\n        <h3>Needleman-Wunsch DP Grid vs. DQNAlign Sliding Window &amp; Exact-Skip</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\">\n          <canvas id=\"bio-dqn-canvas\"></canvas>\n        </div>\n        <div class=\"sim-controls\">\n          <label class=\"ctrl\">\n            <span>서열 길이 $N$ (시각화 격자 크기) <output id=\"bio-lbl-n\">42 bp</output></span>\n            <input type=\"range\" id=\"bio-rng-n\" min=\"24\" max=\"64\" step=\"2\" value=\"42\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>돌연변이 &amp; 인델 발생률 (Mutation Rate) <output id=\"bio-lbl-mut\">16%</output></span>\n            <input type=\"range\" id=\"bio-rng-mut\" min=\"4\" max=\"40\" step=\"2\" value=\"16\" />\n          <
