2=\"228\" class=\"s-acc\" stroke-width=\"2.2\" marker-end=\"url(#pa1)\"/>\n        <line x1=\"800\" y1=\"194\" x2=\"800\" y2=\"228\" stroke=\"var(--ok)\" stroke-width=\"2.2\" marker-end=\"url(#pa2)\"/>\n\n        <rect x=\"19\" y=\"232\" width=\"510\" height=\"72\" rx=\"12\" class=\"f-elev\"/>\n        <text x=\"274\" y=\"258\" text-anchor=\"middle\" class=\"t\" style=\"font-weight:700\">Google One (20TB) · Original Quality 무손실 동기화</text>\n        <text x=\"274\" y=\"280\" text-anchor=\"middle\" class=\"t-mono\">로컬 캐시: D:\\GoogleDriveCache · EXIF DateTimeOriginal 색인</text>\n\n        <rect x=\"551\" y=\"232\" width=\"510\" height=\"72\" rx=\"12\" class=\"f-acc-soft\"/>\n        <text x=\"806\" y=\"258\" text-anchor=\"middle\" class=\"t-acc\">AI Photo Memory Studio (Read-Only 마운트 · server.py)</text>\n        <text x=\"806\" y=\"280\" text-anchor=\"middle\" class=\"t-mono\">YuNet + SFace 128-D · YOLO11n · Graph RAG</text>\n      </svg>\n      <figcaption><b>그림 6-2.</b> <code>Photos/</code> 7대 마스터 카테고리와 클라우드 무손실 동기화 및 AI 비전 스튜디오(Read-Only) 연동 구조. 정의 파일: <a class=\"src\" href=\"../../../Photos/README.md\" target=\"_blank\" rel=\"noopener\" title=\"Photos/README.md\">Photos/README.md</a> · <a class=\"src\" href=\"../../../Photos/GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"Photos/GEMINI.md\">Photos/GEMINI.md</a>.</figcaption>\n    </figure>\n\n    <div class=\"tbl-wrap\">\n      <table class=\"tbl\">\n        <thead>\n          <tr>\n            <th>#</th>\n            <th>마스터 카테고리</th>\n            <th>역할 분류</th>\n            <th>아키텍처 격리 원칙</th>\n            <th>하위 구조</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr><td><code>01</code></td><td><strong><code>Photos/Events/</code></strong></td><td><span class='badge b-area'>기념일·행사 원본</span></td><td>고해상도 RAW 사진 및 4K 영상 원본 분리 보관</td><td style='white-space:nowrap;'><code>3개</code> 하위 폴더</td></tr>\n          <tr><td><code>02</code></td><td><strong><code>Photos/Travel/</code></strong></td><td><span class='badge b-area'>해외 여행 아카이브</span></td><td>지역·연도별 여행 미디어 독립 보관</td><td style='white-space:nowrap;'><code>5개</code> 하위 폴더</td></tr>\n          <tr><td><code>03</code></td><td><strong><code>Photos/Business_Trips/</code></strong></td><td><span class='badge b-area'>글로벌 기술 출장</span></td><td>해외 학회 및 기술 출장 현장 기록</td><td style='white-space:nowrap;'><code>6개</code> 하위 폴더</td></tr>\n          <tr><td><code>04</code></td><td><strong><code>Photos/Family_Archive/</code></strong></td><td><span class='badge b-area'>가족 미디어 아카이브</span></td><td>레거시 캠코더 디지털화 영상 및 가족 사진 장기 보존</td><td style='white-space:nowrap;'><code>2개</code> 하위 폴더</td></tr>\n          <tr><td><code>05</code></td><td><strong><code>Photos/Daily/</code></strong></td><td><span class='badge b-area'>연도별 일상 피드</span></td><td>카메라 직접 촬영 순수 사진·동영상 (표준명 YYYYMMDD_HHMMSS)</td><td style='white-space:nowrap;'><code>16개</code> 하위 폴더</td></tr>\n          <tr><td><code>06</code></td><td><strong><code>Photos/Screenshots/</code></strong></td><td><span class='badge b-area'>화면 캡처 격리</span></td><td>모바일/PC 화면 캡처 이미지 격리 (일상 피드 오염 방지)</td><td style='white-space:nowrap;'><code>7개</code> 하위 폴더</td></tr>\n          <tr><td><code>07</code></td><td><strong><code>Photos/Downloads/</code></strong></td><td><span class='badge b-area'>외부 다운로드 격리</span></td><td>웹/메신저 수신 이미지 격리 보관</td><td style='white-space:nowrap;'><code>14개</code> 하위 폴더</td></tr>\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"callout warn\">\n      <b class=\"title\">왜 Zero-ZIP과 일상 순도 보존(Purity of Daily Feed)이 결정적인가?</b>\n      클라우드 포토 백업 클라이언트는 <code>.zip</code>, <code>.7z</code>, <code>.tar</code> 압축 아카이브 내부를 열람하지 못하므로 압축 파일로 방치된 미디어는 타임라인 색인에서 누락됩니다(<strong>Rule 2: Zero-ZIP Policy</strong>).\n      또한 화면 캡처나 외부 다운로드 이미지가 <code>Daily/</code> 폴더에 섞이면 연도별 타임라인과 AI 얼굴/장면 클러스터링 품질이 저하되므로, 반드시 <code>Screenshots/</code> 및 <code>Downloads/</code>로 분리합니다(<strong>Rule 4: 일상 피드 순도 보존</strong>).\n    </div>\n\n    <!-- Interactive Simulator 1: Workspace & Media Archive Governance Auditor -->\n    <section class=\"sim\" id=\"sim-photos-auditor\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 01 · ARCHIVE GOVERNANCE</span>\n        <h3><code>Photos/</code> · <code>Documents/</code> 마스터 아카이브 자동 라우팅 &amp; 무결성 감사 시뮬레이터</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\">\n          <canvas id=\"cv-archive-audit\"></canvas>\n        </div>\n        <div class=\"sim-controls\">\n          <div class=\"ctrl\">\n            <span>유입 파일 시나리오 선택</span>\n            <div class=\"seg\" id=\"aud-scenario\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:5px;\">\n              <button type=\"button\" data-value=\"wedding\">대용량 미디어</button>\n              <button type=\"button\" data-value=\"academic\">학술·이력서·보안</button>\n              <button type=\"button\" data-value=\"mixed\" class=\"on\" style=\"grid-column:1 / -1;\">ALL · 혼합 유입 (11종)</button>\n            </div>\n          </div>\n          <div class=\"ctrl\">\n            <span>Zero-ZIP 정책 (Rule 2)</span>\n            <div class=\"seg\" id=\"aud-zip\">\n              <button type=\"button\" data-value=\"enforce\" class=\"on\">즉시 압축 해제 (ON)</button>\n              <button type=\"button\" data-value=\"ignore\">압축 방치 (위반)</button>\n            </div>\n          </div>\n          <div class=\"ctrl\">\n            <span>비미디어 &amp; 캡처 격리 (Rule 3 &amp; 4)</span>\n            <div class=\"seg\" id=\"aud-purity\">\n              <button type=\"button\" data-value=\"enforce\" class=\"on\">엄격 분리 라우팅 (ON)</button>\n              <button type=\"button\" data-value=\"mix\">일상 폴더 혼입 (위반)</button>\n            </div>\n          </div>\n          <label class=\"ctrl\">\n            <span>EXIF 보존 &amp; Deploy Parity 감사 강도 <output id=\"aud-strict-out\">100%</output></span>\n            <input type=\"range\" id=\"aud-strict\" min=\"50\" max=\"100\" step=\"10\" value=\"100\">\n          </label>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">클라우드 백업 색인율</span><span class=\"v\" id=\"aud-kpi-sync\">—</span></div>\n        <div class=\"stat\"><span class=\"k\">Daily/ 피드 순도 (Purity)</span><span class=\"v\" id=\"aud-kpi-purity\">—</span></div>\n        <div class=\"stat\"><span class=\"k\">비미디어 오배치 건수</span><span class=\"v\" id=\"aud-kpi-nonmedia\">—</span></div>\n        <div class=\"stat\"><span class=\"k\">격리·패리티 상태</span><span class=\"v\" id=\"aud-kpi-gate\">—</span></div>\n      </div>\n      <div class=\"sim-note\">\n        해볼 것: ① <b>Zero-ZIP 정책</b>을 <b>압축 방치(위반)</b>로 바꾸면 대용량 RAW 압축본 내부 미디어가 클라우드 색인에서 누락되어 백업 색인율이 급락하는 것을 확인하세요. ② <b>비미디어 &amp; 캡처 격리</b>를 <b>혼입(위반)</b>으로 전환하면 문서 파일과 화면 캡처가 <code>Photos/Daily/</code>를 오염시키는 경고가 표시됩니다.\n      </div>\n    </section>\n  </section>\n\n  <!-- ============================================================ 04 -->\n  <section id=\"sec-memory-studio\">\n    <h2>AI 포토 스튜디오 (<code>4_Photo_Memory_Studio</code>) — Read-Only 인덱싱 &amp; 듀얼 뷰어</h2>\n    <p>\n      <code>Development/5_Household_and_Life_Automation/4_Photo_Memory_Studio/</code>(<a class=\"src\" href=\"../../5_Household_and_Life_Automation/4_Photo_Memory_Studio/server.py#L30\" target=\"_blank\" rel=\"noopener\" title=\"5_Household_and_Life_Automation/4_Photo_Memory_Studio/server.py:30\">4_Photo_Memory_Studio/server.py</a>)는\n      <code>Photos/</code> 아카이브의 원본 무결성(Rule 6)을 보존하기 위해 스토리지를 <strong>읽기 전용(Read-Only) 모드</strong>로 마운트하고,\n      로컬 SQLite 인덱스 DB와 멀티모달 비전 파이프라인으로 대용량 영상·사진을 검색·비교하는 웹 스튜디오입니다.\n    </p>\n\n    <div class=\"formula\">\n      $$d_{\\cos}(\\mathbf{e}_i, \\mathbf{e}_j) = 1 - \\frac{\\mathbf{e}_i \\cdot \\mathbf{e}_j}{\\|\\mathbf{e}_i\\|_2 \\, \\|\\mathbf{e}_j\\|_2} \\le \\tau_{\\text{face}} \\quad (\\mathbf{e} \\in \\mathbb{R}^{128}, \\; \\tau_{\\text{face}} = 0.55)$$\n      <div class=\"where\">\n        여기서 \\(\\mathbf{e}_i \\in \\mathbb{R}^{128}\\)은 OpenCV <strong>YuNet</strong>(신뢰도 \\(\\ge 0.60\\))이 검출한 얼굴 영역에서 <strong>SFace</strong> 신경망이 추출한 128차원 L2 정규화 임베딩 벡터이며,\n        코사인 거리 \\(d_{\\cos} \\le 0.55\\) 기준 계층적 군집화와 <strong>YOLO11n</strong> 객체 태그, 그래프 RAG가 결합되어 자연어 질의를 처리합니다.\n      </div>\n    </div>\n\n    <!-- Interactive Simulator 2: SFace 128-D Clustering & Dual-Viewer Split-Wipe -->\n    <section class=\"sim\" id=\"sim-memory-studio\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 02 · AI PHOTO MEMORY STUDIO</span>\n        <h3>YuNet + SFace 128-D 인물 클러스터링 &amp; 듀얼 뷰어 Split-Wipe 비교기</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\">\n          <canvas id=\"cv-studio-sim\"></canvas>\n        </div>\n        <div class=\"sim-controls\">\n          <div class=\"ctrl\">\n            <span>스튜디오 시뮬레이션 모드</span>\n            <div class=\"seg\" id=\"st-mode\">\n              <button type=\"button\" data-value=\"wipe\" class=\"on\">듀얼 뷰어 Split-Wipe</button>\n              <button type=\"button\" data-value=\"cluster\">SFace 128-D 군집화</button>\n            </div>\n          </div>\n          <label class=\"ctrl\">\n            <span>Split-Wipe 분할 위치 / 루페 X좌표 <output id=\"st-wipe-out\">52%</output></span>\n            <input type=\"range\" id=\"st-wipe\" min=\"10\" max=\"90\" step=\"1\" value=\"52\">\n          </label>\n          <label class=\"ctrl\">\n            <span>SFace 코사인 거리 임계값 (\\(\\tau_{\\text{face}}\\)) <output id=\"st-tau-out\">0.55</output></span>\n            <input type=\"range\" id=\"st-tau\" min=\"0.25\" max=\"0.85\" step=\"0.05\" value=\"0.55\">\n          </label>\n          <label class=\"ctrl\">\n            <span>AI 리마스터링 강도 (레거시 영상 복원) <output id=\"st-enh-out\">1.35×</output></span>\n            <input type=\"range\" id=\"st-enh\" min=\"1.0\" max=\"1.8\" step=\"0.05\" value=\"1.35\">\n          </label>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">마운트 모드</span><span class=\"v\" id=\"st-kpi-mount\">Read-Only (EXIF 보존)</span></div>\n        <div class=\"stat\"><span class=\"k\">인덱싱 엔진</span><span class=\"v\" id=\"st-kpi-total\">SQLite + 128-D Vector</span></div>\n        <div class=\"stat\"><span class=\"k\">검출 인물 클러스터</span><span class=\"v\" id=\"st-kpi-clusters\">—</span></div>\n        <div class=\"stat\"><span class=\"k\">클러스터 순도 / PSNR 이득</span><span class=\"v\" id=\"st-kpi-quality\">—</span></div>\n      </div>\n      <div class=\"sim-note\">\n        해볼 것: ① <b>듀얼 뷰어 Split-Wipe</b> 모드에서 슬라이더를 움직여 저조도 레거시 영상 원본(좌측)과 AI 색보정·디노이징 복원본(우측) 및 동기화 줌 루페(우측 하단 원형 확대경)를 비교해 보세요. ② <b>SFace 128-D 군집화</b> 모드로 전환한 뒤 \\(\\tau_{\\text{face}}\\) 임계값을 조절해 과분할(Over-split)과 오병합(False-merge) 사이의 최적점(\\(\\tau=0.55\\))을 확인하세요.\n      </div>\n    </section>\n  </section>\n\n  <section class=\"keypoints\" id=\"summary\">\n    <h2>핵심 정리 · Chapter 06</h2>\n    <ol>\n      <li><strong><code>Documents/</code> 마스터 아카이브</strong>: KAIST 석박사 10년간의 전공 교과목(449건), UMLS 랩세미나(430건), 박사학위 심사서류 및 학위논문 원문(129건), 연구실 행정(220+건)을 보존하며, <code>Personal/</code>은 <code>.gitignore</code>와 Privacy Gate로 격리합니다.</li>\n      <li><strong>웹 이력서 배포 패리티(Deploy Parity)</strong>: <code>Resume/resume_yongjoon_song.html</code>과 <code>Resume/deploy/index.html</code>은 항상 100% 일치 상태를 유지하며 단일 소스로 웹 포트폴리오와 A4 인쇄 PDF를 동시에 생성합니다.</li>\n      <li><strong><code>Photos/</code> 7대 카테고리 &amp; 4대 헌장</strong>: 7개 최상위 폴더 체계를 유지하며, Zero-ZIP·Zero Non-Media·일상 순도 보존·EXIF 보존 원칙으로 클라우드 무손실 백업 무결성을 수호합니다.</li>\n      <li><strong>AI 포토 메모리 스튜디오</strong>: <code>Photos/</code>를 Read-Only로 마운트하여 원본 변조 없이 YuNet+SFace 128-D 클러스터링, YOLO11n 객체 인식, 그래프 RAG 및 듀얼 뷰어 Split-Wipe 비교를 수행합니다.</li>\n    </ol>\n  </section>\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  // =========================================================================\n  // Simulator 1: Photos & Documents Archive Governance Auditor\n  // =========================================================================\n  let audScenario = \"mixed\";\n  let audZip = \"enforce\";\n  let audPurity = \"enforce\";\n  let audStrict = 100;\n\n  const SCENARIOS = {\n    mixed: [\n      { name: \"Studio_Master_RAW.zip (130GB)\", kind: \"zip_media\", target: \"Photos/Events/\", sizeGB: 130 },\n      { name: \"Event_Main_4K_60fps.mp4\", kind: \"media_milestone\", target: \"Photos/Events/\", sizeGB: 18 },\n      { name: \"Travel_Sequence_01.jpg\", kind: \"media_milestone\", target: \"Photos/Travel/\", sizeGB: 4.2 },\n      { name: \"Tech_Conference_Demo.jpg\", kind: \"media_milestone\", target: \"Photos/Business_Trips/\", sizeGB: 1.8 },\n      { name: \"Legacy_Camcorder_Clip.mp4\", kind: \"media_family\", target: \"Photos/Family_Archive/\", sizeGB: 45 },\n      { name: \"20260501_142010_Daily.jpg\", kind: \"media_daily\", target: \"Photos/Daily/2026/\", sizeGB: 8.5 },\n      { name: \"Screenshot_Mobile_UI.png\", kind: \"screenshot\", target: \"Photos/Screenshots/\", sizeGB: 1.1 },\n      { name: \"Messenger_Saved_Img.webp\", kind: \"download\", target: \"Photos/Downloads/\", sizeGB: 0.9 },\n      { name: \"EE827_Convex_Opt_Notes.pdf\", kind: \"doc_academic\", target: \"Documents/Documents/\", sizeGB: 0.4 },\n      { name: \"resume_yongjoon_song.html\", kind: \"doc_resume\", target: \"Documents/Resume/\", sizeGB: 0.1 },\n      { name: \"Private_Admin_Record.pdf\", kind: \"doc_personal\", target: \"Personal/ (.gitignore)\", sizeGB: 0.2 }\n    ],\n    wedding: [\n      { name: \"Event_Highlight_4K.mp4\", kind: \"media_milestone\", target: \"Photos/Events/\", sizeGB: 6.5 },\n      { name: \"Studio_Full_RAW_Set.zip\", kind: \"zip_media\", target: \"Photos/Events/\", sizeGB: 130 },\n      { name: \"Snap_Archive_Bundle.zip\", kind: \"zip_media\", target: \"Photos/Events/\", sizeGB: 24 },\n      { name: \"Overseas_Travel_RAW_A.jpg\", kind: \"media_milestone\", target: \"Photos/Travel/\", sizeGB: 32 },\n      { name: \"Overseas_Travel_RAW_B.jpg\", kind: \"media_milestone\", target: \"Photos/Travel/\", sizeGB: 19 },\n      { name: \"Screenshot_Itinerary.png\", kind: \"screenshot\", target: \"Photos/Screenshots/\", sizeGB: 0.5 }\n    ],\n    academic: [\n      { name: \"KAIST_PhD_Dissertation.pdf\", kind: \"doc_academic\", target: \"Documents/PhD_Admin/\", sizeGB: 0.8 },\n      { name: \"UMLS_Weekly_Seminar_DQN.pptx\", kind: \"doc_academic\", target: \"Documents/Lab_Meetings/\", sizeGB: 1.2 },\n      { name: \"ISOCELL_UniSoC_CoOpt.pptx\", kind: \"doc_academic\", target: \"Documents/Samsung_CIS/\", sizeGB: 0.6 },\n      { name: \"resume_yongjoon_song.html\", kind: \"doc_resume\", target: \"Resume/ + deploy/\", sizeGB: 0.1 },\n      { name: \"Restricted_Personal_Doc.pdf\", kind: \"doc_personal\", target: \"Personal/ (.gitignore)\", sizeGB: 0.1 },\n      { name: \"Global_R&D_Forum_Photo.jpg\", kind: \"media_milestone\", target: \"Photos/Business_Trips/\", sizeGB: 3.4 }\n    ]\n  };\n\n  const audCanvas = SB.canvas(\"cv-archive-audit\", 315, (ctx, W, H, P) => {\n    const items = SCENARIOS[audScenario] || SCENARIOS.mixed;\n    const zipOk = audZip === \"enforce\";\n    const purityOk = audPurity === \"enforce\";\n\n    let totalMediaGB = 0;\n    let indexedMediaGB = 0;\n    let dailyTotal = 0;\n    let dailyPure = 0;\n    let nonMediaMisplaced = 0;\n\n    items.forEach(it => {\n      if (it.kind.startsWith(\"media\") || it.kind === \"zip_media\" || it.kind === \"screenshot\" || it.kind === \"download\") {\n        totalMediaGB += it.sizeGB;\n        if (it.kind === \"zip_media\" && !zipOk) {\n          // Cannot index inside ZIP\n        } else {\n          indexedMediaGB += it.sizeGB;\n        }\n      }\n      if (it.kind === \"media_daily\") {\n        dailyTotal += 1;\n        dailyPure += 1;\n      }\n      if (!purityOk && (it.kind === \"screenshot\" || it.kind === \"download\" || it.kind === \"media_milestone\")) {\n        dailyTotal += 1;\n      }\n      if (!purityOk && it.kind.startsWith(\"doc_\")) {\n        nonMediaMisplaced += 1;\n      }\n    });\n\n    const syncRate = totalMediaGB > 0 ? (indexedMediaGB / totalMediaGB) * 100 : 100;\n    const purityRate = dailyTotal > 0 ? (dailyPure / dailyTotal) * 100 : 100;\n    const gateStatus = (audStrict >= 90 && purityOk) ? \"100% PASS (격리 완료)\" : (purityOk ? \"경고 (EXIF 점검)\" : \"위반 (비미디어 혼입)\");\n\n    SB.stat(\"aud-kpi-sync\", `<span style=\"color:${syncRate > 95 ? P.ok : P.bad}\">${syncRate.toFixed(1)}%</span>`);\n    SB.stat(\"aud-kpi-purity\", `<span style=\"color:${purityRate > 95 ? P.ok : P.warn}\">${purityRate.toFixed(0)}%</span>`);\n    SB.stat(\"aud-kpi-nonmedia\", `<span style=\"color:${nonMediaMisplaced === 0 ? P.ok : P.bad}\">${nonMediaMisplaced}건</span>`);\n    SB.stat(\"aud-kpi-gate\", `<span style=\"color:${audStrict >= 90 && purityOk ? P.ok : P.warn};font-size:13px\">${gateStatus}</span>`);\n\n    // Draw pipeline diagram on canvas\n    ctx.font = \"600 12px Pretendard, sans-serif\";\n    ctx.fillStyle = P.text;\n    ctx.fillText(\"마스터 아카이브 라우팅 & 무손실 백업 감사 파이프라인\", 14, 22);\n\n    const rowH = Math.min(24, Math.floor((H - 44) / items.length));\n    const leftW = Math.min(220, Math.floor(W * 0.43));\n    items.forEach((it, i) => {\n      const y = 38 + i * rowH;\n      const isZipViolation = it.kind === \"zip_media\" && !zipOk;\n      const isPurityViolation = !purityOk && (it.kind === \"screenshot\" || it.kind === \"download\" || it.kind.startsWith(\"doc_\"));\n      const ok = !isZipViolation && !isPurityViolation;\n\n      // Left box: incoming file\n      ctx.fillStyle = P.surface;\n      ctx.strokeStyle = P.border;\n      ctx.lineWidth = 1;\n      ctx.fillRect(14, y, leftW, rowH - 4);\n      ctx.strokeRect(14, y, leftW, rowH - 4);\n\n      ctx.fillStyle = P.text;\n      ctx.font = \"10.5px 'JetBrains Mono', monospace\";\n      ctx.textBaseline = \"middle\";\n      ctx.textAlign = \"left\";\n      ctx.fillText(it.name.slice(0, 27), 20, y + (rowH - 4) / 2);\n\n      // Arrow\n      const x1 = 14 + leftW + 6;\n      const x2 = x1 + 26;\n      const ym = y + (rowH - 4) / 2;\n      ctx.strokeStyle = ok ? P.accent : P.bad;\n      ctx.lineWidth = 1.6;\n      ctx.beginPath(); ctx.moveTo(x1, ym); ctx.lineTo(x2, ym); ctx.stroke();\n\n      // Right box: destination & status\n      const rx = x2 + 6;\n      const rw = W - rx - 14;\n      ctx.fillStyle = ok ? P.bg : \"rgba(224, 68, 62, 0.14)\";\n      ctx.strokeStyle = ok ? P.ok : P.bad;\n      ctx.fillRect(rx, y, rw, rowH - 4);\n      ctx.strokeRect(rx, y, rw, rowH - 4);\n\n      let destText = \"✓ \" + it.target;\n      if (isZipViolation) destText = \"✗ ZIP 미해제 (백업 누락)\";\n      else if (isPurityViolation) destText = \"⚠ Daily/ 오배치 (Rule 위반)\";\n      else if (it.kind === \"zip_media\" && zipOk) destText = \"✓ 압축해제 → \" + it.target;\n\n      ctx.fillStyle = ok ? P.ok : P.bad;\n      ctx.font = \"600 10.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(destText, rx + 7, ym);\n    });\n  });\n\n  SB.seg(\"aud-scenario\", v => { audScenario = v; audCanvas.redraw(); });\n  SB.seg(\"aud-zip\", v => { audZip = v; audCanvas.redraw(); });\n  SB.seg(\"aud-purity\", v => { audPurity = v; audCanvas.redraw(); });\n  SB.range(\"aud-strict\", \"aud-strict-out\", v => v + \"%\", v => { audStrict = v; audCanvas.redraw(); });\n\n  // =========================================================================\n  // Simulator 2: AI Photo Memory Studio (Split-Wipe & SFace 128-D Clustering)\n  // =========================================================================\n  let stMode = \"wipe\";\n  let stWipe = 52;\n  let stTau = 0.55;\n  let stEnh = 1.35;\n\n  const studioCanvas = SB.canvas(\"cv-studio-sim\", 300, (ctx, W, H, P) => {\n    const optDiff = Math.abs(stTau - 0.55);\n    const estClusters = Math.round(8 + (0.55 - stTau) * 18);\n    const clusterPurity = Math.max(68, 98.4 - optDiff * 55);\n    const psnrGain = ((stEnh - 1.0) * 8.2 + 2.4).toFixed(2);\n\n    SB.stat(\"st-kpi-clusters\", `${Math.max(3, estClusters)}개 인물 클러스터`);\n    if (stMode === \"wipe\") {\n      SB.stat(\"st-kpi-quality\", `<span style=\"color:${P.ok}\">+${psnrGain} dB (Split ${stWipe}%)</span>`);\n    } else {\n      SB.stat(\"st-kpi-quality\", `<span style=\"color:${clusterPurity > 92 ? P.ok : P.warn}\">순도 ${clusterPurity.toFixed(1)}% (τ=${stTau.toFixed(2)})</span>`);\n    }\n\n    if (stMode === \"wipe\") {\n      const wipeX = Math.round((stWipe / 100) * W);\n      const p1x = W * 0.27, p1y = H * 0.47;\n      const p2x = W * 0.71, p2y = H * 0.52;\n\n      // Left side: Legacy Camcorder Original\n      ctx.save();\n      ctx.beginPath(); ctx.rect(0, 0, wipeX, H); ctx.clip();\n      const gLeft = ctx.createLinearGradient(0, 0, 0, H);\n      gLeft.addColorStop(0, \"#473c35\");\n      gLeft.addColorStop(0.55, \"#6b5b4f\");\n      gLeft.addColorStop(1, \"#362f29\");\n      ctx.fillStyle = gLeft;\n      ctx.fillRect(0, 0, W, H);\n\n      ctx.fillStyle = \"rgba(220, 195, 165, 0.55)\";\n      ctx.beginPath(); ctx.arc(p1x, p1y, 32, 0, Math.PI * 2); ctx.fill();\n      ctx.fillRect(p1x - 36, p1y + 34, 72, 82);\n      ctx.beginPath(); ctx.arc(p2x, p2y, 25, 0, Math.PI * 2); ctx.fill();\n      ctx.fillRect(p2x - 28, p2y + 27, 56, 70);\n\n      // Scanlines\n      ctx.fillStyle = \"rgba(0,0,0,0.18)\";\n      for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1.5);\n      ctx.fillStyle = \"#f4b740\";\n      ctx.font = \"600 11px 'JetBrains Mono', monospace\";\n      ctx.textAlign = \"left\";\n      ctx.fillText(\"BEFORE · LEGACY CAMCORDER RAW\", 12, 22);\n      ctx.restore();\n\n      // Right side: AI Restored + YuNet/YOLO11n Bounding Boxes\n      ctx.save();\n      ctx.beginPath(); ctx.rect(wipeX, 0, W - wipeX, H); ctx.clip();\n      const gRight = ctx.createLinearGradient(0, 0, 0, H);\n      gRight.addColorStop(0, \"#1c4e80\");\n      gRight.addColorStop(0.55, \"#2e77ae\");\n      gRight.addColorStop(1, \"#1e5631\");\n      ctx.fillStyle = gRight;\n      ctx.fillRect(0, 0, W, H);\n\n      const boost = Math.min(1, 0.65 + (stEnh - 1.0) * 0.45);\n      ctx.fillStyle = `rgba(255, 235, 215, ${boost})`;\n      ctx.beginPath(); ctx.arc(p1x, p1y, 32, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = `rgba(76, 217, 123, ${boost})`;\n      ctx.fillRect(p1x - 36, p1y + 34, 72, 82);\n\n      ctx.fillStyle = `rgba(255, 235, 215, ${boost})`;\n      ctx.beginPath(); ctx.arc(p2x, p2y, 25, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = `rgba(56, 182, 245, ${boost})`;\n      ctx.fillRect(p2x - 28, p2y + 27, 56, 70);\n\n      // YuNet Face Detection Boxes\n      ctx.strokeStyle = \"#3fcf7f\";\n      ctx.lineWidth = 2;\n      ctx.strokeRect(p1x - 36, p1y - 36, 72, 72);\n      ctx.strokeRect(p2x - 28, p2y - 28, 56, 56);\n      ctx.fillStyle = \"#3fcf7f\";\n      ctx.font = \"600 10.5px 'JetBrains Mono', monospace\";\n      ctx.textAlign = \"center\";\n      ctx.fillText(\"YuNet 0.96 · ID#01\", p1x, p1y - 42);\n      ctx.fillText(\"YuNet 0.94 · ID#02\", p2x, p2y - 34);\n\n      ctx.fillStyle = \"#ffffff\";\n      ctx.font = \"600 11px 'JetBrains Mono', monospace\";\n      ctx.textAlign = \"right\";\n      ctx.fillText(`AFTER · AI Restored (${stEnh.toFixed(2)}x)`, W - 12, 22);\n      ctx.restore();\n\n      // Split-Wipe vertical divider bar + handle\n      ctx.strokeStyle = \"#ffffff\";\n      ctx.lineWidth = 2.5;\n      ctx.beginPath(); ctx.moveTo(wipeX, 0); ctx.lineTo(wipeX, H); ctx.stroke();\n      ctx.fillStyle = P.accent;\n      ctx.beginPath(); ctx.arc(wipeX, H / 2, 13, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = \"#ffffff\";\n      ctx.font = \"700 11px 'JetBrains Mono', monospace\";\n      ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\";\n      ctx.fillText(\"⇄\", wipeX, H / 2);\n\n      // Synchronized Zoom Loupe in bottom-right corner\n      const lr = 42, lx = W - 62, ly = H - 58;\n      ctx.save();\n      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.clip();\n      ctx.fillStyle = \"#162238\";\n      ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);\n      ctx.strokeStyle = \"rgba(56, 182, 245, 0.35)\";\n      for (let g = -lr; g <= lr; g += 8) {\n        ctx.beginPath(); ctx.moveTo(lx + g, ly - lr); ctx.lineTo(lx + g, ly + lr); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(lx - lr, ly + g); ctx.lineTo(lx + lr, ly + g); ctx.stroke();\n      }\n      ctx.fillStyle = \"#ffffff\";\n      ctx.font = \"600 10px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"2.5x LOUPE\", lx, ly - 18);\n      ctx.fillStyle = \"#3fcf7f\";\n      ctx.fillText(\"EXIF: OK\", lx, ly + 18);\n      ctx.restore();\n      ctx.strokeStyle = P.accent;\n      ctx.lineWidth = 2.5;\n      ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.stroke();\n    } else {\n      // Mode 2: SFace 128-D Cosine Embedding Space Projection\n      ctx.fillStyle = P.text;\n      ctx.font = \"600 12.5px Pretendard, sans-serif\";\n      ctx.fillText(`SFace 128-D 임베딩 투영 (코사인 거리 임계값 τ_face = ${stTau.toFixed(2)})`, 16, 22);\n\n      const centers = [\n        { x: W * 0.24, y: H * 0.42, color: P.accent, name: \"Cluster #01 (Primary A)\" },\n        { x: W * 0.52, y: H * 0.36, color: P.ok, name: \"Cluster #02 (Primary B)\" },\n        { x: W * 0.76, y: H * 0.48, color: P.accent2, name: \"Cluster #03 (Group C)\" },\n        { x: W * 0.40, y: H * 0.74, color: P.warn, name: \"Cluster #04 (Group D)\" }\n      ];\n      const radiusPx = stTau * 115;\n\n      centers.forEach((c, idx) => {\n        ctx.save();\n        ctx.fillStyle = c.color;\n        ctx.globalAlpha = 0.12;\n        ctx.beginPath(); ctx.arc(c.x, c.y, radiusPx, 0, Math.PI * 2); ctx.fill();\n        ctx.globalAlpha = 0.75;\n        ctx.strokeStyle = c.color;\n        ctx.setLineDash([4, 4]);\n        ctx.lineWidth = 1.5;\n        ctx.stroke();\n        ctx.restore();\n\n        for (let k = 0; k < 14; k++) {\n          const ang = (k / 14) * Math.PI * 2 + idx * 0.7;\n          const dist = 10 + ((k * 17 + idx * 9) % 42);\n          const px = c.x + Math.cos(ang) * dist;\n          const py = c.y + Math.sin(ang) * dist;\n          ctx.fillStyle = dist <= radiusPx ? c.color : P.faint;\n          ctx.beginPath(); ctx.arc(px, py, 3.8, 0, Math.PI * 2); ctx.fill();\n        }\n\n        ctx.fillStyle = P.text;\n        ctx.font = \"600 11.5px Pretendard, sans-serif\";\n        ctx.textAlign = \"center\";\n        ctx.fillText(c.name, c.x, c.y - radiusPx - 6);\n      });\n    }\n  });\n\n  SB.seg(\"st-mode\", v => { stMode = v; studioCanvas.redraw(); });\n  SB.range(\"st-wipe\", \"st-wipe-out\", v => v + \"%\", v => { stWipe = v; studioCanvas.redraw(); });\n  SB.range(\"st-tau\", \"st-tau-out\", v => v.toFixed(2), v => { stTau = v; studioCanvas.redraw(); });\n  SB.range(\"st-enh\", \"st-enh-out\", v => v.toFixed(2) + \"×\", v => { stEnh = v; studioCanvas.redraw(); });\n});\n<\/script>\n\n</main>\n</body>\n</html>\n", "notes": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch.07 용어집 &amp; 코드·문서·특허·아카이브 정합성 검증 노트 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"전 영역(Development · Documents · Photos) 30개 정합성 감사 노트, 5단계 자동 빌드 검증 게이트, 56개 핵심 용어 인터랙티브 사전\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-chapter=\"notes\" data-root=\"../\">\n<main class=\"chapter\">\n\n  <header class=\"chapter-hero\">\n    <div class=\"eyebrow\">CHAPTER 07 · AUDIT NOTES &amp; INTERACTIVE GLOSSARY</div>\n    <h1>코드·문서·특허·아카이브 정합성 검증 노트 &amp; 핵심 용어집</h1>\n    <p class=\"lead\">\n      15년에 걸친 연구 코드(<code>Development/</code>), 1,200+건의 학술·커리어 문서(<code>Documents/</code>), 그리고 20TB 규모의 평생 미디어 아카이브(<code>Photos/</code>)를\n      하나의 마스터 워크스페이스로 운영할 때는 초기 논문·발표자료의 서술과 실제 실행 코드 및 아카이브 정책 사이의 정합성을 상시 검증해야 합니다.\n      이 장에서는 전 영역 <strong>정합성 감사(Audit) 29개 항목</strong>을 투명하게 공개하고,\n      가이드북 전 챕터 본문에서 툴팁으로 동작하는 <strong>49개 핵심 용어 사전</strong>을 제공합니다.\n    </p>\n    <ul class=\"objectives\">\n      <li><code>Development/</code>(Bio · WPT · Auto · Life), <code>Documents/</code>(KAIST 학술 · 웹 이력서 · 개인정보 격리), <code>Photos/</code>(7대 카테고리 · Zero-ZIP · EXIF) 전 영역의 <strong>29개 정합성 검증 항목</strong>을 확인한다.</li>\n      <li><code>docs/build_spec_portal.py</code>가 수행하는 <strong>5단계 자동 검증 게이트</strong>(파일·라인 실존, 수식 균형, HTML 태그 균형, 템플릿 토큰, 개인정보 격리)의 작동 원리를 이해한다.</li>\n      <li>가이드북 전체에서 점선 밑줄 툴팁(<code>.gl-term</code>)으로 연결되는 <strong>49개 핵심 기술·운영 용어</strong>를 실시간으로 검색·탐색한다.</li>\n    </ul>\n  </header>\n\n  <section id=\"notes-audit\">\n    <h2>코드 · 특허 · 문서 · 아카이브 정합성 감사 목록 (29개 항목)</h2>\n    <p>\n      본 가이드북의 모든 챕터(Ch.01 ~ Ch.06)는 아래 표의 <strong>“코드 · 아카이브의 실제 (정본 기준)”</strong> 열을 단일 진실 공급원(Single Source of Truth)으로 삼아 작성되었습니다.\n      영역 필터 칩을 클릭해 관심 있는 저장소나 테마별로 필터링해 보세요.\n    </p>\n    <div class=\"card\">\n      <div class=\"filter-row\" role=\"group\" aria-label=\"영역 필터\">\n        <button type=\"button\" class=\"chip active\" data-filter=\"all\">전체 (29)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"Bio\">Theme 2 · Bio (6)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"WPT\">Theme 1 · WPT (5)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"Auto\">Themes 3·4 · Auto (6)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"Life\">Theme 5 · Life (4)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"Documents\">Documents/ (4)</button>\n        <button type=\"button\" class=\"chip\" data-filter=\"Photos\">Photos/ (4)</button>\n      </div>\n      <div class=\"tbl-wrap\">\n        <table class=\"tbl\" id=\"notes-tbl\">\n          <thead>\n            <tr>\n              <th>영역</th>\n              <th>점검 대상 / 초기 요약 서술</th>\n              <th>코드 · 아카이브의 실제 (정본 기준)</th>\n              <th>검증된 근거 파일</th>\n              <th>상태</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>DQNAlign이 모든 염기쌍 스텝마다 CNN 추론을 수행한다는 초기 요약</td><td>일치 구간에서는 신경망을 우회하는 Exact Match Skip (skip / reverseskip / skipRC)으로 O(N) 선형 가속</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py#L82\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/agent.py:82\">agent.py:82</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>Dueling DQN 은닉층 크기 및 스트림 분할 규격</td><td>h_size=256 은닉 벡터를 tf.split으로 128-D Advantage(streamAC)와 128-D Value(streamVC)로 정확히 이등분</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L52\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:52\">Learning.py:52</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>SSDnetwork 합성곱 연산 구조</td><td>표준 Conv2D 대신 tf.nn.separable_conv2d(깊이별 분리 합성곱)를 사용해 파라미터와 MAC 연산량 경량화</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py#L88\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/Learning.py:88\">Learning.py:88</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>합성 유전체 인델(Indel) 길이 분포 가정</td><td>단순 균등분포가 아니라 생물학적 멱법칙을 따르는 Zipfian 분포(s=1.6)를 alignment.py와 Insilico.py에 공통 적용</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py#L42\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/DQNalign/tool/RL/alignment.py:42\">alignment.py:42</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>REminerII 기본 시드·확장 파라미터</td><td>WORD_SIZE=14, ALLOW_SIZE=1, SPACE_SIZE=2, MIN_SEED_LEN=28, GREEDY_X=30, THRESHOLD=3000 정본 파싱</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py#L40\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py:40\">Insilico.py:40</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Bio' data-status='resolved'><td><span class='badge b-area'>Bio</span></td><td>REDNN 암 바이오마커 신경망 아키텍처 (US 2019/0385696 A1)</td><td>특징 선택(F-score·MI·Tree) 후 153 → 128 → 64 → 2 완전연결층 + Dropout 0.5 분류기로 구현</td><td><a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py#L74\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py:74\">REDNN.py:74</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='WPT' data-status='resolved'><td><span class='badge b-area'>WPT</span></td><td>3D WPT 카메라 캘리브레이션 모델</td><td>OpenCV 기본 체커보드 함수 대신 Tsai 2단계 11-DoF 핀홀 모델 + 투영 행렬 추정(Find_K_Matrix) 직접 구현</td><td><a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L4\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:4\">TsaiCalibration.py:4</a></td><td><span class='badge b-on 막기 위해 .zip/.7z/.rar/.tar 전수 압축 해제 상태 유지</td><td><a class=\"src\" href=\"../../../Photos/README.md\" target=\"_blank\" rel=\"noopener\" title=\"Photos/README.md\">README.md</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Photos' data-status='resolved'><td><span class='badge b-area'>Photos</span></td><td>Zero Non-Media 정책 및 일상 앨범 순도 보존 (Purity of Daily Feed)</td><td>비미디어 문서(.pdf/.hwp/.pptx/.xlsx)는 Documents/·Development/로 이전하고, 캡처·웹 이미지는 Screenshots/·Downloads/로 격리</td><td><a class=\"src\" href=\"../../../Photos/GEMINI.md\" target=\"_blank\" rel=\"noopener\" title=\"Photos/GEMINI.md\">GEMINI.md</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n            <tr data-area='Photos' data-status='resolved'><td><span class='badge b-area'>Photos</span></td><td>AI 포토 메모리 스튜디오의 Photos/ 마운트 정책</td><td>4_Photo_Memory_Studio/server.py는 Photos/ 원본을 Read-Only로만 참조하며, YuNet+SFace 128-D 인덱스는 별도 SQLite DB에 저장</td><td><a class=\"src\" href=\"../../5_Household_and_Life_Automation/4_Photo_Memory_Studio/server.py#L30\" target=\"_blank\" rel=\"noopener\" title=\"5_Household_and_Life_Automation/4_Photo_Memory_Studio/server.py:30\">server.py:30</a></td><td><span class='badge b-on'>반영 완료</span></td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"notes-policy\">\n    <h2>Single-Source-of-Truth 빌드 원칙과 5단계 자동 검증</h2>\n    <p>\n      가이드북 전체(<code>docs/index.html</code>, <code>docs/chapters/*.html</code>, <code>docs/css/*</code>, <code>docs/js/*</code>)는\n      수작업 HTML 편집이 아니라 <a class=\"src\" href=\"../../docs/build_spec_portal.py\" target=\"_blank\" rel=\"noopener\" title=\"docs/build_spec_portal.py\">docs/build_spec_portal.py</a> 스크립트에 의해 결정론적으로 생성되며, 빌드 시 아래 5가지 무결성 게이트를 통과해야만 배포본이 갱신됩니다.\n    </p>\n    <div class=\"grid-3\">\n      <div class=\"card\">\n        <h3>Gate 1 · 소스 링크 &amp; 라인 앵커 검증</h3>\n        <p>\n          본문의 모든 <code>src()</code> 호출에 대해 대상 파일의 실존 여부와 함수/클래스/상수 문자열의 실제 라인 번호(<code>#Lxx</code>)를 전수 검사합니다.\n        </p>\n      </div>\n      <div class=\"card\">\n        <h3>Gate 2 · 수식 &amp; HTML DOM 정합성</h3>\n        <p>\n          디스플레이·인라인 LaTeX 수식의 중괄호 균형과 수식 내 미이스케이프 한글 혼입을 차단하고, <code>HTMLParser</code>로 모든 태그의 열림/닫힘 짝을 검증합니다.\n        </p>\n      </div>\n      <div class=\"card\">\n        <h3>Gate 3 · Privacy Gate (Rule 5 수호)</h3>\n        <p>\n          <code>Documents/Personal/</code> 하위의 비공개 문서와 로컬 원장 데이터(<code>Data/*.xlsx</code>) 및 개인 식별 키워드가 단 한 줄이라도 포함되면 빌드를 즉시 중단합니다.\n        </p>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"glossary-sec\">\n    <h2>마스터 워크스페이스 핵심 기술 · 운영 용어집 (Interactive Glossary)</h2>\n    <p>\n      가이드북 본문에서 점선 밑줄로 표시되는 모든 핵심 용어(49개)의 정의와 영문 표기, 관련 챕터 링크입니다.\n      검색창에 한글·영문·약어 키워드를 입력하면 실시간으로 필터링됩니다.\n    </p>\n    <input type=\"search\" class=\"gl-search\" id=\"gl-search-input\" placeholder=\"용어 검색 (예: DQNAlign, Tsai, StarForce, Zero-ZIP, Documents, Photos, SFace, OOXML...)\" aria-label=\"용어 검색\">\n    <div class=\"gl-list\" id=\"gl-list-box\"></div>\n  </section>\n\n  <section class=\"keypoints\" id=\"summary\">\n    <h2>핵심 정리 · Chapter 07</h2>\n    <ol>\n      <li><strong>전 영역 정합성 보장</strong>: <code>Development/</code> 5대 테마의 소스코드뿐 아니라 <code>Documents/</code> 학술·이력서 아카이브와 <code>Photos/</code> 20TB 미디어 아카이브의 운영 원칙까지 단일 기준으로 교차 검증했습니다.</li>\n      <li><strong>결정론적 원커맨드 빌드</strong>: <code>python3 docs/build_spec_portal.py</code> 명령 하나로 7개 챕터와 검색 인덱스, 용어집 툴팁, 140+개 소스 링크가 재검증·재생성됩니다.</li>\n    </ol>\n  </section>\n\n<script>\n(function(){\n  document.querySelectorAll('.chip[data-filter]').forEach(c => {\n    c.addEventListener('click', () => {\n      document.querySelectorAll('.chip[data-filter]').forEach(x => x.classList.toggle('active', x === c));\n      const f = c.dataset.filter;\n      document.querySelectorAll('#notes-tbl tbody tr').forEach(tr => {\n        tr.style.display = (f === 'all' || tr.dataset.area === f) ? '' : 'none';\n      });\n    });\n  });\n\n  const listBox = document.getElementById('gl-list-box');\n  const searchInput = document.getElementById('gl-search-input');\n  const terms = ((window.BOOK_GLOSSARY && window.BOOK_GLOSSARY.terms) || []).slice().sort((a, b) => (a.ko || '').localeCompare(b.ko || '', 'ko'));\n\n  function renderGlossary(q){\n    if(!listBox) return;\n    const query = (q || '').trim().toLowerCase();\n    const html = [];\n    terms.forEach(item => {\n      const hay = ((item.ko || '') + ' ' + (item.en || '') + ' ' + (item.abbr || '') + ' ' + (item.def || '')).toLowerCase();\n      if(query && !hay.includes(query)) return;\n      const chBadges = (item.chapters || []).map(ch => `<a class=\"src\" href=\"${ch}.html\">Ch.${ch.toUpperCase()}</a>`).join(' ');\n      const abbrSpan = item.abbr ? `<span class=\"badge b-area\">${item.abbr}</span>` : '';\n      html.push(\n        `<div class=\"gl-item\">` +\n          `<div class=\"gl-head\"><span class=\"gl-name\">${item.ko || ''}</span>${abbrSpan}<span class=\"gl-en\">${item.en || ''}</span>${chBadges}</div>` +\n          `<div class=\"gl-desc\">${item.def || ''}</div>` +\n        `</div>`\n      );\n    });\n    listBox.innerHTML = html.length ? html.join('') : '<div class=\"card\"><p>일치하는 용어가 없습니다.</p></div>';\n  }\n  renderGlossary('');\n  if(searchInput){\n    searchInput.addEventListener('input', e => renderGlossary(e.target.value));\n  }\n})();\n<\/script>\n\n</main>\n</body>\n</html>\n"};
window.__sbOpenPage = function(slug, hash) {
  const frame = document.getElementById('sb-spa-frame');
  const raw = window.__SB_PAGES__[slug] || window.__SB_PAGES__['home'];
  if (!frame || !raw) return;
  const S = window.__SB_SHARED__;
  let hydrated = raw
    .replace('{{__SB_STYLE_CSS__}}', () => S.style_css)
    .replace('{{__SB_GLOSSARY_CSS__}}', () => S.glossary_css)
    .replace('{{__SB_GLOSSARY_DATA_JS__}}', () => S.glossary_data_js)
    .replace('{{__SB_COMMON_JS__}}', () => S.common_js)
    .replace('{{__SB_GLOSSARY_JS__}}', () => S.glossary_js);
  if (hash) {
    const scrollBoot = `<script>window.addEventListener('load',function(){setTimeout(function(){var el=document.getElementById(${JSON.stringify(hash)});if(el)el.scrollIntoView({behavior:'smooth'});},120);});<\/script>`;
    hydrated = hydrated.replace('</body>', scrollBoot + '</body>');
  }
  frame.srcdoc = hydrated;
  try { history.replaceState(null, '', '#' + slug + (hash ? ':' + hash : '')); } catch(e) {}
};
(function(){
  const initHash = (location.hash || '').replace(/^#/, '');
  const [initSlug, initSec] = initHash.split(':');
  window.__sbOpenPage(initSlug && window.__SB_PAGES__[initSlug] ? initSlug : 'home', initSec || '');
})();
