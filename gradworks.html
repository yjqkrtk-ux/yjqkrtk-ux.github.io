/label>\n          <label class=\"ctrl\">\n            <span>슬라이딩 윈도우 크기 $W$ (Window Size) <output id=\"bio-lbl-w\">8x8</output></span>\n            <input type=\"range\" id=\"bio-rng-w\" min=\"4\" max=\"14\" step=\"2\" value=\"8\" />\n          </label>\n          <div class=\"ctrl\">\n            <span>Exact Match Skip (<code>Agent.skip</code>)</span>\n            <div class=\"seg\" id=\"bio-skip-btns\">\n              <button type=\"button\" class=\"on\" data-skip=\"1\">ON (Skip + DDQN)</button>\n              <button type=\"button\" data-skip=\"0\">OFF (Pure DDQN)</button>\n            </div>\n          </div>\n          <div class=\"btn-row\">\n            <button type=\"button\" id=\"bio-btn-regen\">🔄 새로운 변이 서열 쌍 생성 (Zipfian Indel)</button>\n          </div>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">NW DP 셀 연산 수</span><span class=\"v\" id=\"bio-st-nw\">1,764 cells</span></div>\n        <div class=\"stat\"><span class=\"k\">DQN 신경망 호출</span><span class=\"v\" id=\"bio-st-dqn\">8 calls</span></div>\n        <div class=\"stat\"><span class=\"k\">Exact-Skip 비율</span><span class=\"v\" id=\"bio-st-skip\">80.0%</span></div>\n        <div class=\"stat\"><span class=\"k\">연산 가속비 (NW/DQN)</span><span class=\"v\" id=\"bio-st-speed\">220.5x</span></div>\n      </div>\n      <div class=\"sim-note\" id=\"bio-dqn-readout\"></div>\n    </section>\n  </section>\n\n  <section id=\"sec-reminer\">\n    <h2>고속 반복서열 마이닝 (REminerII · PixelRE) 및 MFC 시각화 스위트</h2>\n    <p>\n      인간 유전체의 절반 이상을 차지하는 산재 반복서열(Interspersed Repeat Elements, 예: Alu, LINE, SINE)을 염색체 규모에서 발굴하기 위해,\n      Theme 2는 두 가지 상호보완적 엔진을 제공합니다:\n    </p>\n    <ul>\n      <li>\n        <strong>REminerII (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py#L74\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py:74\">Insilico.py:74</a>)</strong>:\n        C++ 코어 엔진과 파이썬 파이프라인으로 구성되며, <code>Setparam()</code>(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py#L40\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/REminerII/Insilico.py:40\">Insilico.py:40</a>)이 기록하는 기본 파라미터는\n        시드 길이 <code>WORD_SIZE = 14</code>, 허용 불일치 <code>ALLOW_SIZE = 1</code>, 병합 간격 <code>SPACE_SIZE = 2</code>,\n        최소 시드 길이 <code>MIN_SEED_LEN = 28</code>, 그리고 확장 조기 종료 임계값 <code>GREEDY_X = 30</code>입니다.\n        Greedy X-Drop 확장 시 현재 점수가 최고점 대비 $X_{\\text{drop}} = 30$ 이상 하락하면 즉시 탐색을 멈춰 불필요한 확장을 차단합니다.\n      </li>\n      <li>\n        <strong>PixelRE (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/PixelRE/PixelRE.m#L3\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Sequence_Mining_and_Alignment/PixelRE/PixelRE.m:3\">PixelRE.m:3</a>)</strong>:\n        서열 상동성 행렬을 2차원 닷플롯(Dot-Plot) 이진 영상으로 투영한 뒤, 다중 스케일 윈도우 <code>w = [7, 8, 10, 12, 14]</code>와\n        형태소(Morphological) 대각선 필터링을 적용하여 정방향 및 역상보 반복서열 클러스터를 고속 추출합니다.\n      </li>\n      <li>\n        <strong>11종 Win32 MFC / DirectX 가시화 스위트 (<code>RE_*</code>)</strong>:\n        대용량 반복서열 밀도 맵과 히트맵을 데스크톱에서 실시간 렌더링하기 위해 <code>RE_viewer</code>, <code>RE_heatmap</code>, <code>RE_renderer</code> 등\n        11개의 독립 C++/MFC 서브모듈이 함께 구축되어 있습니다.\n      </li>\n    </ul>\n  </section>\n\n  <section id=\"sec-sim-reminer\">\n    <h2>인터랙티브 시뮬레이터 · REminerII &amp; PixelRE 닷플롯 시드 확장</h2>\n    <p>\n      아래 시뮬레이터는 정방향(Forward) 반복 구간과 역상보(Reverse-Complement) 역위(Inversion) 구간이 포함된 유전체 세그먼트에서\n      시드 크기 $w$와 <code>GREEDY_X</code> 임계값에 따른 2차원 닷플롯 검출 결과를 실시간 렌더링합니다.\n    </p>\n\n    <section class=\"sim\" id=\"sim-reminer\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 03 · DOT-PLOT REPEAT MINER</span>\n        <h3>REminerII Seed-and-Extend &amp; PixelRE Multi-Scale Dot-Plot</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\">\n          <canvas id=\"bio-rem-canvas\"></canvas>\n        </div>\n        <div class=\"sim-controls\">\n          <label class=\"ctrl\">\n            <span>시드/윈도우 크기 $w$ (PixelRE / WORD_SIZE) <output id=\"rem-lbl-w\">12 bp</output></span>\n            <input type=\"range\" id=\"rem-rng-w\" min=\"7\" max=\"16\" step=\"1\" value=\"12\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>Greedy X-Drop 임계값 (<code>GREEDY_X</code>) <output id=\"rem-lbl-x\">30</output></span>\n            <input type=\"range\" id=\"rem-rng-x\" min=\"10\" max=\"50\" step=\"5\" value=\"30\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>염기 치환 노이즈 (Background Mutation) <output id=\"rem-lbl-noise\">12%</output></span>\n            <input type=\"range\" id=\"rem-rng-noise\" min=\"2\" max=\"30\" step=\"2\" value=\"12\" />\n          </label>\n          <div class=\"ctrl\">\n            <span>가닥 검출 모드 (Strand Mode)</span>\n            <div class=\"seg\" id=\"rem-strand-btns\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:5px;\">\n              <button type=\"button\" data-s=\"FWD\">Forward Only</button>\n              <button type=\"button\" data-s=\"RC\">RC Only</button>\n              <button type=\"button\" class=\"on\" data-s=\"BOTH\" style=\"grid-column:1 / -1;\">Both (Fwd + RC)</button>\n            </div>\n          </div>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">검출 시드 히트</span><span class=\"v\" id=\"rem-st-seeds\">0</span></div>\n        <div class=\"stat\"><span class=\"k\">확장된 정방향 RE</span><span class=\"v\" id=\"rem-st-fwd\">0</span></div>\n        <div class=\"stat\"><span class=\"k\">확장된 역상보 RE</span><span class=\"v\" id=\"rem-st-rc\">0</span></div>\n        <div class=\"stat\"><span class=\"k\">배경 위양성 노이즈</span><span class=\"v\" id=\"rem-st-fp\">0 dots</span></div>\n      </div>\n      <div class=\"sim-note\" id=\"rem-readout\"></div>\n    </section>\n  </section>\n\n  <section id=\"sec-biomarkers\">\n    <h2>암 질환 바이오마커 분류기 (REDNN · RERNN) 및 집단 유전체학</h2>\n    <p>\n      발굴된 반복서열 변이 프로파일을 임상 질환 예측과 인간 집단 진화 분석으로 연결하기 위해 다음 두 파이프라인이 이어집니다:\n    </p>\n    <ul>\n      <li>\n        <strong>REDNN &amp; RERNN (<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py#L74\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py:74\">REDNN.py:74</a>)</strong>:\n        환자별 $12{,}288$차원 유전체 반복서열 특징 벡터 $x \\in \\mathbb{R}^{12288}$(<a class=\"src\" href=\"../../2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py#L69\" target=\"_blank\" rel=\"noopener\" title=\"2_Bioinformatics_and_Genomics/Deep_Learning_Biomarkers/REDNN/REDNN.py:69\">REDNN.py:69</a>)를 입력받아\n        6층 완전연결 신경망($12288 \\to 512 \\to 256 \\to 128 \\to 64 \\to 32 \\to 4$, ReLU 활성화 및 Softmax 교차 엔트로피 손실)과\n        순환신경망(<code>RERNN</code>)으로 4개 임상 위험군 클래스를 분류합니다.\n      </li>\n      <li>\n        <strong>Population Genetics (<code>1092x</code> · <code>clustering205</code> · <code>EvolDist</code>)</strong>:\n        1000 Genomes Project의 $1{,}092$명 개인 유전체 데이터로부터 Jukes-Cantor 진화 거리 행렬을 계산하고 계통수(Phylogenetic Tree) 클러스터링을 수행합니다.\n      </li>\n    </ul>\n  </section>\n\n  <section class=\"keypoints\" id=\"summary\">\n    <h2>핵심 정리 · Chapter 02</h2>\n    <ol>\n      <li><strong>DQNAlign 선형 시간 정렬</strong>: $W \\times W$ 국소 윈도우 관측과 <code>Agent.skip()</code> Exact Match Skip을 결합해 $O(N_1 N_2)$ 전역 DP를 $O(N)$ 선형 시간 및 상수 윈도우 메모리로 단축했습니다.</li>\n      <li><strong>REminerII · PixelRE · REDNN</strong>: 시드 해싱 + Greedy X-Drop($X=30$)과 다중 스케일 닷플롯으로 염색체 규모 반복서열을 발굴하고 12,288차원 심층신경망으로 임상 위험군을 분류합니다.</li>\n    </ol>\n  </section>\n\n  <script>\n  document.addEventListener(\"DOMContentLoaded\", function () {\n    var BIO_INFO = {\n      \"bio-window\": {\n        title: \"STAGE 1 · Pairwise MDP Environment & Exact Match Skip\",\n        body: \"alignment.py의 Pairwise 클래스는 현재 정렬 좌표 (x, y)에서 W x W 부분 서열을 추출합니다. agent.py의 skip(), reverseskip(), skipRC()는 두 염기가 동일할 때 딥러닝 추론 없이 대각선으로 즉시 전진하여 O(N) 실행 속도를 달성합니다.\"\n      },\n      \"bio-ddqn\": {\n        title: \"STAGE 2 · Dueling Double DQN & Separable Conv2D (Learning.py)\",\n        body: \"Qnetwork와 SSDnetwork는 256차원 은닉 특징을 Value(128)와 Advantage(128)로 분할해 Q(s,a)를 추정하며, 50,000 크기 Experience Replay Buffer와 tau=0.001 소프트 타깃 업데이트로 학습을 안정화합니다.\"\n      },\n      \"bio-reminer\": {\n        title: \"STAGE 3 · REminerII Seed-and-Extend & PixelRE Dot-Plot\",\n        body: \"REminerII는 WORD_SIZE=14 시드 인덱싱과 GREEDY_X=30 X-Drop 확장으로 MIN_SEED_LEN=28 이상의 반복서열을 검출하며, PixelRE.m은 w=[7,8,10,12,14] 다중 윈도우 형태소 필터로 2D 닷플롯 대각선 패턴을 추출합니다.\"\n      },\n      \"bio-rednn\": {\n        title: \"STAGE 4 · REDNN / RERNN Biomarker Classifier & 1092x EvolDist\",\n        body: \"REDNN.py는 12,288차원 유전체 특징 벡터를 512-256-128-64-32-4 계층으로 매핑해 암 위험군을 예측하며, 1092x/clustering205/EvolDist는 1,092명 집단 유전체 계통수를 재구성합니다.\"\n      }\n    };\n    var bioNodes = document.querySelectorAll(\"#bio-svg .svg-node\");\n    bioNodes.forEach(function (n) {\n      n.addEventListener(\"click\", function () {\n        bioNodes.forEach(function (x) { x.classList.remove(\"is-selected\"); });\n        n.classList.add(\"is-selected\");\n        var info = BIO_INFO[n.getAttribute(\"data-node\")];\n        if (info) {\n          document.getElementById(\"bio-insp-title\").textContent = \"📌 \" + info.title;\n          document.getElementById(\"bio-insp-body\").textContent = info.body;\n        }\n      });\n    });\n\n    // 2. Sim 02: DQNAlign vs NW DP Simulator\n    var rngN = document.getElementById(\"bio-rng-n\");\n    var rngMut = document.getElementById(\"bio-rng-mut\");\n    var rngW = document.getElementById(\"bio-rng-w\");\n    var useSkip = true;\n    var seedOffset = 1;\n    var dqnState = { N: 42, W: 8, path: [], nwCells: 1764, dqnCalls: 8, skipRatio: \"80.0\", speed: \"220.5\" };\n\n    var dqnChart = window.SB && window.SB.canvas(\"bio-dqn-canvas\", 320, function (ctx, CW, CH, P) {\n      var N = dqnState.N;\n      var W = dqnState.W;\n      var path = dqnState.path;\n      var padL = 32, padT = 26;\n      var gridSz = Math.min(CW - 210, CH - 48);\n      var cell = gridSz / N;\n\n      ctx.fillStyle = P.surface;\n      ctx.fillRect(padL, padT, gridSz, gridSz);\n      ctx.strokeStyle = P.grid;\n      ctx.lineWidth = 1;\n      for (var i = 0; i <= N; i += 2) {\n        var px = padL + i * cell;\n        var py = padT + i * cell;\n        ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + gridSz); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(padL + gridSz, py); ctx.stroke();\n      }\n      ctx.strokeStyle = P.border;\n      ctx.strokeRect(padL, padT, gridSz, gridSz);\n\n      ctx.strokeStyle = P.faint;\n      ctx.setLineDash([4, 4]);\n      ctx.beginPath();\n      ctx.moveTo(padL, padT);\n      ctx.lineTo(padL + gridSz, padT + gridSz);\n      ctx.stroke();\n      ctx.setLineDash([]);\n\n      for (var k = 1; k < path.length; k++) {\n        var p0 = path[k - 1], p1 = path[k];\n        var x0 = padL + p0.x * cell + cell * 0.5;\n        var y0 = padT + p0.y * cell + cell * 0.5;\n        var x1 = padL + p1.x * cell + cell * 0.5;\n        var y1 = padT + p1.y * cell + cell * 0.5;\n\n        if (p1.type === \"dqn\" || p1.type === \"indel\") {\n          var wx = padL + p0.x * cell;\n          var wy = padT + p0.y * cell;\n          var ww = Math.min(W * cell, padL + gridSz - wx);\n          var wh = Math.min(W * cell, padT + gridSz - wy);\n          ctx.fillStyle = P.acc2Soft;\n          ctx.fillRect(wx, wy, ww, wh);\n          ctx.strokeStyle = P.accent2;\n          ctx.lineWidth = 1;\n          ctx.strokeRect(wx, wy, ww, wh);\n        }\n\n        ctx.lineWidth = 2.6;\n        if (p1.type === \"skip\") ctx.strokeStyle = P.ok;\n        else if (p1.type === \"indel\") ctx.strokeStyle = P.bad;\n        else ctx.strokeStyle = P.accent2;\n\n        ctx.beginPath();\n        ctx.moveTo(x0, y0);\n        ctx.lineTo(x1, y1);\n        ctx.stroke();\n      }\n\n      var lx = padL + gridSz + 20;\n      ctx.fillStyle = P.text;\n      ctx.font = \"600 12px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"TRAJECTORY LEGEND\", lx, 44);\n\n      var leg = [\n        { c: P.ok, t: \"Exact Match Skip\" },\n        { c: P.accent2, t: \"DDQN Forward\" },\n        { c: P.bad, t: \"DDQN Indel Gap\" },\n        { c: P.accent, t: \"W x W Window\" }\n      ];\n      leg.forEach(function (it, idx) {\n        var ly = 70 + idx * 26;\n        ctx.fillStyle = it.c;\n        ctx.fillRect(lx, ly - 8, 14, 10);\n        ctx.fillStyle = P.dim;\n        ctx.font = \"11.5px 'JetBrains Mono', monospace\";\n        ctx.fillText(it.t, lx + 20, ly);\n      });\n\n      ctx.fillStyle = P.accent;\n      ctx.font = \"600 11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"COMPLEXITY METRICS\", lx, 198);\n      ctx.fillStyle = P.dim;\n      ctx.font = \"11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"NW Grid : \" + dqnState.nwCells, lx, 220);\n      ctx.fillText(\"DQN Call: \" + dqnState.dqnCalls, lx, 238);\n      ctx.fillText(\"Skip Opt: \" + dqnState.skipRatio + \"%\", lx, 256);\n      ctx.fillStyle = P.ok;\n      ctx.font = \"600 11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"Speedup : \" + dqnState.speed + \"x\", lx, 278);\n    });\n\n    function runDqnSim() {\n      var N = parseInt(rngN.value, 10);\n      var mutPct = parseInt(rngMut.value, 10);\n      var W = parseInt(rngW.value, 10);\n      document.getElementById(\"bio-lbl-n\").textContent = N + \" bp\";\n      document.getElementById(\"bio-lbl-mut\").textContent = mutPct + \"%\";\n      document.getElementById(\"bio-lbl-w\").textContent = W + \"x\" + W;\n\n      var x = 0, y = 0;\n      var path = [{ x: 0, y: 0, type: \"start\" }];\n      var skipSteps = 0;\n      var dqnCalls = 0;\n      var score = 0;\n      var stepIdx = 0;\n\n      while (x < N - 1 && y < N - 1) {\n        stepIdx++;\n        var h = ((stepIdx * 37 + seedOffset * 101 + x * 13 + y * 17) % 100);\n        if (h >= mutPct) {\n          x++; y++;\n          score += 2;\n          if (useSkip) {\n            skipSteps++;\n            path.push({ x: x, y: y, type: \"skip\" });\n          } else {\n            dqnCalls++;\n            path.push({ x: x, y: y, type: \"dqn\" });\n          }\n        } else if (h < Math.floor(mutPct * 0.45)) {\n          dqnCalls++;\n          score -= 2;\n          if (stepIdx % 2 === 0 && x < N - 2) {\n            x++;\n            path.push({ x: x, y: y, type: \"indel\" });\n          } else if (y < N - 2) {\n            y++;\n            path.push({ x: x, y: y, type: \"indel\" });\n          } else {\n            x++; y++;\n            path.push({ x: x, y: y, type: \"dqn\" });\n          }\n        } else {\n          dqnCalls++;\n          score -= 1;\n          x++; y++;\n          path.push({ x: x, y: y, type: \"dqn\" });\n        }\n      }\n\n      var totalSteps = Math.max(1, skipSteps + dqnCalls);\n      var skipRatio = ((skipSteps / totalSteps) * 100).toFixed(1);\n      var nwCells = N * N;\n      var speed = (nwCells / Math.max(1, dqnCalls)).toFixed(1);\n\n      window.SB.stat(\"bio-st-nw\", nwCells.toLocaleString() + \" cells\");\n      window.SB.stat(\"bio-st-dqn\", dqnCalls + \" calls\");\n      window.SB.stat(\"bio-st-skip\", skipRatio + \"%\");\n      window.SB.stat(\"bio-st-speed\", speed + \"x\");\n\n      document.getElementById(\"bio-dqn-readout\").innerHTML =\n        \"Align Score: <strong>\" + score + \"</strong> · Total Steps: <strong>\" + totalSteps + \"</strong> \" +\n        \"(Exact-Skip: <strong style='color:var(--ok)'>\" + skipSteps + \"</strong>, Dueling-DDQN: <strong style='color:var(--accent-2)'>\" + dqnCalls + \"</strong>) · \" +\n        \"Window Memory: <strong>\" + (W * W) + \" cells</strong> vs NW Grid: <strong>\" + nwCells + \" cells</strong>\";\n\n      dqnState = { N: N, W: W, path: path, nwCells: nwCells, dqnCalls: dqnCalls, skipRatio: skipRatio, speed: speed };\n      if (dqnChart) dqnChart.redraw();\n    }\n\n    [rngN, rngMut, rngW].forEach(function (el) {\n      if (el) el.addEventListener(\"input\", runDqnSim);\n    });\n    document.querySelectorAll(\"#bio-skip-btns button\").forEach(function (b) {\n      b.addEventListener(\"click\", function () {\n        document.querySelectorAll(\"#bio-skip-btns button\").forEach(function (x) { x.classList.remove(\"on\"); });\n        b.classList.add(\"on\");\n        useSkip = b.getAttribute(\"data-skip\") === \"1\";\n        runDqnSim();\n      });\n    });\n    var btnRegen = document.getElementById(\"bio-btn-regen\");\n    if (btnRegen) {\n      btnRegen.addEventListener(\"click\", function () {\n        seedOffset = (seedOffset + 7) % 97;\n        runDqnSim();\n      });\n    }\n    runDqnSim();\n\n    // 3. Sim 03: REminerII & PixelRE Dot-Plot Simulator\n    var remW = document.getElementById(\"rem-rng-w\");\n    var remX = document.getElementById(\"rem-rng-x\");\n    var remNoise = document.getElementById(\"rem-rng-noise\");\n    var remStrand = \"BOTH\";\n    var remState = { w: 12, xDrop: 30, noise: 12, fpDots: 30, fwdSegs: [], rcSegs: [] };\n\n    var remChart = window.SB && window.SB.canvas(\"bio-rem-canvas\", 315, function (ctx, CW, CH, P) {\n      var ox = 32, oy = 22, sz = Math.min(CW - 225, CH - 44);\n      var scale = sz / 276;\n\n      ctx.fillStyle = P.surface;\n      ctx.fillRect(ox, oy, sz, sz);\n      ctx.strokeStyle = P.border;\n      ctx.lineWidth = 1;\n      ctx.strokeRect(ox, oy, sz, sz);\n\n      ctx.fillStyle = P.faint;\n      for (var i = 0; i < remState.fpDots; i++) {\n        var nx = ox + (((i * 73 + remState.w * 19 + remState.noise * 31) % 268) + 4) * scale;\n        var ny = oy + (((i * 127 + remState.xDrop * 23 + remState.noise * 17) % 268) + 4) * scale;\n        ctx.fillRect(nx, ny, 2.5, 2.5);\n      }\n\n      if (remStrand !== \"RC\") {\n        remState.fwdSegs.forEach(function (s, idx) {\n          ctx.strokeStyle = idx === 0 ? P.ok : P.accent;\n          ctx.lineWidth = 3;\n          ctx.beginPath();\n          ctx.moveTo(ox + s.x0 * scale, oy + s.y0 * scale);\n          ctx.lineTo(ox + Math.min(270, s.x0 + s.len) * scale, oy + Math.min(270, s.y0 + s.len) * scale);\n          ctx.stroke();\n\n          ctx.strokeStyle = P.accent;\n          ctx.lineWidth = 1;\n          ctx.strokeRect(\n            ox + (s.x0 - 3) * scale,\n            oy + (s.y0 - 3) * scale,\n            Math.min(276 - s.x0, s.len + 6) * scale,\n            Math.min(276 - s.y0, s.len + 6) * scale\n          );\n        });\n      }\n\n      if (remStrand !== \"FWD\") {\n        remState.rcSegs.forEach(function (s) {\n          ctx.strokeStyle = P.bad;\n          ctx.lineWidth = 3;\n          ctx.beginPath();\n          ctx.moveTo(ox + s.x0 * scale, oy + s.y0 * scale);\n          ctx.lineTo(ox + Math.min(270, s.x0 + s.len) * scale, oy + Math.max(6, s.y0 - s.len) * scale);\n          ctx.stroke();\n        });\n      }\n\n      var rx = ox + sz + 20;\n      ctx.fillStyle = P.text;\n      ctx.font = \"600 12px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"2D GENOMIC DOT-PLOT\", rx, 44);\n\n      var rleg = [\n        { c: P.ok, t: \"Self-Diagonal (Homology)\" },\n        { c: P.accent, t: \"Forward Repeat (Alu/LINE)\" },\n        { c: P.bad, t: \"Reverse-Complement (RC)\" },\n        { c: P.faint, t: \"Filtered K-mer Noise\" }\n      ];\n      rleg.forEach(function (it, idx) {\n        var ly = 72 + idx * 26;\n        ctx.fillStyle = it.c;\n        ctx.fillRect(rx, ly - 8, 14, 10);\n        ctx.fillStyle = P.dim;\n        ctx.font = \"11.5px 'JetBrains Mono', monospace\";\n        ctx.fillText(it.t, rx + 20, ly);\n      });\n\n      ctx.fillStyle = P.accent2;\n      ctx.font = \"600 11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"SEED-AND-EXTEND PARAMS\", rx, 198);\n      ctx.fillStyle = P.dim;\n      ctx.font = \"11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"WORD_SIZE   : \" + remState.w + \" bp\", rx, 220);\n      ctx.fillText(\"GREEDY_X    : \" + remState.xDrop, rx, 238);\n      ctx.fillText(\"MIN_SEED_LEN: 28 bp\", rx, 256);\n      ctx.fillText(\"SPACE_SIZE  : 2 bp\", rx, 274);\n    });\n\n    function runRemSim() {\n      var w = parseInt(remW.value, 10);\n      var xDrop = parseInt(remX.value, 10);\n      var noise = parseInt(remNoise.value, 10);\n      document.getElementById(\"rem-lbl-w\").textContent = w + \" bp\";\n      document.getElementById(\"rem-lbl-x\").textContent = String(xDrop);\n      document.getElementById(\"rem-lbl-noise\").textContent = noise + \"%\";\n\n      var fwdSegs = [\n        { x0: 25, y0: 25, len: 95 },\n        { x0: 45, y0: 140, len: 70 + Math.floor(xDrop * 0.4) },\n        { x0: 150, y0: 55, len: 65 + Math.floor(xDrop * 0.35) }\n      ];\n      var rcSegs = [\n        { x0: 60, y0: 230, len: 68 + Math.floor(xDrop * 0.3) },\n        { x0: 175, y0: 245, len: 58 + Math.floor(xDrop * 0.25) }\n      ];\n\n      var fpDots = Math.max(2, Math.round((noise * 18) / Math.max(1, w - 5)));\n      var seedHits = (remStrand !== \"RC\" ? fwdSegs.length * 4 : 0) + (remStrand !== \"FWD\" ? rcSegs.length * 3 : 0);\n\n      window.SB.stat(\"rem-st-seeds\", seedHits + \" seeds\");\n      window.SB.stat(\"rem-st-fwd\", (remStrand !== \"RC\" ? fwdSegs.length : 0) + \" families\");\n      window.SB.stat(\"rem-st-rc\", (remStrand !== \"FWD\" ? rcSegs.length : 0) + \" inversions\");\n      window.SB.stat(\"rem-st-fp\", fpDots + \" dots\");\n\n      document.getElementById(\"rem-readout\").innerHTML =\n        \"REminerII Filter: <code>WORD_SIZE=\" + w + \"</code>, <code>GREEDY_X=\" + xDrop + \"</code>, <code>MIN_SEED_LEN=28</code> · \" +\n        \"더 큰 시드 길이 <code>w</code>는 배경 위양성 노이즈(<strong>\" + fpDots + \"개</strong>)를 지수적으로 억제합니다.\";\n\n      remState = { w: w, xDrop: xDrop, noise: noise, fpDots: fpDots, fwdSegs: fwdSegs, rcSegs: rcSegs };\n      if (remChart) remChart.redraw();\n    }\n\n    [remW, remX, remNoise].forEach(function (el) {\n      if (el) el.addEventListener(\"input\", runRemSim);\n    });\n    document.querySelectorAll(\"#rem-strand-btns button\").forEach(function (b) {\n      b.addEventListener(\"click\", function () {\n        document.querySelectorAll(\"#rem-strand-btns button\").forEach(function (x) { x.classList.remove(\"on\"); });\n        b.classList.add(\"on\");\n        remStrand = b.getAttribute(\"data-s\") || \"BOTH\";\n        runRemSim();\n      });\n    });\n    runRemSim();\n  });\n  <\/script>\n\n</main>\n</body>\n</html>\n", "wpt": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch.03 3D 공진 무선전력전송 · 에지 비전 안전 제어 &amp; OLEV 텔레매틱스 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"Ch.03 3D 공진 무선전력전송 · 에지 비전 안전 제어 &amp; OLEV 텔레매틱스 — KAIST Grad Works &amp; GoogleDrive Master Workspace Interactive Guidebook\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-chapter=\"wpt\" data-root=\"../\">\n<main class=\"chapter\">\n  <header class=\"chapter-hero\">\n    <div class=\"eyebrow\">CHAPTER 03 · THEME 1 — 3D RESONANT WPT &amp; OLEV TELEMATICS</div>\n    <h1>3D 공진 무선전력전송 · 에지 비전 안전 제어 &amp; OLEV 텔레매틱스</h1>\n    <p class=\"lead\">\n      자유 공간 내 이동하는 전자기기에 1kW급 전력을 고효율·안전하게 무선 공급하려면, 수신 코일의 3차원 위치 $(X, Y, Z)$를 밀리미터 단위로 추적하는 동시에\n      강한 자기장 영역으로 진입하는 인체나 반려동물을 즉시 감지하여 송신 출력을 차단해야 합니다.\n      본 장에서는 미국 등록특허 <strong>US 12,496,917 B2</strong> 및 국내 특허 <strong>KR 10-2021-0092933 A</strong>로 결실을 맺은\n      <strong>Tsai 양안 3D 비전 삼각측량 · FLIR 열화상 · Coral EdgeTPU</strong> 제어 루프(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L4\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:4\">TsaiCalibration.py:4</a>, <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/FIR\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/FIR\">FIR</a>, <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/edgetpu_models\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/edgetpu_models\">edgetpu_models</a>)와\n      85kHz 주행중 무선충전 전기버스(OLEV)의 <strong>UTM 궤적 예측 텔레매틱스</strong>(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m#L1\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m:1\">get_lane_distance.m:1</a>, <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m#L1\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m:1\">get_predicted_time.m:1</a>)를 해부합니다.\n    </p>\n    <ul class=\"objectives\">\n      <li><strong>Tsai 11-DoF 핀홀 카메라 캘리브레이션</strong>(<code>Find_K_Matrix</code>)과 <strong>양안 꼬인 광선 최단중점 삼각측량</strong>(<code>Est_Point</code>) 수식을 유도한다.</li>\n      <li><strong>FLIR Lepton 열화상 + Coral EdgeTPU</strong> 멀티모달 에지 비전 안전 차단 루프(US 12,496,917 B2)를 3D 시뮬레이터(Sim 04)로 실험한다.</li>\n      <li>85kHz OLEV 전기버스의 <strong>사분위 25% 절사 차선 편차 필터</strong>와 <strong>0.9x 보수적 속도 마진 인버터 예열 제어</strong>(Sim 05)를 검증한다.</li>\n    </ul>\n  </header>\n\n  <section id=\"sec-wpt-arch\">\n    <h2>멀티모달 비전 기반 3D 무선전력전송 &amp; OLEV 통합 아키텍처</h2>\n    <p>\n      Theme 1(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/README.md\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/README.md\">Theme 1 README.md</a>)은 크게 실내외 3차원 자유 공간 무선충전을 위한 <code>3D_Positioning_and_Vision</code>(3개 서브모듈)과\n      도로 매설형 세그먼트 급전 인버터를 사전 제어하는 <code>Telematics_and_GPS</code>(5개 서브모듈)로 구성됩니다.\n      아래 다이어그램의 각 스테이지를 클릭하면 상세 입출력 수식과 구현 파일이 표시됩니다.\n    </p>\n\n    <figure class=\"diagram\">\n      <svg id=\"wpt-svg\" viewBox=\"0 0 1080 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Theme 1 3D WPT Vision and OLEV Telematics Pipeline\">\n        <defs>\n          <marker id=\"wpt-arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M 0 1 L 9 5 L 0 9 z\" fill=\"var(--ok)\" />\n          </marker>\n        </defs>\n        <rect x=\"4\" y=\"4\" width=\"1072\" height=\"312\" rx=\"12\" class=\"f-surface\" />\n        <text x=\"24\" y=\"28\" class=\"t-ok\">CLICKABLE PIPELINE · THEME 1 3D RESONANT WPT VISION CONTROL &amp; 85kHz OLEV TELEMATICS (8 SUBMODULES)</text>\n\n        <!-- Node 1: Tsai DLT Calibration -->\n        <g class=\"svg-node\" data-node=\"wpt-calib\">\n          <rect x=\"24\" y=\"48\" width=\"240\" height=\"184\" rx=\"9\" class=\"f-ok-soft\" />\n          <text x=\"38\" y=\"74\" class=\"t-ok\">STAGE 1 · TSAI CALIBRATION</text>\n          <text x=\"38\" y=\"98\" class=\"t\" font-weight=\"700\">Find_K_Matrix (11-DoF DLT)</text>\n          <text x=\"38\" y=\"120\" class=\"t-dim\">3D World (X,Y,Z) &lt;-&gt; 2D (u,v)</text>\n          <text x=\"38\" y=\"140\" class=\"t-dim\">k = (A^T A)^(-1) A^T b</text>\n          <text x=\"38\" y=\"160\" class=\"t-dim\">3x4 Projection Matrix K1, K2</text>\n          <text x=\"38\" y=\"180\" class=\"t-dim\">Dual Camera Extrinsic Lock</text>\n          <text x=\"38\" y=\"212\" class=\"t-mono\">TsaiCalibration.py:Find_K_Matrix</text>\n        </g>\n\n        <!-- Node 2: Skew-Ray 3D Triangulation -->\n        <g class=\"svg-node is-selected\" data-node=\"wpt-ray\">\n          <rect x=\"290\" y=\"48\" width=\"244\" height=\"184\" rx=\"9\" class=\"f-acc-soft\" />\n          <text x=\"304\" y=\"74\" class=\"t-acc\">STAGE 2 · 3D RAY MIDPOINT</text>\n          <text x=\"304\" y=\"98\" class=\"t\" font-weight=\"700\">Line_gen &amp; Est_Point</text>\n          <text x=\"304\" y=\"120\" class=\"t-dim\">Plane Cross Product v = n_u x n_v</text>\n          <text x=\"304\" y=\"140\" class=\"t-dim\">Skew Rays L1(t1), L2(t2)</text>\n          <text x=\"304\" y=\"160\" class=\"t-dim\">Closest Midpoint P* = (X,Y,Z)</text>\n          <text x=\"304\" y=\"180\" class=\"t-dim\">ImgTo3D Real-Time Tracking</text>\n          <text x=\"304\" y=\"212\" class=\"t-mono\">TsaiCalibration.py:Est_Point</text>\n        </g>\n\n        <!-- Node 3: FLIR Thermal & Coral EdgeTPU -->\n        <g class=\"svg-node\" data-node=\"wpt-safety\">\n          <rect x=\"560\" y=\"48\" width=\"244\" height=\"184\" rx=\"9\" class=\"f-warn-soft\" />\n          <text x=\"574\" y=\"74\" class=\"t-warn\">STAGE 3 · SAFETY INTERLOCK</text>\n          <text x=\"574\" y=\"98\" class=\"t\" font-weight=\"700\">FIR Thermal &amp; Coral EdgeTPU</text>\n          <text x=\"574\" y=\"120\" class=\"t-dim\">FLIR Lepton 8-14um Human Detect</text>\n          <text x=\"574\" y=\"140\" class=\"t-dim\">INT8 Quantized MobileNet SSD</text>\n          <text x=\"574\" y=\"160\" class=\"t-dim\">ICNIRP EMF Exposure Cutoff</text>\n          <text x=\"574\" y=\"180\" class=\"t-dim\">US 12,496,917 B2 Granted</text>\n          <text x=\"574\" y=\"212\" class=\"t-mono\">FIR · edgetpu_models</text>\n        </g>\n\n        <!-- Node 4: OLEV 85kHz Telematics -->\n        <g class=\"svg-node\" data-node=\"wpt-olev\">\n          <rect x=\"830\" y=\"48\" width=\"226\" height=\"184\" rx=\"9\" class=\"f-acc2-soft\" />\n          <text x=\"844\" y=\"74\" class=\"t-acc2\">STAGE 4 · OLEV TELEMATICS</text>\n          <text x=\"844\" y=\"98\" class=\"t\" font-weight=\"700\">85kHz Dynamic EV Charging</text>\n          <text x=\"844\" y=\"120\" class=\"t-dim\">WGS84 -&gt; UTM Meter Projection</text>\n          <text x=\"844\" y=\"140\" class=\"t-dim\">25% Trimmed Lane Deviation</text>\n          <text x=\"844\" y=\"160\" class=\"t-dim\">0.9x Velocity Margin ETA</text>\n          <text x=\"844\" y=\"180\" class=\"t-dim\">Android InverterGPS Trigger</text>\n          <text x=\"844\" y=\"212\" class=\"t-mono\">get_lane_distance.m · EVGPS</text>\n        </g>\n\n        <line x1=\"264\" y1=\"140\" x2=\"287\" y2=\"140\" class=\"s-ok\" stroke-width=\"2\" marker-end=\"url(#wpt-arr)\" />\n        <line x1=\"534\" y1=\"140\" x2=\"557\" y2=\"140\" class=\"s-ok\" stroke-width=\"2\" marker-end=\"url(#wpt-arr)\" />\n        <line x1=\"804\" y1=\"140\" x2=\"827\" y2=\"140\" class=\"s-ok\" stroke-width=\"2\" marker-end=\"url(#wpt-arr)\" />\n\n        <!-- Bottom Patent Strip -->\n        <rect x=\"24\" y=\"248\" width=\"1032\" height=\"48\" rx=\"8\" class=\"f-elev\" />\n        <text x=\"40\" y=\"277\" class=\"t-ok\">PATENT PORTFOLIO:</text>\n        <text x=\"195\" y=\"277\" class=\"t\" font-weight=\"600\">US 12,496,917 B2 · KR 10-2021-0092933 A (Vision WPT) · KR 10-2189983 B1 (SWIPT) · KR 10-1988844 B1 · KR 10-1812028 B1</text>\n      </svg>\n      <div class=\"inspector-box\" id=\"wpt-insp\">\n        <div class=\"insp-title\" id=\"wpt-insp-title\">📌 STAGE 2 · Skew-Ray Closest Midpoint 3D Triangulation (Line_gen &amp; Est_Point)</div>\n        <div id=\"wpt-insp-body\">두 대의 RGB 카메라에서 역투영된 3차원 꼬인 직선(Skew Rays) 사이의 최단거리 중점을 계산해 수신 코일의 3D 좌표를 실시간 복원합니다. 파이프라인 스테이지를 클릭해 상세 기하학 수식과 하드웨어 사양을 확인하세요.</div>\n      </div>\n      <figcaption><b>그림 3-1.</b> Theme 1 3D 자기공진 무선전력전송 비전 제어(Tsai · Skew-Ray · FLIR/EdgeTPU) 및 85kHz OLEV 텔레매틱스 파이프라인.</figcaption>\n    </figure>\n  </section>\n\n  <section id=\"sec-tsai\">\n    <h2>Tsai 카메라 캘리브레이션 및 양안 3D 광선 삼각측량 수학적 유도</h2>\n    <p>\n      <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L4\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:4\">TsaiCalibration.py:4</a>는 외부 라이브러리 블랙박스에 의존하지 않고, 3D 월드 좌표 $\\mathbf{X}_i = [X_i, Y_i, Z_i]^T$와 2D 이미지 픽셀 좌표 $\\mathbf{u}_i = [u_i, v_i]^T$의 대응점들로부터\n      카메라 투영 행렬을 직접 추정하고 3차원 좌표를 역산하는 4단계 파이프라인을 구현합니다.\n    </p>\n\n    <h3 id=\"sec-tsai-step1\">Step 1 · 11-DoF 선형 최소자승 투영 행렬 추정 (<code>Find_K_Matrix</code>)</h3>\n    <p>\n      동차 좌표계(Homogeneous Coordinates)에서 $3 \\times 4$ 핀홀 카메라 투영 행렬 $K$($K_{3,4} = 1$로 스케일 정규화)는 다음 관계를 만족합니다:\n    </p>\n    $$s \\begin{bmatrix} u \\\\ v \\\\ 1 \\end{bmatrix} = \\begin{bmatrix} k_{11} & k_{12} & k_{13} & k_{14} \\\\ k_{21} & k_{22} & k_{23} & k_{24} \\\\ k_{31} & k_{32} & k_{33} & 1 \\end{bmatrix} \\begin{bmatrix} X \\\\ Y \\\\ Z \\\\ 1 \\end{bmatrix}$$\n    <p>\n      스케일 인자 $s = k_{31}X + k_{32}Y + k_{33}Z + 1$을 소거하면 각 3D-2D 대응점마다 2개의 선형 방정식이 유도되며,\n      $N$개의 기준점에 대해 $2N \\times 11$ 행렬 $\\mathbf{A}$와 $2N \\times 1$ 벡터 $\\mathbf{b}$를 구성할 수 있습니다(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L4\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:4\">TsaiCalibration.py:4</a>).\n      정규방정식(Normal Equation)을 통한 최소자승 해는 다음과 같습니다:\n    </p>\n    $$\\mathbf{k}^* = \\left(\\mathbf{A}^T \\mathbf{A}\\right)^{-1} \\mathbf{A}^T \\mathbf{b} \\in \\mathbb{R}^{11}$$\n\n    <h3 id=\"sec-tsai-step2\">Step 2 · 2D 픽셀의 3D 광선 역투영 (<code>Line_gen</code>) 및 최단 중점 삼각측량 (<code>Est_Point</code>)</h3>\n    <p>\n      캘리브레이션된 카메라 행렬 $K$에서 픽셀 $(u, v)$가 주어지면, 위 투영식의 첫 번째 행과 두 번째 행은 각각 3차원 공간 상의 두 평면 $\\Pi_u, \\Pi_v$를 정의합니다.\n      <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L41\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:41\">TsaiCalibration.py:41</a>의 <code>Line_gen(K, u, v)</code>는 두 평면의 법선 벡터 $\\mathbf{n}_u, \\mathbf{n}_v \\in \\mathbb{R}^3$의 외적(Cross Product)으로\n      3차원 광선의 방향 벡터 $\\mathbf{v} = \\mathbf{n}_u \\times \\mathbf{n}_v$와 기준점 $\\mathbf{p}_0$를 구합니다:\n    </p>\n    $$\\mathbf{L}_1(t_1) = \\mathbf{p}_1 + t_1 \\mathbf{v}_1, \\qquad \\mathbf{L}_2(t_2) = \\mathbf{p}_2 + t_2 \\mathbf{v}_2$$\n    <p>\n      실제 환경에서는 렌즈 왜곡과 양자화 노이즈로 인해 두 카메라의 광선 $\\mathbf{L}_1(t_1)$과 $\\mathbf{L}_2(t_2)$가 3차원 공간에서 정확히 한 점에서 만나지 않는\n      <strong>꼬인 직선(Skew Lines)</strong>이 됩니다. <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L58\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:58\">TsaiCalibration.py:58</a>의 <code>Est_Point(Line1, Line2)</code>는 두 직선 사이의 유클리드 거리 제곱\n      $\\|\\mathbf{L}_1(t_1) - \\mathbf{L}_2(t_2)\\|_2^2$을 최소화하는 직교 조건($(\\mathbf{L}_1 - \\mathbf{L}_2) \\perp \\mathbf{v}_1$, $(\\mathbf{L}_1 - \\mathbf{L}_2) \\perp \\mathbf{v}_2$)으로부터\n      $2 \\times 2$ 연립방정식을 풀어 최적 매개변수 $(t_1^*, t_2^*)$를 구하고, 두 최단점의 <strong>중점(Midpoint)</strong>으로 수신 코일의 3D 위치 $\\mathbf{P}^*$를 결정합니다(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py#L72\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/3D_Positioning_and_Vision/ObjectDetection/TsaiCalibration.py:72\">TsaiCalibration.py:72</a>):\n    </p>\n    $$\\begin{bmatrix} \\mathbf{v}_1 \\cdot \\mathbf{v}_1 & -\\mathbf{v}_1 \\cdot \\mathbf{v}_2 \\\\ \\mathbf{v}_1 \\cdot \\mathbf{v}_2 & -\\mathbf{v}_2 \\cdot \\mathbf{v}_2 \\end{bmatrix} \\begin{bmatrix} t_1^* \\\\ t_2^* \\end{bmatrix} = \\begin{bmatrix} -(\\mathbf{p}_1 - \\mathbf{p}_2) \\cdot \\mathbf{v}_1 \\\\ -(\\mathbf{p}_1 - \\mathbf{p}_2) \\cdot \\mathbf{v}_2 \\end{bmatrix}, \\qquad \\mathbf{P}^* = \\frac{\\mathbf{L}_1(t_1^*) + \\mathbf{L}_2(t_2^*)}{2}$$\n  </section>\n\n  <section id=\"sec-sim-wpt-3d\">\n    <h2>인터랙티브 3D 시뮬레이터 · 양안 삼각측량 &amp; FLIR 열화상 안전 제어</h2>\n    <p>\n      아래 3D 시뮬레이터는 수신 코일의 공간 위치 $(X, Y, Z)$, 카메라 픽셀 검출 노이즈 $\\sigma_{uv}$, 그리고 인체 열원($36.5^\\circ\\text{C}$)의 접근 거리를 조작하며\n      <strong>양안 광선 교차 중점 $\\mathbf{P}^*$ 복원 오차</strong>와 <strong>공진 전력전송 효율 $\\eta$ 및 안전 차단(Interlock)</strong>을 실시간 시뮬레이션합니다.\n    </p>\n\n    <section class=\"sim\" id=\"sim-wpt-3d\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 04 · THREE.JS + TSAI 3D SOLVER</span>\n        <h3>3D Stereo Skew-Ray Triangulation &amp; FLIR Thermal Safety Interlock</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\" id=\"wpt3d-box\"></div>\n        <div class=\"sim-controls\">\n          <label class=\"ctrl\">\n            <span>수신 코일 수평 오프셋 $X_{\\text{rx}}$ <output id=\"wpt-lbl-x\">0.20 m</output></span>\n            <input type=\"range\" id=\"wpt-rng-x\" min=\"-1.5\" max=\"1.5\" step=\"0.05\" value=\"0.20\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>수신 코일 전송 높이 $Y_{\\text{rx}}$ (Air Gap) <output id=\"wpt-lbl-y\">0.85 m</output></span>\n            <input type=\"range\" id=\"wpt-rng-y\" min=\"0.35\" max=\"1.80\" step=\"0.05\" value=\"0.85\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>픽셀 검출 노이즈 $\\sigma_{uv}$ (Skew Ray Gap) <output id=\"wpt-lbl-noise\">1.5 px</output></span>\n            <input type=\"range\" id=\"wpt-rng-noise\" min=\"0.0\" max=\"8.0\" step=\"0.5\" value=\"1.5\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>FLIR 열화상 인체 접근 거리 $d_{\\text{human}}$ <output id=\"wpt-lbl-hum\">1.60 m</output></span>\n            <input type=\"range\" id=\"wpt-rng-hum\" min=\"0.30\" max=\"2.20\" step=\"0.05\" value=\"1.60\" />\n          </label>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">3D 위치 복원 오차</span><span class=\"v\" id=\"wpt-st-err\">1.8 mm</span></div>\n        <div class=\"stat\"><span class=\"k\">자기 결합 계수 $k$</span><span class=\"v\" id=\"wpt-st-k\">0.185</span></div>\n        <div class=\"stat\"><span class=\"k\">전력 전송 효율 $\\eta$</span><span class=\"v\" id=\"wpt-st-eff\">86.4%</span></div>\n        <div class=\"stat\"><span class=\"k\">송신 출력 / 안전 상태</span><span class=\"v\" id=\"wpt-st-pwr\">864 W (ACTIVE)</span></div>\n      </div>\n      <div class=\"sim-note\" id=\"wpt-readout\"></div>\n    </section>\n  </section>\n\n  <section id=\"sec-olev\">\n    <h2>OLEV 85kHz 주행중 무선충전 텔레매틱스 및 UTM 궤적 예측</h2>\n    <p>\n      도로 아래 매설된 급전 세그먼트 코일(85kHz, 100kW급)을 상시 켜두면 막대한 대기 전력 손실과 전자기장 노출이 발생하므로,\n      전기버스(OLEV)가 해당 세그먼트에 진입하기 직전에만 인버터를 예열·기동(Pre-Turn-On)해야 합니다.\n      Theme 1의 <code>Telematics_and_GPS</code>는 안드로이드 단말 4종(<code>EVGPS</code>, <code>GPSlog</code>, <code>GPStracker</code>, <code>InverterGPS</code>)과\n      MATLAB 궤적 해석 엔진(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m#L1\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m:1\">get_lane_distance.m:1</a>, <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m#L1\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m:1\">get_predicted_time.m:1</a>)으로 이를 해결합니다.\n    </p>\n\n    <h3 id=\"sec-olev-math\">점-직선 직교 차선 편차 및 사분위 25% 절사 평균 (<code>get_lane_distance.m</code>)</h3>\n    <p>\n      WGS84 위경도 좌표를 <code>deg2utm.m</code>으로 미터(m) 단위의 평면 직교 좌표 $\\mathbf{p}_i = (x_i, y_i)$로 투영한 뒤,\n      도로 중심 기준선 세그먼트 $(\\mathbf{q}_1, \\mathbf{q}_2)$로부터 차량의 횡방향 수직 이탈 거리(Orthogonal Lateral Distance)를 외적으로 계산합니다(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m#L10\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m:10\">get_lane_distance.m:10</a>):\n    </p>\n    $$d_{\\perp, i} = \\frac{\\left|(x_{q_2} - x_{q_1})(y_{q_1} - y_i) - (x_{q_1} - x_i)(y_{q_2} - y_{q_1})\\right|}{\\sqrt{(x_{q_2} - x_{q_1})^2 + (y_{q_2} - y_{q_1})^2}}$$\n    <p>\n      도심 빌딩 숲의 GPS 멀티패스(Multipath) 반사로 인해 간헐적으로 수 미터의 튀는 값(Outlier)이 유입되므로,\n      <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m#L16\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_lane_distance.m:16\">get_lane_distance.m:16</a>은 수집된 거리 배열을 오름차순 정렬한 뒤 <strong>하위 25%와 상위 25%를 모두 제거(Interquartile 25% Trimmed Mean)</strong>하고 중앙 50% 샘플만 평균을 취합니다.\n    </p>\n\n    <h3 id=\"sec-olev-eta\">보수적 10% 감속 마진 기반 인버터 예열 시간 예측 (<code>get_predicted_time.m</code>)</h3>\n    <p>\n      인버터가 차량 진입보다 늦게 켜지면 충전 누락이 발생하므로, <a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m#L4\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m:4\">get_predicted_time.m:4</a>의 4행(<code>% reduce 10 %</code>) 및 26행(<a class=\"src\" href=\"../../1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m#L26\" target=\"_blank\" rel=\"noopener\" title=\"1_Wireless_Power_Transfer_and_EV/Telematics_and_GPS/GPS/get_predicted_time.m:26\">get_predicted_time.m:26</a>)은\n      구간 평균 주행 속도 $\\bar{v}_k$에 <strong>$0.9$배 보수적 안전 계수</strong>를 적용하거나 가속 추세를 반영하여 세그먼트 도달 잔여 시간 $\\widehat{\\text{ETA}}$를 산출합니다:\n    </p>\n    $$\\widehat{d}_{\\text{step}, k} = 0.9 \\cdot \\Delta d_k, \\qquad \\widehat{\\text{ETA}}_k = \\frac{d_{\\text{rem}, k}}{\\bar{v}_k}, \\qquad \\text{Inverter State} = \\begin{cases} \\text{ON (Active)} & \\text{if } d_{\\text{rem}} \\le 0 \\\\ \\text{PRE-HEAT} & \\text{if } 0 \\lt \\widehat{\\text{ETA}}_k \\le \\tau_{\\text{warm}} \\\\ \\text{STANDBY} & \\text{otherwise} \\end{cases}$$\n  </section>\n\n  <section id=\"sec-sim-olev\">\n    <h2>인터랙티브 시뮬레이터 · OLEV 차선 편차 필터링 &amp; 인버터 예열 제어</h2>\n    <p>\n      아래 시뮬레이터는 GPS 멀티패스 노이즈 크기와 사분위 25% 절사 필터 활성화 여부, 그리고 전기버스 주행 속도에 따라\n      <strong>차선 직교 이탈 거리 추정 정밀도</strong>와 <strong>세그먼트 인버터 사전 기동(Pre-Heat) 타이밍</strong>을 실시간 시뮬레이션합니다.\n    </p>\n\n    <section class=\"sim\" id=\"sim-olev-gps\">\n      <div class=\"sim-head\">\n        <span class=\"sim-tag\">SIMULATOR 05 · MATLAB GPS KINEMATICS</span>\n        <h3>OLEV 85kHz UTM Lane Deviation &amp; Inverter Pre-Activation Telematics</h3>\n      </div>\n      <div class=\"sim-body side\">\n        <div class=\"sim-view\">\n          <canvas id=\"olev-canvas\"></canvas>\n        </div>\n        <div class=\"sim-controls\">\n          <label class=\"ctrl\">\n            <span>전기버스 주행 위치 (진행률) <output id=\"olev-lbl-pos\">58%</output></span>\n            <input type=\"range\" id=\"olev-rng-pos\" min=\"5\" max=\"95\" step=\"1\" value=\"58\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>평균 주행 속도 $\\bar{v}$ <output id=\"olev-lbl-vel\">42 km/h</output></span>\n            <input type=\"range\" id=\"olev-rng-vel\" min=\"15\" max=\"80\" step=\"1\" value=\"42\" />\n          </label>\n          <label class=\"ctrl\">\n            <span>GPS 멀티패스 스파이크 노이즈 <output id=\"olev-lbl-mp\">2.2 m</output></span>\n            <input type=\"range\" id=\"olev-rng-mp\" min=\"0.2\" max=\"5.0\" step=\"0.2\" value=\"2.2\" />\n          </label>\n          <div class=\"ctrl\">\n            <span>사분위 절사 필터 (<code>get_lane_distance.m</code>)</span>\n            <div class=\"seg\" id=\"olev-trim-btns\">\n              <button type=\"button\" class=\"on\" data-trim=\"1\">ON (25%~75% Trimmed)</button>\n              <button type=\"button\" data-trim=\"0\">OFF (Raw Mean)</button>\n            </div>\n          </div>\n        </div>\n      </div>\n      <div class=\"sim-readout\">\n        <div class=\"stat\"><span class=\"k\">추정 차선 편차 $d_\\perp$</span><span class=\"v\" id=\"olev-st-dev\">0.26 m</span></div>\n        <div class=\"stat\"><span class=\"k\">Outlier 억제율</span><span class=\"v\" id=\"olev-st-sup\">74.8%</span></div>\n        <div class=\"stat\"><span class=\"k\">급전 세그먼트 ETA</span><span class=\"v\" id=\"olev-st-eta\">1.33 s</span></div>\n        <div class=\"stat\"><span class=\"k\">85kHz 인버터 상태</span><span class=\"v\" id=\"olev-st-inv\">PRE-HEAT READY</span></div>\n      </div>\n      <div class=\"sim-note\" id=\"olev-readout\"></div>\n    </section>\n  </section>\n\n  <section class=\"keypoints\" id=\"summary\">\n    <h2>핵심 정리 · Chapter 03</h2>\n    <ol>\n      <li><strong>Tsai 양안 3D 비전 &amp; 열화상 안전 제어</strong>: 11-DoF 투영 행렬과 꼬인 광선 최단중점 삼각측량으로 수신 코일의 3D 좌표를 복원하고, FLIR Lepton + Coral EdgeTPU로 인체 접근 시 송신 출력을 즉시 차단합니다 (US 12,496,917 B2).</li>\n      <li><strong>85kHz OLEV UTM 텔레매틱스</strong>: 상하위 25% 사분위 절사 평균으로 도심 GPS 멀티패스 스파이크를 억제하고, 0.9x 보수적 속도 마진으로 도로 매설 급전 인버터를 적시에 사전 예열합니다.</li>\n    </ol>\n  </section>\n\n  <script>\n  document.addEventListener(\"DOMContentLoaded\", function () {\n    var WPT_INFO = {\n      \"wpt-calib\": {\n        title: \"STAGE 1 · Tsai 11-DoF Pinhole Calibration (Find_K_Matrix)\",\n        body: \"TsaiCalibration.py의 Find_K_Matrix()는 3D 월드 기준점과 2D 이미지 좌표 쌍으로부터 최소자승 의사역행렬 (A^T A)^(-1) A^T b를 풀어 3x4 투영 행렬 K를 복원합니다.\"\n      },\n      \"wpt-ray\": {\n        title: \"STAGE 2 · Skew-Ray Closest Midpoint 3D Triangulation (Line_gen & Est_Point)\",\n        body: \"Line_gen()으로 두 카메라 픽셀의 3D 광선 방향 벡터를 외적으로 구하고, Est_Point()에서 두 꼬인 직선 간 수직 조건 연립방정식을 풀어 최단 중점 P*=(X,Y,Z)를 계산합니다.\"\n      },\n      \"wpt-safety\": {\n        title: \"STAGE 3 · FLIR Lepton Thermal & Coral EdgeTPU Safety Interlock\",\n        body: \"FIR 서브모듈의 원적외선 열화상(8~14um)과 edgetpu_models의 INT8 MobileNet SSD가 고출력 자기장 영역 내 인체 진입을 감지하면 즉시 송신 전력을 안전 대기 모드로 감쇠합니다 (US 12,496,917 B2).\"\n      },\n      \"wpt-olev\": {\n        title: \"STAGE 4 · OLEV 85kHz Dynamic Charging Telematics (GPS & Android)\",\n        body: \"get_lane_distance.m의 상하위 25% 절사 평균으로 GPS 멀티패스 오차를 제거하고, get_predicted_time.m의 0.9x 보수적 속도 마진으로 도로 매설 급전 인버터를 버스 진입 전에 예열합니다.\"\n      }\n    };\n    var wptNodes = document.querySelectorAll(\"#wpt-svg .svg-node\");\n    wptNodes.forEach(function (n) {\n      n.addEventListener(\"click\", function () {\n        wptNodes.forEach(function (x) { x.classList.remove(\"is-selected\"); });\n        n.classList.add(\"is-selected\");\n        var info = WPT_INFO[n.getAttribute(\"data-node\")];\n        if (info) {\n          document.getElementById(\"wpt-insp-title\").textContent = \"📌 \" + info.title;\n          document.getElementById(\"wpt-insp-body\").textContent = info.body;\n        }\n      });\n    });\n\n    // 2. Sim 04: Three.js 3D Stereo Triangulation & Thermal Safety\n    var rxCoilMesh = null, humanMesh = null, estSphere = null, rayLine1 = null, rayLine2 = null, hazardRing = null;\n    var THREE_REF = null;\n\n    var wptX = document.getElementById(\"wpt-rng-x\");\n    var wptY = document.getElementById(\"wpt-rng-y\");\n    var wptNoise = document.getElementById(\"wpt-rng-noise\");\n    var wptHum = document.getElementById(\"wpt-rng-hum\");\n\n    function updateWptSim() {\n      var x = parseFloat(wptX.value);\n      var y = parseFloat(wptY.value);\n      var noisePx = parseFloat(wptNoise.value);\n      var dHum = parseFloat(wptHum.value);\n\n      document.getElementById(\"wpt-lbl-x\").textContent = x.toFixed(2) + \" m\";\n      document.getElementById(\"wpt-lbl-y\").textContent = y.toFixed(2) + \" m\";\n      document.getElementById(\"wpt-lbl-noise\").textContent = noisePx.toFixed(1) + \" px\";\n      document.getElementById(\"wpt-lbl-hum\").textContent = dHum.toFixed(2) + \" m\";\n\n      var dist3D = Math.sqrt(x * x + y * y);\n      var errMm = (0.6 + noisePx * (0.95 + 0.35 * dist3D)).toFixed(1);\n      var kCoupl = (0.42 / Math.pow(1 + dist3D * dist3D * 1.35, 1.25));\n      var Q1Q2 = 320 * 280;\n      var k2Q = kCoupl * kCoupl * Q1Q2;\n      var eta = Math.pow(k2Q / Math.pow(1 + Math.sqrt(1 + k2Q), 2), 1) * 100;\n      var safeCut = dHum <= 0.95;\n\n      window.SB.stat(\"wpt-st-err\", errMm + \" mm\");\n      window.SB.stat(\"wpt-st-k\", kCoupl.toFixed(3));\n      window.SB.stat(\"wpt-st-eff\", eta.toFixed(1) + \"%\");\n      window.SB.stat(\"wpt-st-pwr\", safeCut ? \"5 W (THERMAL CUTOFF)\" : Math.round(eta * 10) + \" W (ACTIVE)\");\n\n      document.getElementById(\"wpt-readout\").innerHTML =\n        \"Est_Point Midpoint P*: <code>(\" + x.toFixed(2) + \", \" + y.toFixed(2) + \", 0.00) m</code> · Skew Gap: <strong>\" + errMm + \" mm</strong> · \" +\n        (safeCut\n          ? \"<span style='color:var(--bad);font-weight:700;'>⚠️ FLIR Lepton 열화상 인체 감지 (d=\" + dHum.toFixed(2) + \"m ≤ 0.95m): ICNIRP 안전 인터록 작동 (출력 차단)</span>\"\n          : \"<span style='color:var(--ok);font-weight:600;'>✅ 안전 반경 확보 (d=\" + dHum.toFixed(2) + \"m): 다중 코일 자기장 포커싱 정상 송전 중</span>\");\n\n      if (THREE_REF && rxCoilMesh) {\n        var sceneY = -1.0 + y * 1.25;\n        rxCoilMesh.position.set(x, sceneY, 0);\n        var jitter = noisePx * 0.015;\n        estSphere.position.set(x + jitter, sceneY - jitter * 0.6, 0);\n        humanMesh.position.set(-dHum * 1.15, -0.5, 0.55);\n        hazardRing.material.color.setHex(safeCut ? 0xd64545 : 0x1f9d55);\n\n        rayLine1.geometry.setFromPoints([\n          new THREE_REF.Vector3(-2.4, 1.8, 1.6),\n          new THREE_REF.Vector3(x + jitter, sceneY + jitter, 0)\n        ]);\n        rayLine2.geometry.setFromPoints([\n          new THREE_REF.Vector3(2.4, 1.8, 1.6),\n          new THREE_REF.Vector3(x - jitter, sceneY - jitter, 0)\n        ]);\n      }\n    }\n\n    if (window.SB && window.SB.three) {\n      window.SB.three(\"wpt3d-box\", { height: 285, radius: 8.2, phi: 1.08, theta: 0.48 }, function (T3) {\n        var THREE = T3.THREE;\n        THREE_REF = THREE;\n        var scene = T3.scene;\n        var grid = new THREE.GridHelper(10, 10, 0x0a84c6, 0x8a93a8);\n        grid.position.y = -1.2;\n        scene.add(grid);\n\n        var txCoil = new THREE.Mesh(\n          new THREE.TorusGeometry(1.05, 0.09, 18, 56),\n          new THREE.MeshStandardMaterial({ color: 0x1f9d55, metalness: 0.4, roughness: 0.3 })\n        );\n        txCoil.rotation.x = Math.PI / 2;\n        txCoil.position.set(0, -1.0, 0);\n        scene.add(txCoil);\n\n        hazardRing = new THREE.Mesh(\n          new THREE.RingGeometry(0.95, 1.02, 48),\n          new THREE.MeshBasicMaterial({ color: 0x1f9d55, side: THREE.DoubleSide, transparent: true, opacity: 0.65 })\n        );\n        hazardRing.rotation.x = Math.PI / 2;\n        hazardRing.position.set(0, -1.15, 0);\n        scene.add(hazardRing);\n\n        rxCoilMesh = new THREE.Mesh(\n          new THREE.TorusGeometry(0.62, 0.07, 16, 48),\n          new THREE.MeshStandardMaterial({ color: 0x0a84c6, metalness: 0.4, roughness: 0.3 })\n        );\n        rxCoilMesh.rotation.x = Math.PI / 2;\n        scene.add(rxCoilMesh);\n\n        estSphere = new THREE.Mesh(\n          new THREE.SphereGeometry(0.11, 16, 16),\n          new THREE.MeshBasicMaterial({ color: 0xd98a00 })\n        );\n        scene.add(estSphere);\n\n        var camMat = new THREE.MeshStandardMaterial({ color: 0x7a4ce0 });\n        var cam1 = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.36), camMat);\n        cam1.position.set(-2.4, 1.8, 1.6);\n        scene.add(cam1);\n        var cam2 = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.36), camMat);\n        cam2.position.set(2.4, 1.8, 1.6);\n        scene.add(cam2);\n\n        var rMat1 = new THREE.LineBasicMaterial({ color: 0x0a84c6 });\n        var rGeo1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2.4, 1.8, 1.6), new THREE.Vector3(0, 0, 0)]);\n        rayLine1 = new THREE.Line(rGeo1, rMat1);\n        scene.add(rayLine1);\n\n        var rMat2 = new THREE.LineBasicMaterial({ color: 0x7a4ce0 });\n        var rGeo2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(2.4, 1.8, 1.6), new THREE.Vector3(0, 0, 0)]);\n        rayLine2 = new THREE.Line(rGeo2, rMat2);\n        scene.add(rayLine2);\n\n        humanMesh = new THREE.Mesh(\n          new THREE.CylinderGeometry(0.22, 0.22, 1.35, 20),\n          new THREE.MeshStandardMaterial({ color: 0xd64545, roughness: 0.35 })\n        );\n        scene.add(humanMesh);\n\n        T3.label(\"Cam 1 (K1)\", new THREE.Vector3(-2.4, 2.15, 1.6), \"#7a4ce0\");\n        T3.label(\"Cam 2 (K2)\", new THREE.Vector3(2.4, 2.15, 1.6), \"#7a4ce0\");\n        T3.label(\"TX Resonant Coil (1kW)\", new THREE.Vector3(0, -1.45, 0), \"#1f9d55\");\n        updateWptSim();\n      });\n    }\n\n    [wptX, wptY, wptNoise, wptHum].forEach(function (el) {\n      if (el) el.addEventListener(\"input\", updateWptSim);\n    });\n    updateWptSim();\n\n    // 3. Sim 05: OLEV 85kHz Lane Deviation & Inverter Pre-Activation\n    var olevPos = document.getElementById(\"olev-rng-pos\");\n    var olevVel = document.getElementById(\"olev-rng-vel\");\n    var olevMp = document.getElementById(\"olev-rng-mp\");\n    var useTrim = true;\n    var olevState = { posPct: 58, mpNoise: 2.2, invState: \"PRE-HEAT READY\", invKind: \"warn\" };\n\n    var olevChart = window.SB && window.SB.canvas(\"olev-canvas\", 285, function (ctx, CW, CH, P) {\n      var roadY = 156, roadH = 90;\n      ctx.fillStyle = P.surface;\n      ctx.fillRect(30, roadY - roadH / 2, CW - 60, roadH);\n      ctx.strokeStyle = P.border;\n      ctx.lineWidth = 1;\n      ctx.strokeRect(30, roadY - roadH / 2, CW - 60, roadH);\n\n      ctx.strokeStyle = P.accent;\n      ctx.setLineDash([8, 6]);\n      ctx.beginPath();\n      ctx.moveTo(30, roadY);\n      ctx.lineTo(CW - 30, roadY);\n      ctx.stroke();\n      ctx.setLineDash([]);\n\n      var trackW = CW - 80;\n      var railX = 40 + 0.65 * trackW;\n      var railW = 0.23 * trackW;\n      var invColor = olevState.invKind === \"ok\" ? P.ok : (olevState.invKind === \"warn\" ? P.warn : P.dim);\n      ctx.fillStyle = olevState.invKind === \"ok\" ? P.accSoft : P.surface;\n      ctx.fillRect(railX, roadY - 22, railW, 44);\n      ctx.strokeStyle = invColor;\n      ctx.lineWidth = 2;\n      ctx.strokeRect(railX, roadY - 22, railW, 44);\n      ctx.save();\n      ctx.fillStyle = invColor;\n      ctx.font = \"600 10.5px 'JetBrains Mono', monospace\";\n      ctx.textAlign = \"right\";\n      ctx.fillText(\"85kHz SEGMENT: \" + olevState.invState, CW - 32, roadY - 30);\n      ctx.restore();\n\n      for (var i = 0; i <= 28; i++) {\n        var px = 40 + (i / 28) * trackW;\n        var spike = (i % 5 === 0) ? (olevState.mpNoise * 13 * (i % 2 === 0 ? 1 : -1)) : (Math.sin(i * 1.3) * olevState.mpNoise * 4);\n        var pyRaw = roadY + spike;\n        ctx.fillStyle = P.bad;\n        ctx.beginPath();\n        ctx.arc(px, pyRaw, 3, 0, Math.PI * 2);\n        ctx.fill();\n      }\n\n      ctx.strokeStyle = useTrim ? P.ok : P.bad;\n      ctx.lineWidth = 2.4;\n      ctx.beginPath();\n      for (var j = 0; j <= 28; j++) {\n        var fx = 40 + (j / 28) * trackW;\n        var fy = roadY + (useTrim ? Math.sin(j * 0.7) * 3.5 : ((j % 5 === 0 ? olevState.mpNoise * 11 : 4) * (j % 2 === 0 ? 1 : -1)));\n        if (j === 0) ctx.moveTo(fx, fy);\n        else ctx.lineTo(fx, fy);\n      }\n      ctx.stroke();\n\n      var bx = 40 + (olevState.posPct / 100) * trackW;\n      ctx.fillStyle = P.accent;\n      ctx.fillRect(bx - 22, roadY - 14, 44, 28);\n      ctx.strokeStyle = P.bg;\n      ctx.lineWidth = 1.5;\n      ctx.strokeRect(bx - 22, roadY - 14, 44, 28);\n      ctx.fillStyle = \"#ffffff\";\n      ctx.font = \"600 10px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"OLEV\", bx - 13, roadY + 4);\n\n      ctx.fillStyle = P.text;\n      ctx.font = \"600 11.5px 'JetBrains Mono', monospace\";\n      ctx.fillText(\"UTM LANE TRAJECTORY · DOTS: RAW GPS MULTIPATH · LINE: ESTIMATED PATH\", 30, 26);\n    });\n\n    function updateOlevSim() {\n      var posPct = parseInt(olevPos.value, 10);\n      var velKmh = parseInt(olevVel.value, 10);\n      var mpNoise = parseFloat(olevMp.value);\n      document.getElementById(\"olev-lbl-pos\").textContent = posPct + \"%\";\n      document.getElementById(\"olev-lbl-vel\").textContent = velKmh + \" km/h\";\n      document.getElementById(\"olev-lbl-mp\").textContent = mpNoise.toFixed(1) + \" m\";\n\n      var velMs = (velKmh / 3.6) * 0.9;\n      var busM = posPct * 2.0;\n      var segStartM = 130.0, segEndM = 176.0;\n      var dRem = segStartM - busM;\n      var etaSec = dRem > 0 ? (dRem / Math.max(1, velMs)) : 0;\n\n      var invState = \"STANDBY (OFF)\";\n      var invKind = \"dim\";\n      var invCss = \"var(--text-dim)\";\n      if (busM >= segStartM && busM <= segEndM) {\n        invState = \"85kHz POWER ON\";\n        invKind = \"ok\";\n        invCss = \"var(--ok)\";\n      } else if (dRem > 0 && etaSec <= 3.2) {\n        invState = \"PRE-HEAT READY\";\n        invKind = \"warn\";\n        invCss = \"var(--warn)\";\n      }\n\n      var rawDev = 0.12 + mpNoise * 0.42;\n      var trimDev = 0.11 + mpNoise * 0.07;\n      var shownDev = useTrim ? trimDev : rawDev;\n      var supRate = ((1 - trimDev / Math.max(0.01, rawDev)) * 100).toFixed(1);\n\n      window.SB.stat(\"olev-st-dev\", shownDev.toFixed(2) + \" m\");\n      window.SB.stat(\"olev-st-sup\", useTrim ? supRate + \"%\" : \"0.0% (OFF)\");\n      window.SB.stat(\"olev-st-eta\", dRem > 0 ? etaSec.toFixed(2) + \" s\" : (busM <= segEndM ? \"IN ZONE\" : \"PASSED\"));\n      window.SB.stat(\"olev-st-inv\", invState);\n\n      document.getElementById(\"olev-readout\").innerHTML =\n        \"Bus UTM X: <strong>\" + busM.toFixed(1) + \" m</strong> · Conservative Speed (0.9x): <strong>\" + velMs.toFixed(1) + \" m/s</strong> · \" +\n        \"Segment [130m ~ 176m] Inverter: <strong style='color:\" + invCss + \"'>\" + invState + \"</strong>\";\n\n      olevState = { posPct: posPct, mpNoise: mpNoise, invState: invState, invKind: invKind };\n      if (olevChart) olevChart.redraw();\n    }\n\n    [olevPos, olevVel, olevMp].forEach(function (el) {\n      if (el) el.addEventListener(\"input\", updateOlevSim);\n    });\n    document.querySelectorAll(\"#olev-trim-btns button\").forEach(function (b) {\n      b.addEventListener(\"click\", function () {\n        document.querySelectorAll(\"#olev-trim-btns button\").forEach(function (x) { x.classList.remove(\"on\"); });\n        b.classList.add(\"on\");\n        useTrim = b.getAttribute(\"data-trim\") === \"1\";\n        updateOlevSim();\n      });\n    });\n    updateOlevSim();\n  });\n  <\/script>\n\n</main>\n</body>\n</html>\n", "automation": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ch.04 지능형 비전 자동화 · 마르코프 확률 모델링 &amp; 특수 임베디드 시스템 · KAIST Grad Works &amp; Workspace Guidebook</title>\n<meta name=\"description\" content=\"Ch.04 지능형 비전 자동화 · 마르코프 확률 모델링 &amp; 특수 임베디드 시스템 — KAIST Grad Works &amp; GoogleDrive Master Workspace Interactive Guidebook\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css\">\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js\"><\/script>\n{{__SB_STYLE_CSS__}}\n{{__SB_GLOSSARY_CSS__}}\n{{__SB_GLOSSARY_DATA_JS__}}\n{{__SB_COMMON_JS__}}\n{{__SB_GLOSSARY_JS__}}\n</head>\n<body data-chapter=\"automation\" data-root=\"../\">\n<main class=\"chapter\">\n  <header class=\"chapter-hero\">\n    <div class=\"eyebrow\">CHAPTER 04 · THEMES 3 &amp; 4 — INTELLIGENT AUTOMATION, MARKOV &amp; SPECIALTY SYSTEMS</div>\n    <h1>지능형 비전 자동화 · 마르코프 확률 모델링 &amp; 특수 임베디드 시스템</h1>\n    <p class=\"lead\">\n      복잡한 동적 소프트웨어 환경과 극한 하드웨어 제약 아래에서 자율 제어와 최적 의사결정을 달성하기 위해,\n      Theme 3(<a class=\"src\" href=\"../../3_Intelligent_Automation/README.md\" target=\"_blank\" rel=\"noopener\" title=\"3_Intelligent_Automation/README.md\">Theme 3 README.md</a>, 7개 서브모듈)은 <strong>Win32 DirectInput 스캔코드 후킹 · 13-상태 비전 FSM · Faster R-CNN 객체 검출 · 흡수 마르코프 체인 · 제약 조합 최적화</strong>를 결합했고,\n      Theme 4(<a class=\"src\" href=\"../../4_Specialty_Systems/README.md\" target=\"_blank\" rel=\"noopener\" title=\"4_Specialty_Systems/README.md\">Theme 4 README.md</a>, 4개 서브모듈)는 <strong>Casio FX-9860G 128×64 베어메탈 게임 엔진</strong>과 <strong>3GPP/WINNER II 3D MIMO 무선 채널 시뮬레이터</strong>를 구현했습니다.\n    </p>\n    <ul class=\"objectives\">\n      <li>Win32 DirectInput 하드웨어 스캔코드 주입과 <strong>PyMaple 13-상태 우선순위 비전 상태 머신(FSM)</strong> 및 Faster R-CNN 검출 루프를 이해한다.</li>\n      <li>2연속 하락 시 100% 성공하는 비마르코프 찬스 타임을 1차 <strong>흡수 마르코프 체인(Absorbing Markov Chain)</strong>으로 정식화한 <code>StarForce.m</code> 모델을 실험한다.</li>\n      <li><strong>Casio FX-9860G 1-bit VRAM 그래픽 엔진</strong>과 <strong>WINNER II 3D MIMO 다중경로 빔포밍(Sim 07)</strong>의 동작 원리를 확인한다.</li>\n    </ul>\n  </header>\n\n  <section id=\"sec-fsm\">\n    <h2>저수준 입력 드라이버 후킹 &amp; 13-상태 우선순위 비전 상태 머신</h2>\n    <p>\n      DirectX 기반 클라이언트 환경에서는 일반적인 운영체제 가상 키보드 이벤트(<code>keybd_event</code>)가 DirectInput 폴링 루프에 의해 차단됩니다.\n      이를 해결하기 위해 <code>CMaple</code>(C#)과 <code>PyMaple</code>(<a class=\"src\" href=\"../../3_Intelligent_Automation/Vision_and_Driver_Automation/PyMaple/PyMaple2/pydetect.py#L4\" target=\"_blank\" rel=\"noopener\" title=\"3_Intelligent_Automation/Vision_and_Driver_Automation/PyMaple/PyMaple2/pydetect.py:4\">pydetect.py:4</a>)은 하드웨어 스캔코드(DIK Scancode) 주입 계층과\n      OpenCV + Faster R-CNN 멀티스케일 비전 피드백 루프를 계층화했습니다.\n    </p>\n\n    <figure class=\"diagram\">\n      <svg id=\"auto-svg\" viewBox=\"0 0 1080 320\" xmlns=\"http://www.w3.org/2000/svg\
